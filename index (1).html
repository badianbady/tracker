<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>JAI Tracker</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='32' fill='%231E9B36'/%3E%3Ccircle cx='32' cy='32' r='23' fill='none' stroke='white' stroke-width='5'/%3E%3Ctext x='32.5' y='44' text-anchor='middle' font-family='Arial' font-weight='700' font-size='30' fill='white'%3EJ%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Saira+Semi+Condensed:wght@500;600;700;800&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  :root {
    --green: #1E9B36; --green-deep: #116B26; --green-soft: #E3F5E7;
    --bg: #F3F6F4; --surface: #FFFFFF; --text: #102217; --muted: #5C6E63;
    --line: #DCE5DF; --other: #66788A; --warn: #C2410C; --danger: #B91C1C;
    --display: "Saira Semi Condensed", "Arial Narrow", Arial, sans-serif;
    --body: "Source Sans 3", "Segoe UI", Arial, sans-serif;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0C1610; --surface: #14211A; --text: #E6F0E9; --muted: #9AB0A2;
      --line: #24372C; --green-soft: #183A22; --other: #8FA1B3;
      color-scheme: dark;
    }
  }
  *, *::before, *::after { box-sizing: inherit; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--text); font: 16px/1.5 var(--body); display: flex; flex-direction: column; }
  a { color: var(--green); }
  h1, h2, h3 { font-family: var(--display); line-height: 1.1; margin: 0; }
  button, input { font: inherit; }
  :focus-visible { outline: 3px solid var(--green); outline-offset: 2px; }

  /* ---------- hlavička ---------- */
  header { background: var(--green); color: #fff; display: flex; align-items: center; gap: 18px; padding: 0 18px; height: 60px; flex: none; position: relative; z-index: 1000; }
  .brand { display: flex; align-items: center; gap: 10px; color: #fff; text-decoration: none; font-family: var(--display); font-weight: 800; font-size: 23px; white-space: nowrap; }
  nav { display: flex; gap: 4px; margin-left: auto; overflow-x: auto; }
  nav a { color: #fff; text-decoration: none; font-weight: 600; padding: 7px 12px; border-radius: 8px; white-space: nowrap; display: flex; align-items: center; gap: 8px; }
  nav a:hover { background: rgba(255,255,255,.14); }
  nav a.active { background: #fff; color: var(--green-deep); }
  nav .mini-av { width: 24px; height: 24px; font-size: 12px; }

  main { flex: 1; min-height: 0; position: relative; }
  .view { display: none; height: 100%; overflow-y: auto; }
  .view.on { display: block; }
  .page { max-width: 1060px; margin: 0 auto; padding: 32px 20px 60px; }

  /* ---------- mapa ---------- */
  #view-map { position: relative; overflow: hidden; }
  #map { position: absolute; inset: 0; background: var(--bg); }
  .air-panel { position: absolute; top: 16px; left: 16px; bottom: 16px; width: 300px; z-index: 500;
               background: var(--surface); border-radius: 14px; box-shadow: 0 6px 24px rgba(0,30,10,.18);
               display: flex; flex-direction: column; overflow: hidden; }
  .air-head { padding: 16px 18px 12px; border-bottom: 1px solid var(--line); }
  .air-head h2 { font-size: 22px; }
  .legend { display: flex; gap: 14px; font-size: 14px; color: var(--muted); margin-top: 6px; }
  .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 5px; }
  .air-list { overflow-y: auto; flex: 1; }
  .air-item { display: block; width: 100%; text-align: left; border: 0; background: none; color: inherit; cursor: pointer;
              padding: 12px 18px; border-bottom: 1px solid var(--line); border-left: 4px solid var(--other); }
  .air-item.jai { border-left-color: var(--green); }
  .air-item:hover { background: var(--green-soft); }
  .air-cs { font-family: var(--display); font-weight: 700; font-size: 19px; }
  .air-sub { font-size: 14px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .air-nums { font-size: 14px; margin-top: 2px; font-variant-numeric: tabular-nums; }
  .empty { padding: 22px 18px; color: var(--muted); }
  .plane-ic { background: none; border: 0; }
  .recent { border-top: 1px solid var(--line); flex: none; max-height: 45%; overflow-y: auto; }
  .recent h3 { font-size: 17px; padding: 12px 18px 4px; }
  .recent-item { display: flex; align-items: center; gap: 10px; padding: 8px 18px; color: var(--text); text-decoration: none; font-size: 14px; }
  .recent-item:hover { background: var(--green-soft); }
  .recent-item .score { font-size: 15px; min-width: 40px; }
  .recent-item div { min-width: 0; flex: 1; }
  .recent-item b { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ap-label { background: rgba(255,255,255,.92); border: 0; box-shadow: 0 1px 3px rgba(0,0,0,.25); color: #102217;
              font: 700 12px var(--display); padding: 0 5px; border-radius: 4px; }
  .ap-label::before { display: none; }
  .leaflet-control-layers { border-radius: 10px !important; font-family: var(--body); }
  .flight-map { height: 340px; border-radius: 14px; overflow: hidden; border: 1px solid var(--line); margin-bottom: 18px; display: none; }
  .flight-map.on { display: block; }
  tr.clickable { cursor: pointer; } tr.clickable:hover td { background: var(--green-soft); } tr.sel td { background: var(--green-soft); }
  .stream-btn { display: inline-flex; align-items: center; gap: 6px; background: #E11D48; color: #fff; text-decoration: none; font-weight: 700; font-size: 13px; padding: 3px 10px; border-radius: 999px; }
  .alt-legend { background: var(--surface); color: var(--text); padding: 8px 12px 6px; border-radius: 10px; box-shadow: 0 2px 10px rgba(0,0,0,.2); font: 600 12px var(--body); }
  .alt-legend .bar { height: 8px; width: 210px; border-radius: 4px; background: linear-gradient(90deg, #F97316 0%, #EAB308 10%, #22C55E 25%, #06B6D4 50%, #3B82F6 75%, #A855F7 100%); margin: 4px 0 2px; }
  .alt-legend .ticks { display: flex; justify-content: space-between; color: var(--muted); font-weight: 500; }
  .toast-wrap { position: absolute; top: 16px; left: 50%; transform: translateX(-50%); z-index: 900; display: flex; flex-direction: column; gap: 8px; align-items: center; pointer-events: none; }
  .toast { background: var(--surface); color: var(--text); border-left: 5px solid var(--other); border-radius: 12px; box-shadow: 0 6px 24px rgba(0,30,10,.25);
           padding: 10px 16px; display: flex; align-items: center; gap: 12px; pointer-events: auto; animation: toastIn .4s ease both; }
  .toast.jai { border-left-color: var(--green); }
  .toast b { font-family: var(--display); font-size: 18px; }
  @keyframes toastIn { from { opacity: 0; transform: translateY(-12px); } }
  @media (max-width: 700px) { .toast-wrap { top: 8px; width: calc(100% - 20px); } .alt-legend .bar { width: 150px; } }
  .tiles-dark { filter: invert(1) hue-rotate(180deg) brightness(.9) contrast(.9) saturate(.6); }
  .leaflet-popup-content { font-family: var(--body); font-size: 14px; }
  .pop-cs { font-family: var(--display); font-weight: 800; font-size: 20px; }
  @media (max-width: 700px) {
    .air-panel { top: auto; left: 10px; right: 10px; bottom: 10px; width: auto; max-height: 38%; }
    header { gap: 10px; padding: 0 10px; } .brand span { display: none; }
  }

  /* ---------- obecné prvky ---------- */
  .page-title { font-size: 38px; margin-bottom: 6px; }
  .lead { color: var(--muted); margin: 0 0 24px; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 22px; }
  .tabs { display: flex; gap: 6px; margin-bottom: 16px; }
  .tab { border: 1px solid var(--line); background: var(--surface); color: var(--text); padding: 7px 16px; border-radius: 999px; cursor: pointer; font-weight: 600; }
  .tab.on { background: var(--green); border-color: var(--green); color: #fff; }
  .table-wrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; }
  table { border-collapse: collapse; width: 100%; font-size: 15px; }
  th { text-align: left; font-weight: 600; color: var(--muted); font-size: 14px; padding: 12px 14px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  td { padding: 11px 14px; border-bottom: 1px solid var(--line); white-space: nowrap; font-variant-numeric: tabular-nums; }
  tr:last-child td { border-bottom: 0; }
  .rank { font-family: var(--display); font-weight: 800; font-size: 20px; color: var(--muted); width: 1%; }
  .pilot-cell { display: flex; align-items: center; gap: 10px; }
  .pilot-cell a { color: var(--text); font-weight: 600; text-decoration: none; }
  .pilot-cell a:hover { text-decoration: underline; }
  .av { width: 34px; height: 34px; border-radius: 50%; object-fit: cover; flex: none; display: grid; place-items: center;
        background: var(--other); color: #fff; font-weight: 700; font-size: 14px; }
  .av.jai { background: var(--green); }
  .badge { display: inline-flex; align-items: center; gap: 4px; background: var(--green-soft); color: var(--green-deep); font-weight: 700;
           font-size: 12px; padding: 2px 8px; border-radius: 999px; }
  @media (prefers-color-scheme: dark) { .badge { color: #8BE3A0; } }
  .score { font-family: var(--display); font-weight: 800; font-size: 19px; padding: 1px 10px; border-radius: 8px; color: #fff; display: inline-block; min-width: 46px; text-align: center; }
  .s-hi { background: var(--green); } .s-mid { background: #8A9A18; } .s-lo { background: var(--warn); } .s-bad { background: var(--danger); }
  .muted { color: var(--muted); }
  .btn { background: var(--green); color: #fff; border: 0; border-radius: 10px; padding: 11px 20px; font-weight: 700; cursor: pointer; text-decoration: none; display: inline-block; }
  .btn:hover { background: var(--green-deep); }
  .btn.ghost { background: transparent; color: var(--green); border: 1.5px solid var(--green); }
  .btn:disabled { opacity: .6; cursor: default; }
  .field { display: flex; flex-direction: column; gap: 5px; margin-bottom: 14px; }
  .field label { font-weight: 600; font-size: 15px; }
  .field input { padding: 10px 12px; border: 1.5px solid var(--line); border-radius: 10px; background: var(--bg); color: var(--text); }
  .field small { color: var(--muted); }
  .msg { padding: 10px 14px; border-radius: 10px; margin-bottom: 14px; font-weight: 500; }
  .msg.err { background: #FDE8E8; color: var(--danger); } .msg.ok { background: var(--green-soft); color: var(--green-deep); }
  @media (prefers-color-scheme: dark) { .msg.err { background: #3A1515; color: #FCA5A5; } .msg.ok { color: #8BE3A0; } }
  .grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; }

  /* ---------- profil ---------- */
  .profile-head { display: flex; align-items: center; gap: 22px; margin-bottom: 26px; flex-wrap: wrap; }
  .profile-head .av { width: 96px; height: 96px; font-size: 36px; }
  .profile-name { font-size: 42px; }
  .rank-line { display: flex; align-items: center; gap: 10px; margin-top: 6px; flex-wrap: wrap; color: var(--muted); font-weight: 600; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 28px; }
  .stat { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; }
  .stat b { display: block; font-family: var(--display); font-size: 32px; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .stat span { color: var(--muted); font-size: 14px; font-weight: 600; }
  .rank-bar { height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; max-width: 340px; margin-top: 8px; }
  .rank-bar i { display: block; height: 100%; background: var(--green); }
  .section-title { font-size: 26px; margin: 8px 0 12px; }

  .pilots-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }
  .pilot-card { display: flex; gap: 12px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; color: var(--text); text-decoration: none; }
  .pilot-card:hover { border-color: var(--green); }
  .pilot-card .av { width: 48px; height: 48px; font-size: 18px; }
  .pilot-card b { font-size: 17px; }
</style>
</head>
<body>
<header>
  <a class="brand" href="#/">
    <svg width="36" height="36" viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="27" fill="none" stroke="#fff" stroke-width="5"/><text x="32.5" y="44.5" text-anchor="middle" font-family="Saira Semi Condensed, Arial" font-weight="800" font-size="34" fill="#fff">J</text></svg>
    <span id="appName">JAI Tracker</span>
  </a>
  <nav>
    <a href="#/" data-r="map">Mapa</a>
    <a href="#/zebricek" data-r="zebricek">Žebříček</a>
    <a href="#/piloti" data-r="piloti">Piloti</a>
    <a href="#/ucet" data-r="ucet" id="navAccount">Přihlásit</a>
  </nav>
</header>

<main>
  <section class="view" id="view-map">
    <div id="map"></div>
    <div class="toast-wrap" id="toasts" aria-live="polite"></div>
    <aside class="air-panel">
      <div class="air-head">
        <h2 id="airCount">Ve vzduchu</h2>
        <div class="legend"><span><i class="dot" style="background:var(--green)"></i>Jáchym Air</span><span><i class="dot" style="background:var(--other)"></i>Ostatní piloti</span></div>
      </div>
      <div class="air-list" id="airList"><div class="empty">Načítám…</div></div>
      <div class="recent"><h3>Poslední přistání</h3><div id="recentList"><div class="empty">Načítám…</div></div></div>
    </aside>
  </section>
  <section class="view" id="view-zebricek"><div class="page" id="zebricek"></div></section>
  <section class="view" id="view-piloti"><div class="page" id="piloti"></div></section>
  <section class="view" id="view-pilot"><div class="page" id="pilot"></div></section>
  <section class="view" id="view-ucet"><div class="page" id="ucet"></div></section>
</main>

<script src="config.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
<script>
const CFG = window.JAI_CONFIG || {};
document.getElementById("appName").textContent = CFG.APP_NAME || "JAI Tracker";
document.title = CFG.APP_NAME || "JAI Tracker";

const notConfigured = !CFG.SUPABASE_URL || CFG.SUPABASE_URL.startsWith("VLOZ");
const sb = notConfigured ? null : supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_KEY);

/* ---------- pomocné funkce ---------- */
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const nf = new Intl.NumberFormat("cs-CZ");
const fmt1 = n => Number(n).toLocaleString("cs-CZ", { maximumFractionDigits: 1 });
const fmtDate = d => new Date(d).toLocaleDateString("cs-CZ", { day: "numeric", month: "numeric", year: "numeric" });
const fmtDur = min => { min = Math.round(min || 0); return `${Math.floor(min / 60)}:${String(min % 60).padStart(2, "0")}`; };
const scoreCls = s => s >= 8 ? "s-hi" : s >= 6 ? "s-mid" : s >= 3 ? "s-lo" : "s-bad";
const scoreHtml = s => s == null ? '<span class="muted">–</span>' : `<span class="score ${scoreCls(s)}">${fmt1(s)}</span>`;
const route = f => `${esc(f.dep_icao || "????")} → ${esc(f.arr_icao || "????")}`;

let jaiSet = new Set();
let me = null;          // { user, profile }

function avatar(p, isJai, cls = "") {
  const name = p?.username || "?";
  if (p?.avatar_url) return `<img class="av ${cls}" src="${esc(p.avatar_url)}" alt="">`;
  return `<span class="av ${isJai ? "jai" : ""} ${cls}" aria-hidden="true">${esc(name.slice(0, 2).toUpperCase())}</span>`;
}
function pilotLink(p, isJai) {
  if (!p) return '<span class="muted">Neznámý pilot</span>';
  return `<div class="pilot-cell">${avatar(p, isJai)}<a href="#/pilot/${encodeURIComponent(p.username)}">${esc(p.username)}</a>${isJai ? '<span class="badge">JAI</span>' : ""}</div>`;
}

const RANKS = [
  { name: "Kadet", h: 0 }, { name: "Second Officer", h: 10 }, { name: "First Officer", h: 50 },
  { name: "Kapitán", h: 150 }, { name: "Senior kapitán", h: 400 }
];
function rankOf(hours) {
  let i = 0; while (i + 1 < RANKS.length && hours >= RANKS[i + 1].h) i++;
  const next = RANKS[i + 1];
  const pct = next ? Math.min(100, (hours - RANKS[i].h) / (next.h - RANKS[i].h) * 100) : 100;
  return { name: RANKS[i].name, next, pct };
}

async function loadJai() {
  if (!sb) return;
  const { data } = await sb.from("jai_members").select("user_id");
  jaiSet = new Set((data || []).map(r => r.user_id));
}

/* ---------- směrování ---------- */
const views = ["map", "zebricek", "piloti", "pilot", "ucet"];
async function router() {
  const parts = location.hash.replace(/^#\/?/, "").split("/");
  const r = parts[0] || "map";
  const view = views.includes(r) ? r : "map";
  views.forEach(v => $("view-" + v).classList.toggle("on", v === view));
  document.querySelectorAll("nav a").forEach(a => a.classList.toggle("active", a.dataset.r === (view === "pilot" ? "piloti" : view)));
  if (notConfigured) { showNotConfigured(view); return; }
  if (view === "map") { initMap(); setTimeout(() => map.invalidateSize(), 50); }
  if (view === "zebricek") renderLeaderboard();
  if (view === "piloti") renderPilots();
  if (view === "pilot") renderPilot(decodeURIComponent(parts[1] || ""));
  if (view === "ucet") renderAccount();
}
window.addEventListener("hashchange", router);

function showNotConfigured(view) {
  const box = `<div class="page"><div class="card"><h2>Web ještě není propojený se Supabase</h2>
    <p>Otevři soubor <b>config.js</b> a vyplň SUPABASE_URL a SUPABASE_KEY.</p></div></div>`;
  if (view === "map") $("airList").innerHTML = '<div class="empty">Vyplň config.js</div>';
  else $(view).innerHTML = box;
}

/* ---------- živá mapa ---------- */
let map = null, markers = new Map(), trails = new Map(), liveTimer = null, liveRows = [], liveTick = 0;
let airports = [], airportLayer = null, apRenderer = null, trailRenderer = null, lastFlightId = null;

const ALT_STOPS = [[0, [249, 115, 22]], [4000, [234, 179, 8]], [10000, [34, 197, 94]], [20000, [6, 182, 212]], [30000, [59, 130, 246]], [40000, [168, 85, 247]]];
function altColor(alt) {
  alt = Math.max(0, alt || 0);
  for (let i = 1; i < ALT_STOPS.length; i++) {
    const [a1, c1] = ALT_STOPS[i - 1], [a2, c2] = ALT_STOPS[i];
    if (alt <= a2) { const t = (alt - a1) / (a2 - a1); return `rgb(${c1.map((v, k) => Math.round(v + (c2[k] - v) * t)).join(",")})`; }
  }
  return "rgb(168,85,247)";
}
// nakreslí trasu obarvenou podle výšky (jako Flightradar24)
function drawAltTrail(group, pts, weight, renderer) {
  group.clearLayers();
  for (let i = 1; i < pts.length; i++) {
    const a = pts[i - 1], b = pts[i];
    L.polyline([[a[0], a[1]], [b[0], b[1]]], { color: altColor(((a[2] || 0) + (b[2] || 0)) / 2), weight, opacity: .95, lineCap: "round", renderer }).addTo(group);
  }
}
const PLANE = "M12 2c.8 0 1.3.8 1.3 1.8V9l7.7 4.6v2l-7.7-2.4v4.9l2.2 1.7V21L12 20.1 8.5 21v-1.2l2.2-1.7v-4.9L3 15.6v-2L10.7 9V3.8C10.7 2.8 11.2 2 12 2z";

function planeIcon(hdg, isJai) {
  const col = isJai ? "#1E9B36" : "#66788A";
  const size = isJai ? 34 : 28;
  return L.divIcon({
    className: "plane-ic", iconSize: [size, size], iconAnchor: [size / 2, size / 2],
    html: `<svg width="${size}" height="${size}" viewBox="0 0 24 24" style="transform:rotate(${hdg || 0}deg);filter:drop-shadow(0 1px 2px rgba(0,0,0,.35))"><path d="${PLANE}" fill="${col}" stroke="#fff" stroke-width="1.2"/></svg>`
  });
}

function initMap() {
  if (map) return;
  const dark = matchMedia("(prefers-color-scheme: dark)").matches;
  map = L.map("map", { zoomControl: false, worldCopyJump: true }).setView([49.8, 15.5], 5);
  L.control.zoom({ position: "topright" }).addTo(map);
  const osm = L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom: 19, className: dark ? "tiles-dark" : "",
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
  }).addTo(map);
  const sat = L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}", {
    maxZoom: 19, attribution: "Tiles &copy; Esri, Maxar, Earthstar Geographics"
  });
  apRenderer = L.canvas({ padding: 0.3 });
  trailRenderer = L.canvas({ padding: 0.5 });
  const legend = L.control({ position: "bottomright" });
  legend.onAdd = () => { const d = L.DomUtil.create("div", "alt-legend");
    d.innerHTML = 'Výška trasy (ft)<div class="bar"></div><div class="ticks"><span>0</span><span>10k</span><span>20k</span><span>30k</span><span>40k</span></div>'; return d; };
  legend.addTo(map);
  airportLayer = L.layerGroup().addTo(map);
  L.control.layers({ "Mapa": osm, "Satelit": sat }, { "Letiště": airportLayer }, { position: "topright" }).addTo(map);
  map.on("moveend", drawAirports);
  fetch("letiste.json").then(r => r.json()).then(d => { airports = d; drawAirports(); }).catch(() => {});
  refreshLive();
  liveTimer = setInterval(refreshLive, 8000);
}

function drawAirports() {
  if (!map || !airportLayer || !map.hasLayer(airportLayer)) return;
  airportLayer.clearLayers();
  const z = map.getZoom(), b = map.getBounds().pad(0.1);
  const minSize = z >= 7 ? 2 : z >= 4 ? 3 : 9;
  let n = 0;
  for (const [icao, name, lat, lon, size, city] of airports) {
    if (size < minSize || !b.contains([lat, lon])) continue;
    if (++n > 800) break;
    const big = size === 3;
    const c = L.circleMarker([lat, lon], {
      renderer: apRenderer, radius: big ? 6 : 4.5, weight: 2.5,
      color: big ? "#116B26" : "#5C6E63", fillColor: "#fff", fillOpacity: 1
    }).addTo(airportLayer);
    const here = liveRows.filter(r => r.lat != null && Math.abs(r.lat - lat) < 0.06 && Math.abs(r.lon - lon) < 0.09);
    c.bindPopup(`<div class="pop-cs">${esc(icao)}</div><div><b>${esc(name)}</b></div>${city ? `<div class="muted">${esc(city)}</div>` : ""}
      ${here.length ? `<div style="margin-top:6px">Na letišti: ${here.map(r => esc(r.callsign || r.profiles?.username)).join(", ")}</div>` : ""}
      <div class="muted" style="margin-top:6px">METAR a linky Jáchym Air brzy</div>`);
    if (z >= 8 || (big && z >= 6)) c.bindTooltip(esc(icao), { permanent: true, direction: "right", offset: [6, 0], className: "ap-label" });
    else c.bindTooltip(`${esc(icao)} – ${esc(name)}`, { direction: "top" });
  }
}

function verdictOf(s) {
  return s >= 9.5 ? "Máslo!" : s >= 8 ? "Výborné přistání" : s >= 6 ? "Dobré přistání" : s >= 4 ? "Tvrdší přistání" : s >= 2 ? "Tvrdé přistání" : "Kontrola podvozku";
}
function landingToast(f) {
  const t = document.createElement("div");
  t.className = "toast" + (jaiSet.has(f.user_id) ? " jai" : "");
  t.innerHTML = `${scoreHtml(f.score)}<div><b>🛬 ${esc(f.callsign || f.profiles?.username)}</b> přistál${f.arr_icao ? " v " + esc(f.arr_icao) : ""}
    <div class="muted">${nf.format(f.fpm)} fpm · ${fmt1(f.g)} G · ${verdictOf(f.score)}</div></div>`;
  $("toasts").prepend(t);
  setTimeout(() => t.remove(), 15000);
}
async function refreshRecent() {
  const { data } = await sb.from("flights").select("id, user_id, callsign, arr_icao, score, fpm, g, landed_at, profiles(username)")
    .order("landed_at", { ascending: false }).limit(6);
  if (data?.length) {
    if (lastFlightId !== null) data.filter(f => f.id > lastFlightId).reverse().forEach(landingToast);
    lastFlightId = Math.max(lastFlightId ?? 0, ...data.map(f => f.id));
  }
  $("recentList").innerHTML = !data?.length ? '<div class="empty">Zatím žádná přistání.</div>' : data.map(f => `
    <a class="recent-item" href="#/pilot/${encodeURIComponent(f.profiles?.username || "")}">${scoreHtml(f.score)}
      <div><b>${esc(f.callsign || f.profiles?.username)}${jaiSet.has(f.user_id) ? ' <span class="badge">JAI</span>' : ""}</b>
      <span class="muted">${esc(f.arr_icao || "?")} · ${nf.format(f.fpm)} fpm · ${timeAgo(f.landed_at)}</span></div></a>`).join("");
}
function timeAgo(d) {
  const m = Math.round((Date.now() - new Date(d)) / 60000);
  if (m < 1) return "právě teď"; if (m < 60) return `před ${m} min`;
  const h = Math.round(m / 60); if (h < 24) return `před ${h} h`;
  return fmtDate(d);
}

async function refreshLive() {
  if (liveTick++ % 2 === 0) refreshRecent();
  const since = new Date(Date.now() - 120000).toISOString();
  const { data, error } = await sb.from("live").select("*, profiles(username, avatar_url, stream_url)").gte("updated_at", since);
  if (error) { $("airList").innerHTML = `<div class="empty">Mapu se nepodařilo načíst: ${esc(error.message)}</div>`; return; }
  liveRows = data || [];
  const seen = new Set();
  for (const r of liveRows) {
    if (r.lat == null || r.lon == null) continue;
    const isJai = jaiSet.has(r.user_id);
    seen.add(r.user_id);
    const popup = `<div class="pop-cs">${esc(r.callsign || r.profiles?.username)}</div>
      <div><a href="#/pilot/${encodeURIComponent(r.profiles?.username || "")}">${esc(r.profiles?.username)}</a>${isJai ? ' <span class="badge">JAI</span>' : ""}</div>
      <div>${esc(r.aircraft || "")}</div>
      <div>${nf.format(r.alt || 0)} ft · ${r.gs || 0} kt · ${esc(r.phase || "")}</div>
      ${r.dep_icao ? `<div>Odlet: ${esc(r.dep_icao)}</div>` : ""}
      ${r.profiles?.stream_url ? `<div style="margin-top:6px"><a class="stream-btn" href="${esc(r.profiles.stream_url)}" target="_blank" rel="noopener">▶ Sledovat stream</a></div>` : ""}`;
    const pts = Array.isArray(r.trail) ? r.trail.slice() : [];
    if (pts.length) pts.push([r.lat, r.lon, r.alt || 0]);
    let tr = trails.get(r.user_id);
    if (pts.length > 1) {
      if (!tr) { tr = L.layerGroup().addTo(map); trails.set(r.user_id, tr); }
      drawAltTrail(tr, pts, isJai ? 4 : 3, trailRenderer);
    } else if (tr) { map.removeLayer(tr); trails.delete(r.user_id); }
    let m = markers.get(r.user_id);
    if (!m) {
      m = L.marker([r.lat, r.lon], { icon: planeIcon(r.hdg, isJai), zIndexOffset: isJai ? 1000 : 0 }).addTo(map);
      markers.set(r.user_id, m);
    } else {
      m.setLatLng([r.lat, r.lon]); m.setIcon(planeIcon(r.hdg, isJai));
    }
    m.bindPopup(popup);
  }
  for (const [id, m] of markers) if (!seen.has(id)) { map.removeLayer(m); markers.delete(id); }
  for (const [id, t] of trails) if (!seen.has(id)) { map.removeLayer(t); trails.delete(id); }

  const sorted = [...liveRows].sort((a, b) => (jaiSet.has(b.user_id) - jaiSet.has(a.user_id)) || (b.alt - a.alt));
  $("airCount").textContent = `Ve vzduchu (${sorted.filter(r => r.phase !== "Na zemi").length})`;
  $("airList").innerHTML = sorted.length ? sorted.map(r => `
    <button class="air-item ${jaiSet.has(r.user_id) ? "jai" : ""}" data-id="${esc(r.user_id)}">
      <div class="air-cs">${esc(r.callsign || r.profiles?.username)}</div>
      <div class="air-sub">${esc(r.profiles?.username)} · ${esc(r.aircraft || "")}</div>
      <div class="air-nums">${nf.format(r.alt || 0)} ft · ${r.gs || 0} kt · ${esc(r.phase || "")}${r.dep_icao ? " · z " + esc(r.dep_icao) : ""}</div>
    </button>`).join("")
    : '<div class="empty">Právě nikdo neletí. Spusť tracker a objevíš se tady.</div>';
  document.querySelectorAll(".air-item").forEach(b => b.onclick = () => {
    const m = markers.get(b.dataset.id); if (m) { map.setView(m.getLatLng(), Math.max(map.getZoom(), 8)); m.openPopup(); }
  });
}

let flightMap = null;
async function showFlightPath(id) {
  const box = $("flightMap");
  const { data: f } = await sb.from("flights").select("path, dep_icao, arr_icao").eq("id", id).maybeSingle();
  box.classList.add("on");
  if (flightMap) { flightMap.remove(); flightMap = null; }
  const dark = matchMedia("(prefers-color-scheme: dark)").matches;
  flightMap = L.map(box, { worldCopyJump: true });
  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 19, className: dark ? "tiles-dark" : "",
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>' }).addTo(flightMap);
  const pts = Array.isArray(f?.path) ? f.path : [];
  if (pts.length < 2) {
    flightMap.setView([49.8, 15.5], 4);
    L.popup().setLatLng([49.8, 15.5]).setContent("Tento let nemá uloženou trasu (ukládá se od trackeru 0.3).").openOn(flightMap);
    return;
  }
  drawAltTrail(L.layerGroup().addTo(flightMap), pts, 4.5, L.canvas());
  const line = L.polyline(pts.map(p => [p[0], p[1]]), { opacity: 0, interactive: false }).addTo(flightMap);
  L.circleMarker([pts[0][0], pts[0][1]], { radius: 6, color: "#116B26", fillColor: "#fff", fillOpacity: 1, weight: 3 }).bindTooltip("Vzlet " + (f.dep_icao || "")).addTo(flightMap);
  L.circleMarker([pts[pts.length - 1][0], pts[pts.length - 1][1]], { radius: 6, color: "#fff", fillColor: "#1E9B36", fillOpacity: 1, weight: 3 }).bindTooltip("Přistání " + (f.arr_icao || "")).addTo(flightMap);
  flightMap.fitBounds(line.getBounds().pad(0.2));
  box.scrollIntoView({ behavior: "smooth", block: "nearest" });
}

async function onAuthSubmit(e) {

      await loadMe(); location.hash = "#/ucet"; renderAccount({ ok: true, text: "Jsi přihlášen. Vítej zpět!" });
    } else {
      const username = $("fUser").value.trim(), callsign = $("fCs").value.trim().toUpperCase();
      const { data: taken } = await sb.from("profiles").select("id").ilike("username", username.replace(/[_%\\]/g, m => "\\" + m)).limit(1);
      if (taken?.length) throw new Error("Toto uživatelské jméno už někdo má.");
      const { data, error } = await sb.auth.signUp({ email, password, options: { data: { username, callsign } } });
      if (error) throw new Error(error.message);
      if (!data.session) { authMode = "login"; renderAccount({ ok: true, text: "Účet vytvořen. Potvrď ho odkazem v e-mailu a pak se přihlas." }); return; }
      await loadMe(); renderAccount({ ok: true, text: "Účet vytvořen. Vítej na palubě!" });
    }
  } catch (err) { renderAccount({ ok: false, text: err.message }); }
}

async function onProfileSubmit(e) {
  e.preventDefault();
  const btn = e.target.querySelector("button"); btn.disabled = true;
  try {
    const stream = $("pStream").value.trim();
    if (stream && !/^https:\/\/(www\.|m\.)?(twitch\.tv|youtube\.com|youtu\.be|kick\.com)\//.test(stream)) throw new Error("Odkaz na stream musí vést na Twitch, YouTube nebo Kick (začínat https://).");
    const upd = { username: $("pUser").value.trim(), callsign: $("pCs").value.trim().toUpperCase() || null, stream_url: stream || null };
    const file = $("fAv").files[0];
    if (file) {
      if (file.size > 2 * 1024 * 1024) throw new Error("Obrázek je větší než 2 MB.");
      const ext = (file.name.split(".").pop() || "png").toLowerCase();
      const path = `${me.user.id}/avatar-${Date.now()}.${ext}`;
      const { error: upErr } = await sb.storage.from("avatars").upload(path, file, { upsert: true, contentType: file.type });
      if (upErr) throw new Error(upErr.message);
      upd.avatar_url = sb.storage.from("avatars").getPublicUrl(path).data.publicUrl;
    }
    const { error } = await sb.from("profiles").update(upd).eq("id", me.user.id);
    if (error) throw new Error(error.code === "23505" ? "Toto uživatelské jméno už někdo má." : error.message);
    await loadMe(); renderAccount({ ok: true, text: "Profil uložen." });
  } catch (err) { renderAccount({ ok: false, text: err.message }); }
}

/* ---------- start ---------- */
(async () => {
  if (sb) {
    await loadJai();
    await loadMe();
    sb.auth.onAuthStateChange(() => setTimeout(loadMe, 0));
    setInterval(loadJai, 300000);
  }
  router();
})();
</script>
