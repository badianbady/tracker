  :root {
    --green: #1E9B36; --green-deep: #116B26; --green-soft: #E3F5E7;
    --bg: #F3F6F4; --surface: #FFFFFF; --text: #102217; --muted: #5C6E63;
    --line: #DCE5DF; --other: #66788A; --warn: #C2410C; --danger: #B91C1C;
    --display: "Saira Semi Condensed", "Arial Narrow", Arial, sans-serif;
    --body: "Source Sans 3", "Segoe UI", Arial, sans-serif;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0C1610; --surface: #14211A; --text: #E6F0E9; --muted: #9AB0A2;
      --line: #24372C; --green-soft: #183A22; --other: #8FA1B3;
      color-scheme: dark;
    }
  }
  *, *::before, *::after { box-sizing: inherit; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--text); font: 16px/1.5 var(--body); display: flex; flex-direction: column; }
  a { color: var(--green); }
  h1, h2, h3 { font-family: var(--display); line-height: 1.1; margin: 0; }
  button, input { font: inherit; }
  :focus-visible { outline: 3px solid var(--green); outline-offset: 2px; }

  /* ---------- hlavička ---------- */
  header { background: var(--green); color: #fff; display: flex; align-items: center; gap: 18px; padding: 0 18px; height: 60px; flex: none; position: relative; z-index: 1000; }
  .brand { display: flex; align-items: center; gap: 10px; color: #fff; text-decoration: none; font-family: var(--display); font-weight: 800; font-size: 23px; white-space: nowrap; }
  nav { display: flex; gap: 4px; margin-left: auto; overflow-x: auto; }
  nav a { color: #fff; text-decoration: none; font-weight: 600; padding: 7px 12px; border-radius: 8px; white-space: nowrap; display: flex; align-items: center; gap: 8px; }
  nav a:hover { background: rgba(255,255,255,.14); }
  nav a.active { background: #fff; color: var(--green-deep); }
  nav .mini-av { width: 24px; height: 24px; font-size: 12px; }

  main { flex: 1; min-height: 0; position: relative; }
  .view { display: none; height: 100%; overflow-y: auto; }
  .view.on { display: block; }
  .page { max-width: 1060px; margin: 0 auto; padding: 32px 20px 60px; }

  /* ---------- mapa ---------- */
  #view-map { position: relative; overflow: hidden; }
  #map { position: absolute; inset: 0; background: var(--bg); }
  .air-panel { position: absolute; top: 16px; left: 16px; bottom: 16px; width: 300px; z-index: 500;
               background: var(--surface); border-radius: 14px; box-shadow: 0 6px 24px rgba(0,30,10,.18);
               display: flex; flex-direction: column; overflow: hidden; }
  .air-head { padding: 16px 18px 12px; border-bottom: 1px solid var(--line); }
  .air-head h2 { font-size: 22px; }
  .legend { display: flex; gap: 14px; font-size: 14px; color: var(--muted); margin-top: 6px; }
  .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 5px; }
  .air-list { overflow-y: auto; flex: 1; }
  .air-item { display: block; width: 100%; text-align: left; border: 0; background: none; color: inherit; cursor: pointer;
              padding: 12px 18px; border-bottom: 1px solid var(--line); border-left: 4px solid var(--other); }
  .air-item.jai { border-left-color: var(--green); }
  .air-item:hover { background: var(--green-soft); }
  .air-cs { font-family: var(--display); font-weight: 700; font-size: 19px; }
  .air-sub { font-size: 14px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .air-nums { font-size: 14px; margin-top: 2px; font-variant-numeric: tabular-nums; }
  .empty { padding: 22px 18px; color: var(--muted); }
  .plane-ic { background: none; border: 0; }
  .recent { border-top: 1px solid var(--line); flex: none; max-height: 45%; overflow-y: auto; }
  .recent h3 { font-size: 17px; padding: 12px 18px 4px; }
  .recent-item { display: flex; align-items: center; gap: 10px; padding: 8px 18px; color: var(--text); text-decoration: none; font-size: 14px; }
  .recent-item:hover { background: var(--green-soft); }
  .recent-item .score { font-size: 15px; min-width: 40px; }
  .recent-item div { min-width: 0; flex: 1; }
  .recent-item b { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ap-label { background: rgba(255,255,255,.92); border: 0; box-shadow: 0 1px 3px rgba(0,0,0,.25); color: #102217;
              font: 700 12px var(--display); padding: 0 5px; border-radius: 4px; }
  .ap-label::before { display: none; }
  .leaflet-control-layers { border-radius: 10px !important; font-family: var(--body); }
  .flight-map { height: 340px; border-radius: 14px; overflow: hidden; border: 1px solid var(--line); margin-bottom: 18px; display: none; }
  .flight-map.on { display: block; }
  tr.clickable { cursor: pointer; } tr.clickable:hover td { background: var(--green-soft); } tr.sel td { background: var(--green-soft); }
  .stream-btn { display: inline-flex; align-items: center; gap: 6px; background: #E11D48; color: #fff; text-decoration: none; font-weight: 700; font-size: 13px; padding: 3px 10px; border-radius: 999px; }
  .alt-legend { background: var(--surface); color: var(--text); padding: 8px 12px 6px; border-radius: 10px; box-shadow: 0 2px 10px rgba(0,0,0,.2); font: 600 12px var(--body); }
  .alt-legend .bar { height: 8px; width: 210px; border-radius: 4px; background: linear-gradient(90deg, #F97316 0%, #EAB308 10%, #22C55E 25%, #06B6D4 50%, #3B82F6 75%, #A855F7 100%); margin: 4px 0 2px; }
  .alt-legend .ticks { display: flex; justify-content: space-between; color: var(--muted); font-weight: 500; }
  .toast-wrap { position: absolute; top: 16px; left: 50%; transform: translateX(-50%); z-index: 900; display: flex; flex-direction: column; gap: 8px; align-items: center; pointer-events: none; }
  .toast { background: var(--surface); color: var(--text); border-left: 5px solid var(--other); border-radius: 12px; box-shadow: 0 6px 24px rgba(0,30,10,.25);
           padding: 10px 16px; display: flex; align-items: center; gap: 12px; pointer-events: auto; animation: toastIn .4s ease both; }
  .toast.jai { border-left-color: var(--green); }
  .toast b { font-family: var(--display); font-size: 18px; }
  @keyframes toastIn { from { opacity: 0; transform: translateY(-12px); } }
  @media (max-width: 700px) { .toast-wrap { top: 8px; width: calc(100% - 20px); } .alt-legend .bar { width: 150px; } }
  .app-pill { display: none; align-items: center; gap: 7px; background: rgba(0,0,0,.18); color: #fff; text-decoration: none;
              font-weight: 700; font-size: 14px; padding: 6px 12px; border-radius: 999px; white-space: nowrap; }
  .app-pill .led { width: 9px; height: 9px; border-radius: 50%; background: #FDBA74; }
  .app-pill.ok .led { background: #86EFAC; box-shadow: 0 0 0 3px rgba(134,239,172,.25); }
  .app-pill.upd { background: #FEF3C7; color: #78350F; }
  body.app .app-pill { display: inline-flex; }
  body.app #navTracker { display: flex !important; }
  .tr-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(380px, 1fr)); gap: 16px; }
  .tr-row { display: flex; gap: 12px; padding: 7px 0; border-bottom: 1px solid var(--line); }
  .tr-row:last-child { border-bottom: 0; }
  .tr-row span:first-child { width: 112px; color: var(--muted); flex: none; }
  .tr-row b.ok { color: var(--green); } .tr-row b.warn { color: var(--warn); }
  .tr-wide { grid-column: 1 / -1; }
  .tr-nums { display: grid; grid-template-columns: repeat(4, 1fr); text-align: center; gap: 8px; }
  .tr-nums b { display: block; font-family: var(--display); font-size: 34px; line-height: 1.15; font-variant-numeric: tabular-nums; }
  .tr-nums span { color: var(--muted); font-size: 13px; }
  .card.tr-landing { display: flex; align-items: stretch; padding: 0; overflow: hidden; }
  .tr-landing .big.s-hi { background: var(--green); } .tr-landing .big.s-mid { background: #8A9A18; }
  .tr-landing .big.s-lo { background: var(--warn); } .tr-landing .big.s-bad { background: var(--danger); }
  .tr-landing .big { background: var(--other); color: #fff; font-family: var(--display); font-weight: 800; font-size: 46px;
                     min-width: 120px; display: grid; place-items: center; }
  .tr-landing .info { padding: 16px 22px; align-self: center; }
  .tr-log { font-size: 13px; max-height: 220px; overflow-y: auto; white-space: pre-wrap; color: var(--muted); }
  .upd-banner { background: #FEF3C7; color: #78350F; border-radius: 14px; padding: 14px 18px; display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; font-weight: 600; }
  .td-pin { position: absolute; left: 50%; bottom: 8px; transform: translateX(-50%); white-space: nowrap; color: #fff;
            font: 800 13px var(--display); padding: 3px 8px 4px; border-radius: 8px; border: 2px solid #fff; box-shadow: 0 2px 6px rgba(0,0,0,.35); line-height: 1.1; }
  .td-pin small { font-weight: 600; font-size: 10px; opacity: .9; margin-left: 2px; }
  .td-pin::after { content: ""; position: absolute; left: 50%; bottom: -8px; transform: translateX(-50%); border: 6px solid transparent; border-top-color: #fff; }
  .td-dot { position: absolute; left: 50%; bottom: -3px; width: 8px; height: 8px; margin-left: -4px; border-radius: 50%; border: 2px solid #fff; }
  .td-ic { background: none; border: 0; }
  .zoom-low .td-ic:not(.td-focus) { display: none; }
  .lcard { min-width: 260px; font-family: var(--body); }
  .lcard-head { display: flex; gap: 10px; align-items: center; margin-bottom: 8px; }
  .lcard-head b { font-family: var(--display); font-size: 18px; display: block; line-height: 1.1; }
  .lcard dl { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; margin: 0; font-size: 14px; }
  .lcard dt { color: var(--muted); } .lcard dd { margin: 0; font-weight: 600; }
  .ap-label .cat { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 4px; vertical-align: 1px; }
  .ap-label .wx { font-weight: 600; margin-left: 4px; }
  .cat-VFR { background: #16A34A; } .cat-MVFR { background: #2563EB; } .cat-IFR { background: #DC2626; } .cat-LIFR { background: #C026D3; }
  .metar-box { font-size: 14px; margin-top: 8px; border-top: 1px solid var(--line); padding-top: 8px; }
  .metar-box dl { display: grid; grid-template-columns: auto 1fr; gap: 3px 12px; margin: 6px 0; }
  .metar-box dt { color: var(--muted); } .metar-box dd { margin: 0; font-weight: 600; }
  .metar-raw { font-family: ui-monospace, Consolas, monospace; font-size: 12px; background: var(--bg); padding: 6px 8px; border-radius: 6px; white-space: normal; word-break: break-word; }
  .cat-chip { color: #fff; font-weight: 700; font-size: 12px; padding: 1px 8px; border-radius: 999px; }
  .flight-card { margin: -6px 0 18px; }
  .flight-card .lcard { max-width: 560px; }
  .switch { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-weight: 600; }
  .switch input { width: 18px; height: 18px; accent-color: var(--green); }
  .plan-route { font-family: ui-monospace, Consolas, monospace; font-size: 13px; color: var(--muted); word-break: break-word; margin-top: 6px; }
  .wxi { width: 16px; height: 16px; vertical-align: -3px; }
  .wxi.big { width: 22px; height: 22px; vertical-align: -5px; }
  .wp-label { background: rgba(255,255,255,.9); border: 0; box-shadow: none; color: #3B4B42; font: 600 10.5px var(--body); padding: 0 4px; border-radius: 3px; }
  .wp-label::before { display: none; }

<script src="config.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
<script>
const CFG = window.JAI_CONFIG || {};
document.getElementById("appName").textContent = CFG.APP_NAME || "JAI Tracker";
document.title = CFG.APP_NAME || "JAI Tracker";

// odkazy z e-mailů (potvrzení registrace, obnova hesla) – zachytit dřív, než je knihovna z adresy smaže
const AUTH_HASH = location.hash;
const AUTH_TYPE = (AUTH_HASH.match(/type=([a-z_]+)/) || [])[1] || null;
const AUTH_ERROR = (() => { const m = AUTH_HASH.match(/error_description=([^&]+)/); return m ? decodeURIComponent(m[1].replace(/\+/g, " ")) : null; })();
const BASE_URL = location.origin + location.pathname;
const notConfigured = !CFG.SUPABASE_URL || CFG.SUPABASE_URL.startsWith("VLOZ");
const sb = notConfigured ? null : supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_KEY);

/* ---------- pomocné funkce ---------- */
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const nf = new Intl.NumberFormat("cs-CZ");
const fmt1 = n => Number(n).toLocaleString("cs-CZ", { maximumFractionDigits: 1 });
const fmtG = n => Number(n).toLocaleString("cs-CZ", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const fmtDate = d => new Date(d).toLocaleDateString("cs-CZ", { day: "numeric", month: "numeric", year: "numeric" });
const fmtDur = min => { min = Math.round(min || 0); return `${Math.floor(min / 60)}:${String(min % 60).padStart(2, "0")}`; };
const scoreCls = s => s >= 8 ? "s-hi" : s >= 6 ? "s-mid" : s >= 3 ? "s-lo" : "s-bad";
const scoreHtml = s => s == null ? '<span class="muted">–</span>' : `<span class="score ${scoreCls(s)}">${fmt1(s)}</span>`;
const route = f => `${esc(f.dep_icao || "????")} → ${esc(f.arr_icao || "????")}`;

let jaiSet = new Set();
let me = null;          // { user, profile }

function avatar(p, isJai, cls = "") {
  const name = p?.username || "?";
  if (p?.avatar_url) return `<img class="av ${cls}" src="${esc(p.avatar_url)}" alt="">`;
  return `<span class="av ${isJai ? "jai" : ""} ${cls}" aria-hidden="true">${esc(name.slice(0, 2).toUpperCase())}</span>`;
}
function pilotLink(p, isJai) {
  if (!p) return '<span class="muted">Neznámý pilot</span>';
  return `<div class="pilot-cell">${avatar(p, isJai)}<a href="#/pilot/${encodeURIComponent(p.username)}">${esc(p.username)}</a>${isJai ? '<span class="badge">JAI</span>' : ""}</div>`;
}

const RANKS = [
  { name: "Kadet", h: 0 }, { name: "Second Officer", h: 10 }, { name: "First Officer", h: 50 },
  { name: "Kapitán", h: 150 }, { name: "Senior kapitán", h: 400 }
];
function rankOf(hours) {
  let i = 0; while (i + 1 < RANKS.length && hours >= RANKS[i + 1].h) i++;
  const next = RANKS[i + 1];
  const pct = next ? Math.min(100, (hours - RANKS[i].h) / (next.h - RANKS[i].h) * 100) : 100;
  return { name: RANKS[i].name, next, pct };
}

async function loadJai() {
  if (!sb) return;
  const { data } = await sb.from("jai_members").select("user_id");
  jaiSet = new Set((data || []).map(r => r.user_id));
}

function trackerDownloadUrl() {
  if (CFG.TRACKER_URL) return CFG.TRACKER_URL;
  if (CFG.GITHUB_REPO) return `https://github.com/${CFG.GITHUB_REPO}/releases/latest/download/JachymAirTracker.exe`;
  const h = location.hostname;
  if (h.endsWith(".github.io")) {
    const owner = h.split(".")[0];
    const repo = location.pathname.split("/").filter(Boolean)[0] || h;
    return `https://github.com/${owner}/${repo}/releases/latest/download/JachymAirTracker.exe`;
  }
  return CFG.TRACKER_ZIP || "#";
}

/* ---------- režim aplikace (web uvnitř JachymAirTracker.exe) ---------- */
let appApi = null, appState = null;
function initAppMode() {
  if (appApi || !window.pywebview?.api) return;
  appApi = window.pywebview.api;
  document.body.classList.add("app");
  pollApp();
  setInterval(pollApp, 700);
  if (location.hash.startsWith("#/ucet")) renderAccount();
}
window.addEventListener("pywebviewready", initAppMode);
if (new URLSearchParams(location.search).has("app")) setTimeout(initAppMode, 1500);

// Starší verze aplikace s touto adresou webu nekomunikují – pozná se to podle chybějícího čísla verze.
let appStale = false, appFails = 0;
async function pollApp() {
  let st = null;
  try { st = await appApi.get_state(); } catch { st = null; }
  if (st && st.version) { appState = st; appFails = 0; appStale = false; }
  else {
    // jednorázový výpadek (vytížený počítač, simulátor se „zadýchá“) ignorovat – až opakované selhání je zastaralá aplikace
    appFails++;
    const refused = st && st.ok === false && /Nepovolen/.test(st.msg || "");
    if (!(appFails >= 6 || (refused && appFails >= 3) || (!appState && appFails >= 3))) return;
    appState = st || appState || { ok: false };
    appStale = true;
  }
  if (appStale) {
    const pill = $("appPill");
    pill.classList.remove("ok"); pill.classList.add("upd");
    $("appPillText").textContent = "Aktualizuj aplikaci";
    if ($("view-tracker").classList.contains("on") && !$("staleCard")) renderTracker(true);
    return;
  }
  const s = appState, pill = $("appPill");
  pill.classList.toggle("ok", !!s.connected);
  pill.classList.toggle("upd", !!s.update);
  $("appPillText").textContent = s.update ? `Nová verze ${s.update.version}` : s.connected ? `MSFS · ${s.phase}` : "Čekám na MSFS";
  if ($("view-tracker").classList.contains("on")) renderTracker(false);
}

function renderTracker(full) {
  const el = $("tracker"), s = appState;
  if (!appApi || !s) { el.innerHTML = '<div class="card">Tato stránka funguje jen v aplikaci Jáchym Air Tracker.</div>'; return; }
  if (appStale) {
    renderTracker.sig = null;
    el.innerHTML = `<h1 class="page-title">Tracker</h1>
      <div class="card" id="staleCard" style="border:2px solid var(--warn)">
        <h2 class="section-title">Tvoje aplikace je zastaralá</h2>
        <p>Tahle verze aplikace se neumí spojit s aktuálním webem, proto tu nevidíš stav letu ani nabídku aktualizace. Sledování letů v ní může fungovat jen částečně.</p>
        <p><b>Jak to opravit:</b> zavři aplikaci, stáhni si novou verzi a starý soubor <code>JachymAirTracker.exe</code> jí nahraď. Přihlášení i nastavení zůstanou.</p>
        <p><a class="btn" href="${esc(trackerDownloadUrl())}" target="_blank" rel="noopener">Stáhnout novou verzi</a></p>
        <p class="muted" style="font-size:13px;margin:0">Když Windows ukáže modré okno, klikni na „Další informace“ a „Přesto spustit“.</p>
      </div>`;
    return;
  }
  const sig = `${s.online}|${s.crew?.linked}|${!!s.plan}|${(s.crew?.bids || []).map(b => b.id).join(",")}`;
  if (!vaList.length && !renderTracker.vaWait) { renderTracker.vaWait = true; vaReady.then(() => renderTracker(true)); }
  if (full || !$("trNums") || sig !== renderTracker.sig) {
    renderTracker.sig = sig;
    el.innerHTML = `<h1 class="page-title">Tracker</h1><p class="lead">Aplikace verze ${esc(s.version)} · běží na tvém PC vedle MSFS</p>
      <div id="trUpd"></div>
      <div class="tr-grid">
        <div class="card"><h2 class="section-title">Stav</h2>
          <div class="tr-row"><span>Web</span><b id="trWeb"></b></div>
          <div class="tr-row"><span>MSFS</span><b id="trSim"></b></div>
          <div class="tr-row"><span>Fáze letu</span><b id="trPhase"></b></div>
          <div class="tr-row"><span>Létám pro</span><b id="trVaNow"></b></div>
          <div class="tr-row"><span>Registrace</span><b id="trRegNow"></b></div>
          <div class="tr-row"><span>Squawk</span><b id="trSquawk"></b></div>
          <div class="field" style="margin:12px 0 0"><label for="trVa">Moje virtuálka (mimo linky Jáchym Air)</label>
            <select id="trVa"><option value="">Žádná / vlastní lety</option>${vaList.filter(v => v.code !== "JAI").map(v => `<option value="${esc(v.code)}" ${s.va_choice === v.code ? "selected" : ""}>${esc(v.name)}</option>`).join("")}</select>
            <small>Zelené letadlo Jáchym Air se zapne samo, když letíš linku rezervovanou v crew centru.</small></div>
          <div style="display:flex;gap:8px;margin-top:14px;flex-wrap:wrap">
            ${s.online ? '<button class="btn ghost" id="trLogout">Odhlásit tracker</button>' : ""}
          </div>
        </div>
        ${s.online ? "" : `<form class="card" id="trLogin"><h2 class="section-title">Přihlášení trackeru</h2>
          <p class="muted">Aby se tvoje lety ukládaly, přihlas tracker stejným účtem jako na webu.</p>
          <div id="trLoginMsg"></div>
          <div class="field"><label for="trEmail">E-mail</label><input id="trEmail" type="email" required value="${esc(me?.user?.email || "")}"></div>
          <div class="field"><label for="trPass">Heslo</label><input id="trPass" type="password" required></div>
          <button class="btn">Přihlásit tracker</button></form>`}
        <div class="card tr-landing"><div class="big" id="trScore">–</div><div class="info">
          <h3 id="trVerdict" style="font-size:22px">Zatím žádné přistání</h3><div id="trLand" class="muted">Přistání se tu ukáže automaticky.</div></div></div>
        <div class="card tr-wide save-card" id="saveCard"></div>
        <div class="card tr-wide"><div class="tr-nums" id="trNums">
          <div><b id="trAlt">–</b><span>Výška ft</span></div><div><b id="trIas">–</b><span>IAS kt</span></div>
          <div><b id="trGs">–</b><span>GS kt</span></div><div><b id="trVs">–</b><span>V/S fpm</span></div></div></div>
        <form class="card" id="fiForm"><h2 class="section-title">Údaje o letu</h2>
          <p class="muted" style="margin-top:0">Vyplní se samy ze SimBriefu. Můžeš je přepsat, ručně zadané mají přednost.</p>
          <div class="obs-row">
            <div class="field"><label for="fiCs">Callsign</label><input id="fiCs" maxlength="10" placeholder="JAI11V"></div>
            <div class="field"><label for="fiNo">Číslo letu</label><input id="fiNo" maxlength="10" placeholder="JAI11"></div>
            <div class="field"><label for="fiDep">Odlet (ICAO)</label><input id="fiDep" maxlength="4" placeholder="LKPR"></div>
            <div class="field"><label for="fiArr">Přílet (ICAO)</label><input id="fiArr" maxlength="4" placeholder="EGLL"></div>
            <div class="field"><label for="fiAlt">Alternativa</label><input id="fiAlt" maxlength="4" placeholder="EGKK"></div>
            <div class="field"><label for="fiReg">Registrace</label><input id="fiReg" maxlength="12" placeholder="OK-TVS"></div>
          </div>
          ${s.reg && s.reg_default ? `<p class="muted" style="font-size:13px;margin:0 0 10px">Simulátor hlásí registraci ${esc(s.reg)}, ale je to výchozí registrace z nastavení MSFS, proto ji nepoužívám.</p>` : ""}
          <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn">Uložit</button><button class="btn ghost" type="button" id="fiReset">${s.has_sb_plan ? "Vrátit podle SimBriefu" : "Vymazat"}</button></div>
          <div id="fiMsg"></div></form>
        <div class="card"><h2 class="section-title">OBS overlay</h2>
          <div class="obs-row">
            <div class="field"><label for="obsStyl">Styl</label><select id="obsStyl">
              <option value="klasik">Klasický</option><option value="mini">Minimalistický</option><option value="tmavy">Tmavý</option><option value="kokpit">Kokpit</option></select></div>
            <div class="field"><label for="obsPos">Umístění</label><select id="obsPos">
              <option value="">Vlevo dole</option><option value="vpravo">Vpravo dole</option><option value="nahore">Vlevo nahoře</option><option value="vpravo,nahore">Vpravo nahoře</option></select></div>
            <div class="field"><label for="obsColor">Barva</label><input type="color" id="obsColor" style="height:42px;padding:4px"></div>
            <div class="field"><label for="obsScale">Velikost: <span id="obsScaleV"></span> %</label><input type="range" id="obsScale" min="60" max="160" step="5"></div>
          </div>
          <div class="obs-url" id="obsUrl"></div>
          <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" id="obsCopy">Zkopírovat odkaz</button><button class="btn ghost" id="obsOpen">Otevřít náhled</button></div>
          <p class="muted" style="font-size:13px;margin:10px 0 0">V OBS přidej zdroj Prohlížeč (Browser), vlož odkaz a nastav 1920 × 1080.</p></div>
        <div class="card"><h2 class="section-title">Letový plán (SimBrief)</h2>
          ${s.plan ? `<div style="font-family:var(--display);font-size:30px;font-weight:800">${esc(s.plan.dep)} → ${esc(s.plan.arr)}</div>
            <div class="tr-row"><span>Alternativa</span><b>${esc(s.plan.altn || "–")}</b></div>
            <div class="tr-row"><span>Callsign</span><b>${esc(s.plan.callsign || "–")}</b></div>
            <div class="tr-row"><span>Letadlo</span><b>${esc([s.plan.aircraft, s.plan.reg].filter(Boolean).join(" · ") || "–")}</b></div>
            <div class="tr-row"><span>Hladina</span><b>${s.plan.cruise ? "FL" + Math.round(s.plan.cruise / 100) : "–"}${s.plan.ete_min ? ` · ${fmtDur(s.plan.ete_min)} h` : ""}</b></div>
            ${s.plan.route ? `<div class="plan-route">${esc(s.plan.route)}</div>` : ""}
            <div style="display:flex;gap:8px;margin-top:14px;flex-wrap:wrap"><button class="btn ghost" id="sbReload">Načíst znovu</button><button class="btn ghost" id="sbClear">Zrušit plán</button></div>`
          : `<p class="muted">Načti poslední OFP ze SimBriefu. Na mapě se ukáže plánovaná trasa a ostatní uvidí, kam letíš.</p>
            <form id="sbForm"><div class="field"><label for="sbUser">Uživatelské jméno v SimBriefu</label><input id="sbUser" required value="${esc(s.simbrief_user || "")}" placeholder="např. jachym12"></div>
            <button class="btn">Načíst letový plán</button></form>`}
          <div id="sbMsg"></div></div>
        <div class="card"><h2 class="section-title">Crew center Jáchym Air</h2>
          ${s.crew?.linked ? `<div class="tr-row"><span>Pilot</span><b class="ok">✔ ${esc(s.crew.ident || "")} ${esc(s.crew.name || "")}</b></div>
            <label class="switch" style="margin:12px 0"><input type="checkbox" id="crewAuto" ${s.crew.auto ? "checked" : ""}> Po přistání let automaticky odeslat</label>
            <p class="muted" style="margin:0 0 6px">Let se odešle, když máš v crew centru rezervaci (bid) se stejným odletem a cílem.</p>
            <div class="tr-row"><span>Poslední stav</span><b id="crewStatus"></b></div>
            <h4 style="margin:14px 0 4px;font-family:var(--display);font-size:17px">Moje rezervace</h4>
            ${(s.crew.bids || []).length ? s.crew.bids.map(b => `<div class="bid-row"><a href="#/linka/${encodeURIComponent(b.id)}"><b>${esc(b.flight_number)}</b> ${esc(b.dep)} → ${esc(b.arr)}</a>
              <span class="muted" style="font-size:13px">${esc(b.aircraft || "")}</span><button class="link-btn danger" data-unbid="${esc(b.id)}">Zrušit</button></div>`).join("")
              : '<p class="muted" style="margin:0">Žádné. Klikni na letiště se zeleným bodem a vyber si linku.</p>'}
            <div style="display:flex;gap:8px;margin-top:14px;flex-wrap:wrap"><button class="btn ghost" id="crewFile">Odeslat poslední let</button><button class="btn ghost" id="crewUnlink">Odpojit</button></div>`
          : `<p class="muted">Vlož API klíč ze svého profilu v crew centru. Klíč zůstane jen v tomto počítači a lety se pak budou samy odesílat do crew centra.</p>
            <form id="crewLinkForm"><div class="field"><label for="crewKeyApp">API klíč</label><input id="crewKeyApp" type="password" required autocomplete="off"></div>
            <button class="btn">Propojit crew center</button></form>`}
          <div id="crewMsg"></div></div>
      </div>
      <h2 class="section-title" style="margin-top:24px">Události</h2>
      <div class="card tr-log" id="trLog"></div>`;
    const fi = s.flight_info || {}, pl = s.plan || {};
    const val = k => fi[k] || pl[k] || "";
    $("fiCs").value = val("callsign"); $("fiNo").value = val("flight_no"); $("fiDep").value = val("dep"); $("fiArr").value = val("arr"); $("fiAlt").value = val("altn");
    $("fiReg").value = s.reg_override || s.reg_now || "";
    $("fiForm").onsubmit = async e => {
      e.preventDefault();
      const info = { callsign: $("fiCs").value, flight_no: $("fiNo").value, dep: $("fiDep").value, arr: $("fiArr").value, altn: $("fiAlt").value };
      await appApi.set_flight_info(info);
      const reg = $("fiReg").value.trim().toUpperCase();
      await appApi.set_reg(reg && reg !== (pl.reg || "") ? reg : "");
      appState = await appApi.get_state(); renderTracker(true); say("fiMsg", true, "Údaje o letu uloženy.");
    };
    $("fiReset").onclick = async () => { await appApi.set_flight_info({}); await appApi.set_reg(""); appState = await appApi.get_state(); renderTracker(true); say("fiMsg", true, s.has_sb_plan ? "Vráceno podle SimBriefu." : "Údaje vymazány."); };
    $("trVa").onchange = async e => { await appApi.set_va(e.target.value); appState = await appApi.get_state(); };
    if (!s.va_choice && me?.profile?.va_default && !renderTracker.vaInit) { renderTracker.vaInit = true; appApi.set_va(me.profile.va_default); }
    const obs = Object.assign({ styl: "klasik", pos: "", color: "#1E9B36", scale: 100 }, settings.obs || {});
    const obsUrl = () => { const q = new URLSearchParams();
      if (obs.styl !== "klasik") q.set("styl", obs.styl);
      if (obs.pos) q.set("pozice", obs.pos);
      if (obs.color.toLowerCase() !== "#1e9b36") q.set("barva", obs.color.slice(1));
      if (obs.scale !== 100) q.set("scale", (obs.scale / 100).toFixed(2));
      const qs = q.toString(); return s.obs_url + "/" + (qs ? "?" + qs : ""); };
    const syncObs = () => { settings.obs = obs; saveSettings(); $("obsUrl").textContent = obsUrl(); $("obsScaleV").textContent = obs.scale; };
    $("obsStyl").value = obs.styl; $("obsPos").value = obs.pos; $("obsColor").value = obs.color; $("obsScale").value = obs.scale; syncObs();

    $("obsPos").onchange = e => { obs.pos = e.target.value; syncObs(); };
    $("obsColor").oninput = e => { obs.color = e.target.value; syncObs(); };
    $("obsScale").oninput = e => { obs.scale = +e.target.value; syncObs(); };
    $("obsCopy").onclick = async () => { await appApi.copy_text(obsUrl()); $("obsCopy").textContent = "Zkopírováno ✔"; setTimeout(() => $("obsCopy") && ($("obsCopy").textContent = "Zkopírovat odkaz"), 2000); };
    $("obsOpen").onclick = () => appApi.open_url(obsUrl());
    if ($("trLogout")) $("trLogout").onclick = async () => { await appApi.logout(); appState = await appApi.get_state(); renderTracker(true); };
    if ($("trLogin")) $("trLogin").onsubmit = async e => {
      e.preventDefault();
      const r = await appApi.login($("trEmail").value.trim(), $("trPass").value);
      if (r.ok) { appState = await appApi.get_state(); renderTracker(true); }
      else $("trLoginMsg").innerHTML = `<div class="msg err">${esc(r.msg)}</div>`;
    };
    const say = (id, ok, text) => { const b = $(id); if (b) b.innerHTML = `<div class="msg ${ok ? "ok" : "err"}" style="margin:12px 0 0">${esc(text)}</div>`; };
    const busy = (btn, t) => { btn.disabled = true; btn.dataset.t = btn.textContent; btn.textContent = t; };
    if ($("sbForm")) $("sbForm").onsubmit = async e => {
      e.preventDefault(); busy(e.target.querySelector("button"), "Načítám…");
      const r = await appApi.load_simbrief($("sbUser").value.trim());
      appState = await appApi.get_state(); renderTracker(true);
      if (!r.ok) say("sbMsg", false, r.msg);
    };

const ALT_STOPS = [[0, [249, 115, 22]], [4000, [234, 179, 8]], [10000, [34, 197, 94]], [20000, [6, 182, 212]], [30000, [59, 130, 246]], [40000, [168, 85, 247]]];
function altColor(alt) {
  alt = Math.max(0, alt || 0);
  for (let i = 1; i < ALT_STOPS.length; i++) {
    const [a1, c1] = ALT_STOPS[i - 1], [a2, c2] = ALT_STOPS[i];
    if (alt <= a2) { const t = (alt - a1) / (a2 - a1); return `rgb(${c1.map((v, k) => Math.round(v + (c2[k] - v) * t)).join(",")})`; }
  }

}

const okPt = p => Array.isArray(p) && Number.isFinite(p[0]) && Number.isFinite(p[1]) && !(Math.abs(p[0]) < 1 && Math.abs(p[1]) < 1) && Math.abs(p[0]) <= 90 && Math.abs(p[1]) <= 180;   // okolí bodu 0,0 = simulátor se načítá
const kmBetween = (a, b) => { const r = Math.PI / 180, x = (b[1] - a[1]) * r * Math.cos((a[0] + b[0]) / 2 * r), y = (b[0] - a[0]) * r; return Math.hypot(x, y) * 6371; };
function drawAltTrail(group, pts, weight, renderer) {
  group.clearLayers();
  pts = (pts || []).filter(okPt);
  for (let i = 1; i < pts.length; i++) {
    const a = pts[i - 1], b = pts[i];
    if (kmBetween(a, b) > 250) continue;        // skok (přesun v simulátoru) – nekreslit
    L.polyline([[a[0], a[1]], [b[0], b[1]]], { color: altColor(((a[2] || 0) + (b[2] || 0)) / 2), weight, opacity: .95, lineCap: "round", renderer }).addTo(group);

}

function drawAirports() {
  if (!map || !airportLayer || !map.hasLayer(airportLayer)) return;
  airportLayer.clearLayers();
  const z = map.getZoom(), b = map.getBounds().pad(0.1);
  const minSize = z >= 7 ? 2 : z >= 4 ? 3 : 9;
  let n = 0;
  for (const [icao, name, lat, lon, size, city] of airports) {
    const jai = routesByAp.has(icao);
    if ((size < minSize && !(jai && z >= 3)) || !b.contains([lat, lon])) continue;
    if (++n > 900) break;
    const big = size === 3;
    const c = L.circleMarker([lat, lon], {
      renderer: apRenderer, radius: jai ? 6.5 : big ? 6 : 4.5, weight: jai ? 3 : 2.5,
      color: jai ? "#fff" : big ? "#116B26" : "#5C6E63", fillColor: jai ? "#1E9B36" : "#fff", fillOpacity: 1
    }).addTo(airportLayer);
    const m = metarCache.get(icao);
    c.bindPopup(() => {
      const here = liveRows.filter(r => r.lat != null && Math.abs(r.lat - lat) < 0.06 && Math.abs(r.lon - lon) < 0.09);
      return `<div class="pop-cs">${esc(icao)}</div><div><b>${esc(name)}</b></div>${city ? `<div class="muted">${esc(city)}</div>` : ""}
        ${here.length ? `<div style="margin-top:6px">Na letišti: ${here.map(r => esc(r.callsign || r.profiles?.username)).join(", ")}</div>` : ""}
        ${jai ? routesPopupHtml(icao) : ""}
        ${metarCache.get(icao) ? metarHtml(metarCache.get(icao))
          : metarMissing.has(icao) ? '<div class="muted" style="margin-top:6px">Letiště nemá meteostanici, METAR tu není.</div>'
          : '<div class="muted" style="margin-top:6px">Načítám počasí…</div>'}`;
    }, { maxWidth: 340 });
    c.on("popupopen", () => ensureMetar(icao, c));

/* ---------- radar srážek (RainViewer) ---------- */
let radarLayer = null, radarTimer = null;
async function updateRadar() {

  if (radarLayer) { map.removeLayer(radarLayer); radarLayer = null; }
  clearInterval(radarTimer);
  if (!settings.radar) return;
  try {
    const r = await fetch("https://api.rainviewer.com/public/weather-maps.json");
    const d = await r.json();
    const frame = (d.radar?.past || []).slice(-1)[0];
    if (!frame) return;
    radarLayer = L.tileLayer(`${d.host}${frame.path}/256/{z}/{x}/{y}/2/1_1.png`, {
      opacity: 0.6, maxNativeZoom: 7, maxZoom: 19, zIndex: 350,
      attribution: 'Radar &copy; <a href="https://www.rainviewer.com" target="_blank" rel="noopener">RainViewer</a>'

  radarTimer = setInterval(updateRadar, 10 * 60 * 1000);
}

/* ---------- body trasy ---------- */

      .bindTooltip(esc(f[2]), { permanent: true, direction: "right", offset: [5, 0], className: "wp-label" }).addTo(group);

/* ---------- počasí (METAR) ---------- */
const metarMissing = new Set(), metarLoading = new Set();

    if (!/^[A-Z0-9]{4}$/.test(icao) && !metarCache.has(icao)) { metarMissing.add(icao); layer.getPopup()?.update(); }
    return;
  }
  metarLoading.add(icao);
  try {
    const r = await fetch(`${CFG.SUPABASE_URL}/functions/v1/metar?ids=${icao}`, { headers: { apikey: CFG.SUPABASE_KEY } });
    const list = r.ok ? await r.json() : [];
    const m = (list || []).find(x => x.icaoId === icao);
    if (m) metarCache.set(icao, m); else metarMissing.add(icao);
  } catch { metarMissing.add(icao); }
  metarLoading.delete(icao);

}

}

  const f = (v, up) => (up ? Math.ceil(v * 2) : Math.floor(v * 2)) / 2;
  const bbox = [f(Math.max(-90, b.getSouth()), 0), f(Math.max(-180, b.getWest()), 0), f(Math.min(90, b.getNorth()), 1), f(Math.min(180, b.getEast()), 1)].join(",");
  try {

    const list = await r.json();

}

/* ---------- karta přistání ---------- */
function rwyText(f) {
  if (!f.rwy) return null;
  const d = f.rwy_dist_m, o = Number(f.rwy_offset_m);
  const where = d == null ? "" : d >= 0 ? ` · ${nf.format(d)} m za prahem` : ` · ${nf.format(-d)} m před prahem`;
  const side = isNaN(o) ? "" : Math.abs(o) < 0.5 ? " · na ose" : ` · ${fmt1(Math.abs(o))} m ${o > 0 ? "vpravo" : "vlevo"} od osy`;
  return `RWY ${esc(f.rwy)}${where}${side}`;
}
function windText(f) {
  if (f.wind_kt == null) return null;
  let t = `${String(f.wind_dir ?? 0).padStart(3, "0")}° / ${f.wind_kt} kt`;
  if (f.headwind != null) t += ` · ${f.headwind >= 0 ? "čelní" : "zadní"} ${Math.abs(f.headwind)} kt`;
  if (f.crosswind) t += ` · boční ${Math.abs(f.crosswind)} kt ${f.crosswind > 0 ? "zprava" : "zleva"}`;
  return t;
}
function landingCardHtml(f) {
  const rows = [
    ["Dosednutí", `${nf.format(f.fpm)} fpm · ${fmtG(f.g)} G`],
    f.td_ias != null ? ["Rychlost", `IAS ${f.td_ias} kt · GS ${f.td_gs} kt`] : null,
    rwyText(f) ? ["Dráha", rwyText(f)] : null,
    windText(f) ? ["Vítr", windText(f)] : null,
    f.bounces != null ? ["Odskoky", f.bounces ? String(f.bounces) : "žádné"] : null,
  ].filter(Boolean);
  return `<div class="lcard"><div class="lcard-head">${scoreHtml(f.score)}<div><b>${verdictOf(f.score)}</b>
    <span class="muted">${esc(f.callsign || f.profiles?.username || "")}${f.arr_icao ? " · " + esc(f.arr_icao) : ""} · ${fmtDate(f.landed_at)}</span></div></div>
    <dl>${rows.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join("")}</dl>
    ${f.id && !(focus?.type === "flight" && focus.id === f.id) ? `<a href="#/let/${f.id}" style="display:inline-block;margin-top:8px;font-weight:700">Detail letu →</a>` : ""}</div>`;
}
function tdIcon(score, keep, fpm) {

  return L.divIcon({ className: "td-ic" + (keep ? " td-focus" : ""), iconSize: [0, 0], iconAnchor: [0, 0], popupAnchor: [0, -34],
    html: `<div class="td-pin" style="background:${col}">${fpm != null ? nf.format(fpm) + "<small>fpm</small>" : fmt1(score)}</div><div class="td-dot" style="background:${col}"></div>` });
}
const TD_FIELDS = "id, user_id, callsign, arr_icao, score, fpm, g, td_lat, td_lon, td_ias, td_gs, wind_dir, wind_kt, headwind, crosswind, bounces, rwy, rwy_dist_m, rwy_offset_m, landed_at, profiles!flights_user_id_fkey(username)";
async function refreshTouchdowns() {
  // místa přistání jen u otevřeného letu (detail) a u mého vlastního přistání za poslední hodinu
  if (!tdLayer) return;
  if (!me) { tdLayer.clearLayers(); return; }
  const { data, error } = await sb.from("flights").select(TD_FIELDS).not("td_lat", "is", null).eq("user_id", me.user.id)
    .gte("landed_at", new Date(Date.now() - 3600e3).toISOString()).order("landed_at", { ascending: false }).limit(3);
  if (error) return;
  tdLayer.clearLayers();
  for (const f of data || []) L.marker([f.td_lat, f.td_lon], { icon: tdIcon(f.score, false, f.fpm) }).bindPopup(landingCardHtml(f), { maxWidth: 360 }).addTo(tdLayer);
}

function verdictOf(s) {
  return s >= 9.5 ? "Máslo!" : s >= 8 ? "Výborné přistání" : s >= 6 ? "Dobré přistání" : s >= 4 ? "Tvrdší přistání" : s >= 2 ? "Tvrdé přistání" : "Kontrola podvozku";
}
function landingToast(f) {
  const t = document.createElement("div");
  t.className = "toast" + (jaiSet.has(f.user_id) ? " jai" : "");
  t.innerHTML = `${scoreHtml(f.score)}<div><b>🛬 ${esc(f.callsign || f.profiles?.username)}</b> přistál${f.arr_icao ? " v " + esc(f.arr_icao) : ""}
    <div class="muted">${nf.format(f.fpm)} fpm · ${fmtG(f.g)} G · ${verdictOf(f.score)}</div></div>`;
  $("toasts").prepend(t);
  setTimeout(() => t.remove(), 15000);
}
async function refreshRecent() {
  const { data } = await sb.from("flights").select("id, user_id, callsign, arr_icao, score, fpm, g, landed_at, profiles!flights_user_id_fkey(username)")
    .order("landed_at", { ascending: false }).limit(6);
  if (data?.length) {
    if (lastFlightId !== null) data.filter(f => f.id > lastFlightId).reverse().forEach(landingToast);
    lastFlightId = Math.max(lastFlightId ?? 0, ...data.map(f => f.id));
  }
  $("recentList").innerHTML = !data?.length ? '<div class="empty">Zatím žádná přistání.</div>' : data.map(f => `
    <a class="recent-item" href="#/let/${f.id}">${scoreHtml(f.score)}

function timeAgo(d) {

  const h = Math.round(m / 60); if (h < 24) return `před ${h} h`;

async function refreshLive() {
  if (liveTick % 8 === 0) refreshTouchdowns();
  if (liveTick++ % 2 === 0) refreshRecent();
  const since = new Date(Date.now() - 120000).toISOString();
  const { data, error } = await sb.from("live").select("*, profiles(username, avatar_url, stream_url)").gte("updated_at", since);
  if (error) { $("airList").innerHTML = `<div class="empty">Mapu se nepodařilo načíst: ${esc(error.message)}</div>`; return; }
  liveRows = data || [];
  renderLive();
}

function renderLive() {
  if (!map) return;
  const seen = new Set();
  const w = settings.trail;
  for (const r of liveRows) {
    if (!okPt([r.lat, r.lon])) continue;
    const isJai = r.va === "JAI";
    const sel = focus?.type === "live" && focus.id === r.user_id;
    const cat = acCategory(r.ac_icao || r.plan?.aircraft, r.aircraft);
    const mine = !!me && r.user_id === me.user.id;
    const showTrack = (mine || sel) && focus?.type !== "flight" && focus?.type !== "route";   // trasy jen mého letu a vybraného letadla
    seen.add(r.user_id);
    // plánovaná trasa + body
    const fixes = !showTrack ? [] : Array.isArray(r.plan?.fixes) ? r.plan.fixes.filter(okPt) : [];
    let pl = planLines.get(r.user_id);
    if (fixes.length > 1) {
      const st = { color: isJai ? "#1E9B36" : "#66788A", weight: Math.max(2, w * 0.45), opacity: sel ? .95 : .65, dashArray: "6 7", interactive: false };
      const ll = fixes.map(f => [f[0], f[1]]);
      if (!pl) { pl = L.polyline(ll, st).addTo(map); planLines.set(r.user_id, pl); } else { pl.setLatLngs(ll); pl.setStyle(st); }
      const sig = fixes.length + "|" + r.plan.dep + r.plan.arr + "|" + settings.waypoints;
      let wp = wpLayers.get(r.user_id);
      if (!wp) { wp = { sig: null, group: L.layerGroup().addTo(map) }; wpLayers.set(r.user_id, wp); }
      if (wp.sig !== sig) { drawWaypoints(wp.group, fixes); wp.sig = sig; }
    } else {
      if (pl) { map.removeLayer(pl); planLines.delete(r.user_id); }
      const wp = wpLayers.get(r.user_id); if (wp) { map.removeLayer(wp.group); wpLayers.delete(r.user_id); }
    }
    // uletěná trasa podle výšky
    const pts = showTrack && Array.isArray(r.trail) ? r.trail.slice() : [];
    if (pts.length) pts.push([r.lat, r.lon, r.alt || 0]);
    let tr = trails.get(r.user_id);
    if (pts.length > 1) {
      if (!tr) { tr = L.layerGroup().addTo(map); trails.set(r.user_id, tr); }
      drawAltTrail(tr, pts, isJai || sel ? w + 1 : w, trailRenderer);
    } else if (tr) { map.removeLayer(tr); trails.delete(r.user_id); }
    // místo přistání hned po dosednutí (u mého letu a u vybraného letadla)
    const ld = r.landing && (mine || sel) && okPt([r.landing.td_lat, r.landing.td_lon]) ? r.landing : null;
    let lm = liveLandings.get(r.user_id);
    if (ld) {
      const key = `${ld.td_lat},${ld.td_lon},${ld.fpm}`;
      if (!lm || lm.key !== key) {
        if (lm) map.removeLayer(lm.m);
        const card = { ...ld, landed_at: new Date().toISOString(), profiles: r.profiles };
        lm = { key, m: L.marker([ld.td_lat, ld.td_lon], { icon: tdIcon(ld.score, true, ld.fpm), zIndexOffset: 1500 }).bindPopup(landingCardHtml(card), { maxWidth: 360 }).addTo(map) };
        liveLandings.set(r.user_id, lm);
      }
    } else if (lm) { map.removeLayer(lm.m); liveLandings.delete(r.user_id); }
    // letadlo
    let m = markers.get(r.user_id);
    if (!m) {
      m = L.marker([r.lat, r.lon], { icon: planeIcon(r.hdg, isJai, sel, cat), zIndexOffset: isJai ? 1000 : 0 }).addTo(map);
      m.on("click", () => { location.hash = "#/let/live/" + r.user_id; });
      markers.set(r.user_id, m);
    } else {
      m.setLatLng([r.lat, r.lon]); m.setIcon(planeIcon(r.hdg, isJai, sel, cat));
    }

function gcPoints(a, b, n = 48) {
  const r = x => x * Math.PI / 180, d = x => x * 180 / Math.PI;
  const [la1, lo1, la2, lo2] = [r(a[0]), r(a[1]), r(b[0]), r(b[1])];
  const w = 2 * Math.asin(Math.sqrt(Math.sin((la2 - la1) / 2) ** 2 + Math.cos(la1) * Math.cos(la2) * Math.sin((lo2 - lo1) / 2) ** 2));
  if (!w) return [a, b];
  const out = [];
  for (let i = 0; i <= n; i++) {
    const f = i / n, A = Math.sin((1 - f) * w) / Math.sin(w), B = Math.sin(f * w) / Math.sin(w);
    const x = A * Math.cos(la1) * Math.cos(lo1) + B * Math.cos(la2) * Math.cos(lo2);
    const y = A * Math.cos(la1) * Math.sin(lo1) + B * Math.cos(la2) * Math.sin(lo2);
    const z = A * Math.sin(la1) + B * Math.sin(la2);
    out.push([d(Math.atan2(z, Math.hypot(x, y))), d(Math.atan2(y, x))]);
  }
  return out;
}

function friendOf(uid) {
  const f = friendRows.find(x => x.requester === uid || x.addressee === uid);
  if (!f) return null;
  return { row: f, state: f.status === "accepted" ? "friend" : f.requester === me?.user?.id ? "sent" : "incoming" };
}

  else if (f?.state === "sent") el.innerHTML = '<span class="va-chip">Žádost odeslána</span>';
  else if (f?.state === "incoming") el.innerHTML = '<a class="va-chip" href="#/pratele" style="text-decoration:none">Chce tě za přítele</a>';
  else {
    el.innerHTML = '<button class="react-btn" style="font-size:12px;padding:2px 9px">+ Přidat do přátel</button>';

}

    await sb.from("blocks").insert({ blocked: other.id });

}

/* ---------- fotky z letů ---------- */
function lightbox(url, photoId) {
  const d = document.createElement("div"); d.className = "lightbox";
  d.innerHTML = `<div class="lb-in"><img src="${esc(url)}" alt="Fotka z letu">${photoId ? '<div class="lb-react" id="lbReact"></div>' : ""}</div>`;
  d.onclick = e => { if (!e.target.closest(".lb-react")) d.remove(); };
  document.body.appendChild(d);
  if (photoId) renderReactions($("lbReact"), photoId, "photo");
}
const photoListCache = new Map();
async function renderFlightPhotos(el, f, live = false) {
  if (!el) return;
  const key = live ? "u:" + f.user_id : "f:" + f.id;
  let cached = photoListCache.get(key);
  if (!cached || Date.now() - cached.t > (live ? 20000 : 5000)) {
    const q = sb.from("flight_photos").select("id, url, user_id").order("created_at");
    const { data } = live ? await q.eq("user_id", f.user_id).is("flight_id", null) : await q.eq("flight_id", f.id);
    cached = { t: Date.now(), list: data || [] }; photoListCache.set(key, cached);
  }
  if (!el.isConnected) return;
  const list = cached.list, own = me && me.user.id === f.user_id, admin = me?.profile?.is_admin;
  el.innerHTML = (list.length ? `<div class="ph-strip">${list.map(p => `<a href="${esc(p.url)}" data-lb="${esc(p.url)}" data-pid="${p.id}" style="background-image:url('${esc(p.url)}')">${own || admin ? `<button class="del" data-delfp="${p.id}" title="Smazat">✕</button>` : ""}</a>`).join("")}</div>`
      : `<p class="muted" style="margin:0">${own ? (live ? "Přidej screenshoty přímo během letu, po uložení letu se k němu připojí." : "Zatím žádné fotky. Přidej screenshoty z letu!") : "Pilot k letu zatím nepřidal fotky."}</p>`)
    + (own && list.length < 12 ? `<label class="link-btn" style="cursor:pointer;display:inline-block;margin-top:8px">📷 Přidat fotky<input type="file" id="fpAdd" accept="image/png,image/jpeg,image/webp" multiple style="display:none"></label>` : "");
  el.querySelectorAll("[data-lb]").forEach(a => a.onclick = e => { if (e.target.closest("[data-delfp]")) return; e.preventDefault(); lightbox(a.dataset.lb, +a.dataset.pid); });
  el.querySelectorAll("[data-delfp]").forEach(b => b.onclick = async e => {
    e.preventDefault(); e.stopPropagation();
    if (!confirm("Smazat fotku?")) return;
    await sb.from("flight_photos").delete().eq("id", +b.dataset.delfp); photoListCache.delete(key); renderFlightPhotos(el, f, live);
  });
  if ($("fpAdd")) $("fpAdd").onchange = async e => {
    const files = [...e.target.files].slice(0, 12 - list.length);
    el.insertAdjacentHTML("beforeend", '<p class="muted" id="fpUp">Nahrávám…</p>');
    for (const file of files) {
      try {
        const blob = await shrinkImage(file, 1920);
        const path = `${me.user.id}/${live ? "zivy" : f.id}-${Date.now()}-${Math.random().toString(36).slice(2, 7)}.jpg`;
        const { error } = await sb.storage.from("flightphotos").upload(path, blob, { contentType: "image/jpeg", upsert: false });
        if (error) throw error;
        const url = sb.storage.from("flightphotos").getPublicUrl(path).data.publicUrl;
        const { error: e2 } = await sb.from("flight_photos").insert({ flight_id: live ? null : f.id, url });
        if (e2) throw e2;
      } catch (err) { alert("Fotku se nepodařilo nahrát: " + (err.message || err)); break; }
    }
    photoListCache.delete(key); renderFlightPhotos(el, f, live);
  };
}
async function renderGallery() {
  const el = $("fotky");

const EMOJIS = ["👍", "🔥", "🧈", "👏", "😮", "😂"];
async function renderReactions(el, id, kind = "flight") {
  if (!el) return;
  const table = kind === "photo" ? "photo_reactions" : "flight_reactions", col = kind === "photo" ? "photo_id" : "flight_id";
  const { data } = await sb.from(table).select("emoji, user_id, profiles(username)").eq(col, id).order("created_at");
  const counts = {}, names = {}, mine = new Set();
  (data || []).forEach(r => {
    counts[r.emoji] = (counts[r.emoji] || 0) + 1;
    (names[r.emoji] = names[r.emoji] || []).push(r.profiles?.username || "?");
    if (r.user_id === me?.user?.id) mine.add(r.emoji);
  });
  const who = EMOJIS.filter(e => names[e]).map(e => `${e} ${names[e].map(esc).join(", ")}`).join(" · ");
  el.innerHTML = `<div class="react-bar">${EMOJIS.map(e => `<button class="react-btn ${mine.has(e) ? "mine" : ""}" data-e="${e}" aria-pressed="${mine.has(e)}"
      title="${esc((names[e] || []).join(", ") || "Buď první")}">${e}${counts[e] ? `<b>${counts[e]}</b>` : ""}</button>`).join("")}</div>
    ${who ? `<div class="react-who">${who}</div>` : ""}`;
  el.querySelectorAll("[data-e]").forEach(b => b.onclick = async ev => {

  });
}

/* ---------- novinky, let týdne, YouTube ---------- */
let eventsCache = null, eventsAt = 0, weekLayer = null;
async function loadEvents(force) {
  if (!force && eventsCache && Date.now() - eventsAt < 60000) return eventsCache;
  const { data, error } = await sb.from("events").select("*").order("starts_at", { ascending: false, nullsFirst: false }).limit(200);
  if (error) return eventsCache || [];
  eventsCache = data || []; eventsAt = Date.now();
  return eventsCache;
}
const KIND_TXT = { let_tydne: "Let týdne", youtube: "YouTube event", novinka: "Novinka" };
const isNow = e => (!e.starts_at || new Date(e.starts_at) <= new Date()) && (!e.ends_at || new Date(e.ends_at) >= new Date());
const ytEnd = e => e.ends_at ? new Date(e.ends_at) : new Date(new Date(e.starts_at || 0).getTime() + 3 * 3600e3);
function currentWeekFlight(list) {
  return list.filter(e => e.kind === "let_tydne" && isNow(e)).sort((a, b) => (b.pinned - a.pinned) || (new Date(b.starts_at) - new Date(a.starts_at)))[0] || null;
}
function nextYoutube(list) {
  return list.filter(e => e.kind === "youtube" && e.starts_at && ytEnd(e) >= new Date()).sort((a, b) => new Date(a.starts_at) - new Date(b.starts_at))[0] || null;
}
function relTime(d) {
  const ms = new Date(d) - Date.now(), past = ms < 0, m = Math.round(Math.abs(ms) / 60000);
  let t;
  if (m < 60) t = `${m} min`;
  else if (m < 48 * 60) { const h = Math.floor(m / 60); t = `${h} h${m % 60 && h < 10 ? ` ${m % 60} min` : ""}`; }
  else { const dd = Math.round(m / 1440); t = `${dd} ${dd < 5 ? "dny" : "dní"}`; }
  return past ? `před ${t}` : `za ${t}`;
}
const fmtDT = d => d ? new Date(d).toLocaleString("cs-CZ", { weekday: "short", day: "numeric", month: "numeric", hour: "2-digit", minute: "2-digit" }) : "";
function ytId(url) {
  const m = String(url || "").match(/(?:youtu\.be\/|v=|\/live\/|\/embed\/|\/shorts\/)([A-Za-z0-9_-]{11})/);
  return m ? m[1] : null;
}
function richText(t) {
  return esc(t || "").replace(/(https:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>').replace(/\n/g, "<br>");
}
function ytLive(e) { return e.starts_at && new Date(e.starts_at) <= new Date() && ytEnd(e) >= new Date(); }

async function renderHighlights() {
  if (!sb) return;
  const list = await loadEvents();
  const w = currentWeekFlight(list), y = nextYoutube(list);
  $("highlights").innerHTML = (w ? `<a class="hl-card" href="#/novinky/${w.id}"><span class="hl-ic">★</span><div><div class="hl-k">Let týdne · končí ${relTime(w.ends_at || Date.now())}</div>
      <div class="hl-t">${w.dep && w.arr ? `${esc(w.dep)} → ${esc(w.arr)}` : esc(w.title)}</div><div class="hl-s">${esc(w.aircraft || w.title)}</div></div></a>` : "")
    + (y ? `<a class="hl-card yt" href="#/novinky/${y.id}"><span class="hl-ic">▶</span><div><div class="hl-k">${ytLive(y) ? "Živě teď na YouTube" : "YouTube " + relTime(y.starts_at)}</div>
      <div class="hl-t">${esc(y.title)}</div><div class="hl-s">${fmtDT(y.starts_at)}</div></div></a>` : "");
  drawWeekRoute(w);
}
function drawWeekRoute(w) {
  if (!map) return;
  if (!weekLayer) weekLayer = L.layerGroup().addTo(map);
  weekLayer.clearLayers();
  const a = w && apByCode(w.dep), b = w && apByCode(w.arr);
  if (!a || !b) return;
  L.polyline([[a[2], a[3]], [b[2], b[3]]], { color: "#F59E0B", weight: 3, opacity: .85, dashArray: "2 8", lineCap: "round", interactive: false }).addTo(weekLayer);
  for (const ap of [a, b]) L.circleMarker([ap[2], ap[3]], { radius: 7, color: "#F59E0B", weight: 3, fillColor: "#fff", fillOpacity: 1 })
    .bindTooltip(`★ Let týdne · ${esc(ap[0])}`, { direction: "top" }).on("click", () => { location.hash = "#/novinky/" + w.id; }).addTo(weekLayer);
}

async function weekLeaderboard(e) {
  let q = sb.from("flights").select("id, user_id, callsign, aircraft, ac_icao, fpm, g, score, landed_at, duration_min, profiles!flights_user_id_fkey(username, avatar_url)")
    .eq("dep_icao", e.dep).eq("arr_icao", e.arr).not("score", "is", null).order("score", { ascending: false }).limit(300);
  if (e.starts_at) q = q.gte("landed_at", e.starts_at);
  if (e.ends_at) q = q.lte("landed_at", e.ends_at);
  const { data } = await q;
  const want = (e.aircraft || "").toUpperCase().trim();
  const best = new Map();
  for (const f of data || []) {
    if (want && !((f.ac_icao || "").toUpperCase() === want || (f.aircraft || "").toUpperCase().includes(want))) continue;
    if (!best.has(f.user_id)) best.set(f.user_id, f);
  }
  return [...best.values()];
}

async function renderNews(idParam) {
  const el = $("novinky");
  el.innerHTML = '<p class="muted">Načítám…</p>';
  const [list] = await Promise.all([loadEvents(true), airportsReady]);
  const sel = idParam ? list.find(e => String(e.id) === idParam) : null;
  const w = sel?.kind === "let_tydne" ? sel : (!sel ? currentWeekFlight(list) : null);
  let html = `<h1 class="page-title">Novinky</h1><p class="lead">Let týdne, YouTube eventy a novinky z Jáchym Air.</p>`;
  if (w) html += await weekBlock(w);
  if (sel && sel.kind !== "let_tydne") html += `<div style="margin-bottom:24px">${eventCard(sel, true)}</div>`;
  const others = list.filter(e => e !== w && e !== sel);
  const upcoming = others.filter(e => e.kind === "youtube" && ytEnd(e) >= new Date()).sort((a, b) => new Date(a.starts_at) - new Date(b.starts_at));
  const rest = others.filter(e => !upcoming.includes(e));
  if (upcoming.length) html += `<h2 class="section-title">Nadcházející streamy</h2><div class="ev-list" style="margin-bottom:28px">${upcoming.map(e => eventCard(e)).join("")}</div>`;
  html += `<h2 class="section-title">Všechny novinky</h2>` + (rest.length ? `<div class="ev-list">${rest.map(e => eventCard(e)).join("")}</div>` : '<div class="card">Zatím tu nic není.</div>');
  el.innerHTML = html;
  el.querySelectorAll("[data-delev]").forEach(b => b.onclick = async () => {
    if (!confirm("Opravdu smazat tuto novinku?")) return;
    const { error } = await sb.from("events").delete().eq("id", +b.dataset.delev);
    if (error) { alert("Nepodařilo se smazat: " + error.message); return; }
    eventsAt = 0; renderHighlights(); renderNews();
  });
}

async function renderAdminPhotos() {
  const box = $("admPhotos"); if (!box) return;
  await Promise.all([routesReady, ownPhotosReady]);
  const extra = [...ownPhotos.keys()].filter(k => !jaiFleet.some(a => (a.registration || "").toUpperCase().replace(/-/g, "") === k));
  const regs = [...new Set(jaiFleet.map(a => a.registration).filter(Boolean).concat(extra, renderAdminPhotos.added || []))].sort();
  const addForm = $("phAddForm");
  if (addForm) addForm.onsubmit = e => { e.preventDefault(); const k = $("phKey").value.trim().toUpperCase().replace(/[^A-Z0-9-]/g, "");
    if (!k) return; renderAdminPhotos.added = [...(renderAdminPhotos.added || []), k]; $("phKey").value = ""; renderAdminPhotos(); };
  if (!regs.length) { box.innerHTML = '<p class="muted">Nejdřív synchronizuj linky z crew centra, načte se i flotila.</p>'; return; }
  box.innerHTML = regs.map(r => { const url = ownPhotos.get(r.toUpperCase().replace(/-/g, ""));
    return `<div class="ph-card"><div class="img" ${url ? `style="background-image:url('${esc(url)}')"` : ""}>${url ? "" : "bez fotky"}</div>
      <div class="in"><b>${esc(r)}</b><span style="display:flex;gap:10px"><label class="link-btn" style="cursor:pointer">${url ? "Změnit" : "Nahrát"}<input type="file" accept="image/png,image/jpeg,image/webp" data-reg="${esc(r)}"></label>
      ${url ? `<button class="link-btn danger" data-delph="${esc(r)}">Smazat</button>` : ""}</span></div></div>`; }).join("");
  box.querySelectorAll("input[data-reg]").forEach(inp => inp.onchange = async () => {
    const file = inp.files[0]; if (!file) return;
    const reg = inp.dataset.reg; inp.closest(".ph-card").querySelector(".img").textContent = "Nahrávám…";
    try {
      const blob = await shrinkImage(file, 1600);
      const path = `${reg.replace(/[^A-Za-z0-9-]/g, "")}/${Date.now()}.jpg`;
      const { error } = await sb.storage.from("aircraft").upload(path, blob, { contentType: "image/jpeg", upsert: false });
      if (error) throw error;
      const url = sb.storage.from("aircraft").getPublicUrl(path).data.publicUrl;
      const { error: e2 } = await sb.from("aircraft_photos").upsert({ registration: reg.toUpperCase(), url, updated_at: new Date().toISOString() });
      if (e2) throw e2;
    } catch (err) { alert("Nahrání se nepovedlo: " + (err.message || err)); }
    photoCache.clear(); await loadOwnPhotos(); renderAdminPhotos();
  });
  box.querySelectorAll("[data-delph]").forEach(b => b.onclick = async () => {
    if (!confirm("Smazat fotku?")) return;
    await sb.from("aircraft_photos").delete().eq("registration", b.dataset.delph.toUpperCase());
    photoCache.clear(); await loadOwnPhotos(); renderAdminPhotos();
  });
}
function shrinkImage(file, maxW) {
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => { const k = Math.min(1, maxW / img.width), c = document.createElement("canvas");
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      c.toBlob(b => b ? res(b) : rej(new Error("obrázek nejde zpracovat")), "image/jpeg", 0.85); };
    img.onerror = () => rej(new Error("tohle není obrázek")); img.src = url;
  });
}
async function renderAdminReports() {
  const box = $("admReports"); if (!box) return;
  const { data: reps } = await sb.from("reports").select("*").order("created_at", { ascending: false }).limit(50);
  if (!reps?.length) { box.innerHTML = '<p class="muted" style="margin:0">Žádná nahlášení. 👍</p>'; return; }
  const ids = [...new Set(reps.flatMap(r => [r.reporter, r.target_user]).filter(Boolean))];
  const { data: profs } = await sb.from("profiles").select("id, username").in("id", ids);
  const name = id => esc((profs || []).find(p => p.id === id)?.username || "?");
  const msgIds = reps.map(r => r.message_id).filter(Boolean);
  const { data: msgs } = msgIds.length ? await sb.from("messages").select("id, body, sender").in("id", msgIds) : { data: [] };
  box.innerHTML = reps.map(r => { const m = (msgs || []).find(x => x.id === r.message_id);
    return `<div class="adm-row"><div><div class="ev-kind">${fmtDT(r.created_at)} · nahlásil ${name(r.reporter)}</div>
      <b>${name(r.target_user)}</b>${r.reason ? ` – ${esc(r.reason)}` : ""}${m ? `<div class="muted" style="font-size:13px">Zpráva: „${esc(m.body.slice(0, 200))}“</div>` : ""}</div>
      <div style="display:flex;gap:12px;flex:none">${m ? `<button class="link-btn danger" data-delmsg="${m.id}">Smazat zprávu</button>` : ""}<button class="link-btn" data-donerep="${r.id}">Vyřízeno</button></div></div>`; }).join("");
  box.querySelectorAll("[data-delmsg]").forEach(b => b.onclick = async () => { await sb.from("messages").delete().eq("id", +b.dataset.delmsg); renderAdminReports(); });
  box.querySelectorAll("[data-donerep]").forEach(b => b.onclick = async () => { await sb.from("reports").delete().eq("id", +b.dataset.donerep); renderAdminReports(); });
}

  <ul>
    <li>Nikdy nikomu neposílej své heslo ani API klíč. Správce se tě na ně nikdy nezeptá.</li>
    <li>Nesdílej osobní údaje, své ani cizí: adresu, telefon, školu, fotky lidí a podobně.</li>
    <li>Když tě někdo obtěžuje nebo ti něco nepříjemného píše, <b>zablokuj ho a nahlas</b> (tlačítka ve zprávách). Správce nahlášení uvidí.</li>
    <li>Jestli ti ještě nebylo 18, nedomlouvej si setkání s lidmi z internetu bez vědomí rodičů.</li>
  </ul>
  <h2>Létej férově</h2>
  <ul>
    <li>Žádné podvádění v žebříčcích, například posílání vymyšlených letů nebo upravování dat.</li>
    <li>Na webu nahrávej jen fotky, které jsou tvoje (třeba screenshoty z MSFS), nebo které smíš použít.</li>
    <li>Žádný spam ani reklama.</li>
  </ul>
  <h2>Co když pravidla někdo poruší</h2>
  <p>Správce může smazat nevhodný obsah a při vážném nebo opakovaném porušení i účet. Dotazy a připomínky: ${contactHtml()}.</p>
  ${legalLinks()}`;
}

/* ---------- nové heslo (odkaz z e-mailu) ---------- */
async function renderNewPassword() {
  const el = $("noveheslo");
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { el.innerHTML = '<div class="card" style="max-width:440px;margin:0 auto">Odkaz pro změnu hesla vypršel nebo už byl použit. Na stránce <a href="#/ucet">Přihlášení</a> si můžeš nechat poslat nový.</div>'; return; }
  el.innerHTML = `<div style="max-width:440px;margin:0 auto"><h1 class="page-title">Nové heslo</h1><p class="lead">Zvol si nové heslo k účtu ${esc(session.user.email)}.</p>
    <div id="npMsg"></div><form class="card" id="npForm"><div class="field"><label for="npPass">Nové heslo</label><input id="npPass" type="password" minlength="8" required autocomplete="new-password"><small>Aspoň 8 znaků</small></div>
    <button class="btn" style="width:100%">Uložit heslo</button></form></div>`;
  $("npForm").onsubmit = async e => {
    e.preventDefault();
    const { error } = await sb.auth.updateUser({ password: $("npPass").value });
    if (error) { $("npMsg").innerHTML = `<div class="msg err">${esc(error.message)}</div>`; return; }
    location.hash = "#/ucet"; setTimeout(() => renderAccount({ ok: true, text: "Heslo bylo změněno. Jsi přihlášen." }), 50);
  };
}

/* ---------- účet ---------- */
let authMode = "login";
async function loadMe() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { me = null; updateNav(); return; }
  const { data: profile } = await sb.from("profiles").select("*").eq("id", session.user.id).maybeSingle();
  me = { user: session.user, profile };
  updateNav();
  loadFriends().then(updateBadges);
}
function updateNav() {
  $("navAdmin").style.display = me?.profile?.is_admin ? "" : "none";
  const a = $("navAccount");
  a.innerHTML = me?.profile ? `${avatar(me.profile, jaiSet.has(me.user.id), "mini-av")}${esc(me.profile.username)}` : "Přihlásit";
}

function renderAccount(msg) {
  const el = $("ucet");
  const msgHtml = msg ? `<div class="msg ${msg.ok ? "ok" : "err"}">${esc(msg.text)}</div>` : "";
  if (!me) {
    el.innerHTML = `<div style="max-width:440px;margin:0 auto">
      <h1 class="page-title">${authMode === "login" ? "Přihlášení" : "Registrace"}</h1>
      <p class="lead">${authMode === "login" ? "Přihlas se ke svému pilotnímu účtu." : "Založ si účet a tvoje lety se začnou ukládat."}</p>
      ${msgHtml}
      <form class="card" id="authForm">
        ${authMode === "register" ? `
        <div class="field"><label for="fUser">Uživatelské jméno</label><input id="fUser" required minlength="3" maxlength="20" pattern="[A-Za-z0-9_.\\-]{3,20}" autocomplete="username"><small>3–20 znaků, písmena bez diakritiky, čísla, _ . -</small></div>` : ""}
        <div class="field"><label for="fEmail">E-mail</label><input id="fEmail" type="email" required autocomplete="email"></div>
        <div class="field"><label for="fPass">Heslo</label><input id="fPass" type="password" required minlength="8" autocomplete="${authMode === "login" ? "current-password" : "new-password"}">${authMode === "register" ? "<small>Aspoň 8 znaků</small>" : ""}</div>
        ${authMode === "register" ? `<label class="switch" style="align-items:flex-start;margin-bottom:14px;font-weight:500;font-size:14px"><input type="checkbox" required style="margin-top:2px">
          <span>Je mi aspoň 15 let, nebo mám souhlas rodiče. Souhlasím s <a href="#/pravidla" target="_blank">pravidly komunity</a> a beru na vědomí <a href="#/soukromi" target="_blank">zásady ochrany osobních údajů</a>.</span></label>` : ""}
        <button class="btn" style="width:100%">${authMode === "login" ? "Přihlásit se" : "Vytvořit účet"}</button>
      </form>
      <p style="text-align:center;margin-top:16px">${authMode === "login" ? 'Nemáš účet? <a href="#" id="swAuth">Zaregistruj se</a><br><button class="link-btn" id="forgot" style="margin-top:8px">Zapomněl jsi heslo?</button>' : 'Už máš účet? <a href="#" id="swAuth">Přihlas se</a>'}</p>${legalLinks()}</div>`;
    $("swAuth").onclick = e => { e.preventDefault(); authMode = authMode === "login" ? "register" : "login"; renderAccount(); };
    if ($("forgot")) $("forgot").onclick = async () => {
      const email = $("fEmail").value.trim();
      if (!email) { renderAccount({ ok: false, text: "Nejdřív napiš do pole E-mail svou adresu a pak klikni znovu na „Zapomněl jsi heslo?“." }); return; }
      const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: BASE_URL });
      renderAccount(error ? { ok: false, text: error.message } : { ok: true, text: `Pokud účet ${email} existuje, poslali jsme na něj odkaz pro nastavení nového hesla.` });
    };
    $("authForm").onsubmit = onAuthSubmit;
    return;
  }
  const p = me.profile || {};
  el.innerHTML = `<h1 class="page-title">Můj účet</h1><p class="lead">Přihlášen jako ${esc(me.user.email)}</p>${msgHtml}
    <div class="grid2">
      <form class="card" id="profileForm">
        <h2 class="section-title">Profil</h2>
        <div style="display:flex;align-items:center;gap:16px;margin-bottom:16px">${avatar(p, jaiSet.has(me.user.id)).replace('class="av', 'style="width:72px;height:72px;font-size:26px" class="av')}
          <div class="field" style="margin:0"><label for="fAv">Profilový obrázek</label><input id="fAv" type="file" accept="image/png,image/jpeg,image/webp,image/gif"><small>Max. 2 MB</small></div></div>
        <div class="field"><label for="pUser">Uživatelské jméno</label><input id="pUser" value="${esc(p.username)}" required minlength="3" maxlength="20" pattern="[A-Za-z0-9_.\\-]{3,20}"></div>
        <div class="field"><label for="pStream">Odkaz na tvůj stream (nepovinné)</label><input id="pStream" type="url" value="${esc(p.stream_url || "")}" placeholder="https://www.twitch.tv/… nebo https://www.youtube.com/@…"><small>Twitch, YouTube nebo Kick. Na mapě se u tebe objeví tlačítko „Sledovat stream“.</small></div>
        <div class="field"><label for="pVa">Moje virtuálka</label><select id="pVa"><option value="">Žádná</option>${vaList.filter(v => v.code !== "JAI").map(v => `<option value="${esc(v.code)}" ${p.va_default === v.code ? "selected" : ""}>${esc(v.name)}</option>`).join("")}</select>
          <small>Zobrazí se u tvých letů. Jáchym Air se zapíná sám u rezervovaných linek.</small></div>
        <div class="field"><label for="pSb">Uživatelské jméno v SimBriefu (nepovinné)</label><input id="pSb" value="${esc(p.simbrief_user || "")}" maxlength="40" placeholder="např. jachym12"><small>Aplikace podle něj načte tvůj letový plán.</small></div>
        <button class="btn">Uložit profil</button>
        <a class="btn ghost" href="#/pilot/${encodeURIComponent(p.username || "")}" style="margin-left:8px">Zobrazit profil</a>
      </form>
      <div class="card">
        <h2 class="section-title">Aplikace pro Windows</h2>
        ${appApi ? '<p><b>Právě ji používáš ✔</b> Stav trackeru najdeš v záložce <a href="#/tracker">Tracker</a>.</p>' : ""}
        <p>Aplikace běží na tvém PC vedle MSFS, posílá tvoji polohu na mapu a po přistání uloží let. Aktualizuje se sama.</p>
        <p><a class="btn" href="${esc(trackerDownloadUrl())}">Stáhnout aplikaci</a></p>
        <p class="muted">Spusť <b>JachymAirTracker.exe</b> a přihlas se stejným e-mailem a heslem jako tady. Když Windows ukáže modré okno „Systém Windows ochránil váš počítač“, klikni na <b>Další informace</b> a pak <b>Přesto spustit</b>.</p>
        <button class="btn ghost" id="logout">Odhlásit se</button>
      </div>
      <div class="card" id="crewCard"><h2 class="section-title">Crew center Jáchym Air</h2><p class="muted">Načítám…</p></div>
      <div class="card"><h2 class="section-title">Moje data</h2>
        <p class="muted" style="margin-top:0">Stáhni si kopii všeho, co o tobě JAI Tracker ukládá: profil, lety, přátele, zprávy a reakce (soubor JSON).</p>
        <button class="btn ghost" id="exportBtn">Stáhnout moje data</button>
        <p style="margin:14px 0 0;font-size:14px"><a href="#/soukromi">Ochrana osobních údajů</a> · <a href="#/pravidla">Pravidla komunity</a></p></div>
      <div class="card" id="delCard"><h2 class="section-title">Smazání účtu</h2>
        <p class="muted" style="margin-top:0">Smaže se tvůj účet, profil, všechny lety, přátelé, zprávy a reakce. Nejde to vrátit.</p>
        <div class="field"><label for="delConfirm">Pro potvrzení napiš své uživatelské jméno</label><input id="delConfirm" autocomplete="off"></div>
        <button class="btn" id="delBtn" style="background:var(--danger)">Smazat účet natrvalo</button></div>
      <form class="card" id="pwForm"><h2 class="section-title">Změna hesla</h2>
        <div class="field"><label for="pwNew">Nové heslo</label><input id="pwNew" type="password" minlength="8" required autocomplete="new-password"><small>Aspoň 8 znaků</small></div>
        <button class="btn">Změnit heslo</button></form>
    </div>`;
  renderCrewCard();
  $("exportBtn").onclick = async e => {
    e.target.disabled = true; e.target.textContent = "Připravuji…";
    const uid = me.user.id;
    const q = (t, sel, f) => f(sb.from(t).select(sel)).then(r => r.data || []);
    const [profile, flights, friendships, messages, reactions, photos] = await Promise.all([
      q("profiles", "*", x => x.eq("id", uid)), q("flights", "*", x => x.eq("user_id", uid).order("landed_at")),
      q("friendships", "*", x => x), q("messages", "*", x => x.order("created_at")),
      q("flight_reactions", "*", x => x.eq("user_id", uid)), q("pilot_aircraft_photos", "*", x => x.eq("user_id", uid)),
    ]);
    const data = { exportovano: new Date().toISOString(), email: me.user.email, profil: profile[0] || null, lety: flights, pratelstvi: friendships, zpravy: messages, reakce: reactions, fotky_letadel: photos };
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = `jai-tracker-data-${me.profile?.username || "pilot"}.json`;
    document.body.appendChild(a); a.click(); a.remove();
    e.target.disabled = false; e.target.textContent = "Stáhnout moje data";
  };
  $("delBtn").onclick = async () => {
    if ($("delConfirm").value.trim() !== (me.profile?.username || "")) { renderAccount({ ok: false, text: "Pro smazání napiš přesně své uživatelské jméno." }); return; }
    if (!confirm("Opravdu smazat účet a všechna data? Tohle nejde vrátit.")) return;
    $("delBtn").disabled = true; $("delBtn").textContent = "Mažu…";
    const { data, error } = await sb.functions.invoke("delete-account", { body: {} });
    if (!data?.ok) { let msg = data?.msg; if (error && !msg) { try { msg = (await error.context.json()).msg; } catch { msg = error.message; } }
      renderAccount({ ok: false, text: "Účet se nepodařilo smazat: " + (msg || "neznámá chyba") }); return; }
    if (appApi) appApi.logout();
    await sb.auth.signOut(); me = null; updateNav(); updateBadges();
    renderAccount({ ok: true, text: "Účet byl smazán. Díky, že jsi s námi létal." });
  };
  $("pwForm").onsubmit = async e => {
    e.preventDefault();
    const { error } = await sb.auth.updateUser({ password: $("pwNew").value });
    renderAccount(error ? { ok: false, text: error.message } : { ok: true, text: "Heslo změněno." });
  };
  $("logout").onclick = async () => { await sb.auth.signOut(); me = null; updateNav(); renderAccount(); };
  $("profileForm").onsubmit = onProfileSubmit;
}

async function renderCrewCard(msg) {
  const box = $("crewCard"); if (!box || !me) return;
  const { data: row } = await sb.from("jai_members").select("pilot_ident, pilot_name").eq("user_id", me.user.id).maybeSingle();
  const m = msg ? `<div class="msg ${msg.ok ? "ok" : "err"}">${esc(msg.text)}</div>` : "";
  if (row) {
    box.innerHTML = `<h2 class="section-title">Crew center Jáchym Air</h2>${m}
      <p><span class="badge">Pilot Jáchym Air</span> ${row.pilot_ident ? `<b>${esc(row.pilot_ident)}</b>` : ""} ${row.pilot_name ? esc(row.pilot_name) : ""}</p>
      <p class="muted">Tvoje letadlo svítí na mapě zeleně. ${appApi ? "Odesílání letů do crew centra nastavíš v záložce Tracker." : "Aby se lety samy odesílaly i do crew centra, vlož klíč také do aplikace (záložka Tracker)."}</p>`;
    return;
  }
  box.innerHTML = `<h2 class="section-title">Crew center Jáchym Air</h2>${m}
    <p>Jsi pilot Jáchym Air? Propoj účet s <a href="https://crew.jachymair.com" target="_blank" rel="noopener">crew centrem</a> a na mapě budeš svítit zeleně.</p>
    <form id="crewForm"><div class="field"><label for="crewKey">API klíč z crew centra</label><input id="crewKey" type="password" required autocomplete="off">
    <small>Najdeš ho v crew centru ve svém profilu. Klíč slouží jen k jednorázovému ověření a nikde se neukládá.</small></div>
    <button class="btn">Propojit</button></form>`;
  $("crewForm").onsubmit = async e => {
    e.preventDefault();
    const btn = e.target.querySelector("button"); btn.disabled = true; btn.textContent = "Ověřuji…";
    const { data, error } = await sb.functions.invoke("jai-link", { body: { api_key: $("crewKey").value.trim() } });
    let text = data?.msg;
    if (error && !text) { try { text = (await error.context.json()).msg; } catch { text = error.message; } }
    if (data?.ok) { await loadJai(); updateNav(); renderCrewCard({ ok: true, text: `Propojeno! Vítej mezi piloty Jáchym Air${data.ident ? ", " + data.ident : ""}.` }); }
    else renderCrewCard({ ok: false, text: text || "Propojení se nepovedlo." });
  };
}

async function onAuthSubmit(e) {
  e.preventDefault();
  const btn = e.target.querySelector("button"); btn.disabled = true;
  const email = $("fEmail").value.trim(), password = $("fPass").value;
  try {
    if (authMode === "login") {
      const { error } = await sb.auth.signInWithPassword({ email, password });
      if (error) throw new Error(error.message.includes("Invalid") ? "Špatný e-mail nebo heslo." : error.message);
      if (appApi && !appState?.online) appApi.login(email, password);
      await loadMe(); location.hash = "#/ucet"; renderAccount({ ok: true, text: "Jsi přihlášen. Vítej zpět!" });
    } else {
      const username = $("fUser").value.trim();
      const { data: taken } = await sb.from("profiles").select("id").ilike("username", username.replace(/[_%\\]/g, m => "\\" + m)).limit(1);
      if (taken?.length) throw new Error("Toto uživatelské jméno už někdo má.");
      const { data, error } = await sb.auth.signUp({ email, password, options: { data: { username }, emailRedirectTo: BASE_URL } });
      if (error) throw new Error(error.message);
      if (!data.session) { authMode = "login"; renderAccount({ ok: true, text: "Účet vytvořen. Potvrď ho odkazem v e-mailu a pak se přihlas." }); return; }
      if (appApi) appApi.login(email, password);
      await loadMe(); renderAccount({ ok: true, text: "Účet vytvořen. Vítej na palubě!" });
    }
  } catch (err) { renderAccount({ ok: false, text: err.message }); }
}

async function onProfileSubmit(e) {
  e.preventDefault();
  const btn = e.target.querySelector("button"); btn.disabled = true;
  try {
    const stream = $("pStream").value.trim();
    if (stream && !/^https:\/\/(www\.|m\.)?(twitch\.tv|youtube\.com|youtu\.be|kick\.com)\//.test(stream)) throw new Error("Odkaz na stream musí vést na Twitch, YouTube nebo Kick (začínat https://).");
    const sbUser = $("pSb").value.trim();
    if (sbUser && !/^[A-Za-z0-9_.@-]{1,40}$/.test(sbUser)) throw new Error("Jméno ze SimBriefu obsahuje nepovolené znaky.");
    const upd = { username: $("pUser").value.trim(), stream_url: stream || null, simbrief_user: sbUser || null, va_default: $("pVa").value || null };
    const file = $("fAv").files[0];
    if (file) {
      if (file.size > 2 * 1024 * 1024) throw new Error("Obrázek je větší než 2 MB.");
      const ext = (file.name.split(".").pop() || "png").toLowerCase();
      const path = `${me.user.id}/avatar-${Date.now()}.${ext}`;
      const { error: upErr } = await sb.storage.from("avatars").upload(path, file, { upsert: false, contentType: file.type });
      if (upErr) throw new Error(upErr.message);
      upd.avatar_url = sb.storage.from("avatars").getPublicUrl(path).data.publicUrl;
    }
    const { error } = await sb.from("profiles").update(upd).eq("id", me.user.id);
    if (error) throw new Error(error.code === "23505" ? "Toto uživatelské jméno už někdo má." : error.message);
    await loadMe(); renderAccount({ ok: true, text: "Profil uložen." });
  } catch (err) { renderAccount({ ok: false, text: err.message }); }
}

/* ---------- start ---------- */
(async () => {
  if (!sb) { router(); return; }
  const slow = setTimeout(router, 2500);   // když web odpovídá pomalu, ukaž stránku i tak
  try { await Promise.all([loadJai(), loadMe()]); } catch (e) { console.error(e); }
  clearTimeout(slow);
  sb.auth.onAuthStateChange(ev => { setTimeout(loadMe, 0); if (ev === "PASSWORD_RECOVERY") location.hash = "#/nove-heslo"; });
  const social = () => { loadFriends(); updateBadges(); heartbeat(); };
  setTimeout(social, 500); setInterval(updateBadges, 30000); setInterval(heartbeat, 120000);
  setInterval(loadJai, 300000);
  if (AUTH_TYPE === "recovery") { location.hash = "#/nove-heslo"; return; }
  if (AUTH_TYPE === "signup" || AUTH_TYPE === "email_change") { location.hash = "#/ucet"; setTimeout(() => renderAccount({ ok: true, text: "E-mail potvrzen. Vítej na palubě!" }), 50); return; }
  if (AUTH_ERROR) { location.hash = "#/ucet"; setTimeout(() => renderAccount({ ok: false, text: "Odkaz z e-mailu nefunguje: " + AUTH_ERROR }), 50); return; }
  router();
})();
</script>
</body>
</html>
