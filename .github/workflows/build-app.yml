name: Sestavit aplikaci

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Číslo nové verze (např. 0.4.0)"
        required: true
        default: "1.0.1"
      beta:
        description: "Testovací verze (beta) – běžným uživatelům se nenabídne"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Instalace nástrojů
        run: python -m pip install pyinstaller==6.22.3 SimConnect==0.4.26 pywebview==6.2.1

      - name: Zápis verze
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
          REPO: ${{ github.repository }}
          CHANNEL: ${{ inputs.beta && 'beta' || 'stable' }}
        run: printf 'VERSION = "%s"\nREPO = "%s"\nCHANNEL = "%s"\n' "$VERSION" "$REPO" "$CHANNEL" > app/build_info.py

      - name: Sestavení .exe
        working-directory: app
        run: pyinstaller --noconfirm --onefile --windowed --name JachymAirTracker --icon icon.ico --add-data "overlay.html;." --add-data "icon.ico;." --collect-all SimConnect --hidden-import build_info --hidden-import app_tk --hidden-import tkinter --hidden-import _tkinter --collect-all webview --collect-all clr_loader --collect-all pythonnet jai_app.py

      - name: Vydání na GitHubu
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ inputs.version }}${{ inputs.beta && '-beta' || '' }}
          name: Jáchym Air Tracker ${{ inputs.version }}${{ inputs.beta && ' (beta)' || '' }}
          files: app/dist/JachymAirTracker.exe
          prerelease: ${{ inputs.beta }}
          make_latest: ${{ inputs.beta && 'false' || 'true' }}
