<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jáchym Air – OBS overlay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Saira+Semi+Condensed:wght@500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --green: #1E9B36;
    --green-deep: #116B26;
    --mint: #C9F5D3;
    --white: #FFFFFF;
    --ink: #0D2414;
    --scale: 1;
    --accent-light: #6EE7A0;
  }
  html, body { margin: 0; background: transparent; overflow: hidden; }
  body {
    font-family: "Saira Semi Condensed", "Arial Narrow", "Roboto Condensed", Arial, sans-serif;
    color: var(--white);
    -webkit-font-smoothing: antialiased;
  }
  .wrap {
    position: fixed; left: 40px; bottom: 40px;
    transform: scale(var(--scale)); transform-origin: left bottom;
    display: flex; flex-direction: column; align-items: flex-start; gap: 14px;
  }

  /* ---------- spodní pruh ---------- */
  .bar {
    display: flex; align-items: stretch; height: 88px;
    background: var(--green);
    border-radius: 44px 16px 16px 44px;
    box-shadow: 0 8px 28px rgba(5, 40, 15, .38);
    overflow: hidden;
  }
  .roundel { width: 88px; flex: none; display: grid; place-items: center; background: var(--green-deep); }
  .ident { padding: 0 24px 0 18px; display: flex; flex-direction: column; justify-content: center; min-width: 160px; }
  .callsign { font-weight: 800; font-size: 31px; line-height: 1; letter-spacing: .01em; }
  .aircraft { font-size: 15px; font-weight: 500; opacity: .85; margin-top: 7px; max-width: 240px;
              white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cells { display: flex; }
  .cell { padding: 0 18px; display: flex; flex-direction: column; justify-content: center;
          border-left: 1px solid rgba(255, 255, 255, .22); }
  .val { font-size: 31px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .unit { font-size: 15px; font-weight: 600; opacity: .75; margin-left: 3px; }
  .lbl { font-size: 14px; font-weight: 500; opacity: .78; margin-top: 7px; }
  .phase-cell { padding: 0 22px 0 18px; display: flex; align-items: center; border-left: 1px solid rgba(255,255,255,.22); }
  .phase { background: var(--white); color: var(--green-deep); font-weight: 700; font-size: 17px;
           padding: 6px 14px 7px; border-radius: 999px; white-space: nowrap; }
  .waves { display: flex; align-items: center; padding-right: 20px; opacity: .9; }
  .offline .cells, .offline .phase-cell { display: none; }
  .offline .aircraft { opacity: 1; font-weight: 600; }

  /* ---------- karta přistání ---------- */
  .landing {
    display: flex; align-items: stretch;
    background: var(--white); color: var(--ink);
    border-radius: 16px; overflow: hidden;
    box-shadow: 0 8px 28px rgba(5, 40, 15, .38);
    opacity: 0; transform: translateY(24px);
    transition: opacity .45s ease, transform .55s cubic-bezier(.2, .9, .25, 1.2);
  }
  .landing.show { opacity: 1; transform: none; }
  .score-block { background: var(--green); color: var(--white); padding: 16px 24px 18px; min-width: 150px;
                 display: flex; flex-direction: column; justify-content: center; }
  .score { font-size: 72px; font-weight: 800; line-height: .9; font-variant-numeric: tabular-nums; }
  .score small { font-size: 26px; font-weight: 700; opacity: .8; margin-left: 2px; }
  .verdict { font-size: 20px; font-weight: 700; margin-top: 8px; }
  .detail { padding: 16px 26px 18px; display: flex; flex-direction: column; justify-content: center; gap: 12px; }
  .detail-row { display: flex; gap: 30px; }
  .big { font-size: 40px; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; color: var(--ink); }
  .big .unit { color: var(--green-deep); opacity: 1; }
  .dlbl { font-size: 14px; font-weight: 600; color: var(--green-deep); margin-top: 5px; }
  .segments { display: flex; gap: 4px; }
  .rwy { font-size: 15px; font-weight: 600; color: var(--green-deep); }
  .rwy:empty { display: none; }
  .seg { width: 22px; height: 8px; border-radius: 2px; background: #E2EDE4; }
  .seg.on { background: var(--green); }
  .landing.show .seg.on { animation: fill .3s both; }
  @keyframes fill { from { background: #E2EDE4; } }

  /* ---------- pozice ---------- */
  body.pos-vpravo .wrap { left: auto; right: 40px; align-items: flex-end; transform-origin: right bottom; }
  body.pos-nahore .wrap { bottom: auto; top: 40px; flex-direction: column-reverse; transform-origin: left top; }
  body.pos-vpravo.pos-nahore .wrap { transform-origin: right top; }

  /* ---------- styl: minimalistický ---------- */
  body.styl-mini .bar { height: 54px; border-radius: 27px; background: rgba(10, 20, 14, .72); backdrop-filter: blur(6px); }
  body.styl-mini .roundel { width: 54px; background: var(--green); }
  body.styl-mini .roundel svg { width: 36px; height: 36px; }
  body.styl-mini .aircraft, body.styl-mini .lbl, body.styl-mini .waves, body.styl-mini .cell:nth-child(2) { display: none; }
  body.styl-mini .callsign { font-size: 22px; }
  body.styl-mini .ident { min-width: 0; padding: 0 16px 0 14px; }
  body.styl-mini .val { font-size: 22px; }
  body.styl-mini .cell { border-left-color: rgba(255,255,255,.15); padding: 0 14px; }
  body.styl-mini .phase { font-size: 14px; padding: 4px 10px; background: var(--green); color: #fff; }
  body.styl-mini .score-block { padding: 10px 16px; min-width: 100px; }
  body.styl-mini .score { font-size: 46px; }
  body.styl-mini .big { font-size: 28px; }

  /* ---------- styl: tmavý ---------- */
  body.styl-tmavy .bar { background: rgba(8, 14, 11, .88); border: 1px solid rgba(255,255,255,.08); }
  body.styl-tmavy .roundel { background: var(--green); }
  body.styl-tmavy .val { color: var(--accent-light); }
  body.styl-tmavy .phase { background: var(--green); color: #fff; }
  body.styl-tmavy .landing { background: rgba(8, 14, 11, .92); color: #E6F0E9; border: 1px solid rgba(255,255,255,.08); }
  body.styl-tmavy .big { color: #fff; }
  body.styl-tmavy .big .unit, body.styl-tmavy .dlbl, body.styl-tmavy .rwy { color: var(--accent-light); }
  body.styl-tmavy .seg { background: rgba(255,255,255,.12); }
  body.styl-tmavy .seg.on { background: var(--accent-light); }

  /* ---------- styl: kokpit ---------- */
  body.styl-kokpit { font-family: "JetBrains Mono", Consolas, monospace; }
  body.styl-kokpit .bar { background: #050806; border: 2px solid #2A3A30; border-radius: 10px; height: 82px; }
  body.styl-kokpit .roundel { background: #0D1A12; border-right: 2px solid #2A3A30; width: 82px; }
  body.styl-kokpit .roundel circle, body.styl-kokpit .roundel text { stroke: var(--accent-light); fill: none; }
  body.styl-kokpit .roundel text { fill: var(--accent-light); stroke: none; }
  body.styl-kokpit .callsign { color: var(--accent-light); font-size: 24px; letter-spacing: .04em; }
  body.styl-kokpit .aircraft { color: #8FA89A; font-size: 12px; }
  body.styl-kokpit .val { color: #4ADE80; font-size: 26px; }
  body.styl-kokpit .unit { color: #6B8577; font-size: 12px; }
  body.styl-kokpit .lbl { color: #6B8577; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; }
  body.styl-kokpit .cell, body.styl-kokpit .phase-cell { border-left: 2px solid #1C2A22; }
  body.styl-kokpit .phase { background: transparent; color: #FBBF24; border: 2px solid #FBBF24; border-radius: 4px; font-size: 14px; }
  body.styl-kokpit .waves { display: none; }
  body.styl-kokpit .landing { background: #050806; color: #E6F0E9; border: 2px solid #2A3A30; border-radius: 10px; }
  body.styl-kokpit .score-block { background: #0D1A12; color: var(--accent-light); border-right: 2px solid #2A3A30; }
  body.styl-kokpit .big { color: #4ADE80; font-size: 32px; }
  body.styl-kokpit .big .unit, body.styl-kokpit .dlbl, body.styl-kokpit .rwy { color: #6B8577; }
  body.styl-kokpit .verdict { color: #FBBF24; }
  body.styl-kokpit .seg { background: #1C2A22; border-radius: 0; }
  body.styl-kokpit .seg.on { background: #4ADE80; }

  @media (prefers-reduced-motion: reduce) {
    .landing { transition: opacity .2s; transform: none; }
    .landing.show .seg.on { animation: none; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="landing" id="landing" aria-live="polite">
    <div class="score-block">
      <div class="score" id="lScore">0<small>/10</small></div>
      <div class="verdict" id="lVerdict">–</div>
    </div>
    <div class="detail">
      <div class="detail-row">
        <div><div class="big" id="lFpm">0<span class="unit">fpm</span></div><div class="dlbl">Rychlost dosednutí</div></div>
        <div><div class="big" id="lG">1,00<span class="unit">G</span></div><div class="dlbl">Přetížení</div></div>
      </div>
      <div class="segments" id="segs"></div>
      <div class="rwy" id="lRwy"></div>
    </div>
  </div>

  <div class="bar offline" id="bar">
    <div class="roundel">
      <svg width="58" height="58" viewBox="0 0 58 58" aria-label="Jáchym Air">
        <circle cx="29" cy="29" r="25.5" fill="none" stroke="#fff" stroke-width="4"/>
        <text x="29.5" y="40" text-anchor="middle" fill="#fff"
              font-family="Saira Semi Condensed, Arial, sans-serif" font-weight="800" font-size="32">J</text>
      </svg>
    </div>
    <div class="ident">
      <div class="callsign" id="callsign">JAI</div>
      <div class="aircraft" id="aircraft">Spouštím tracker…</div>
    </div>
    <div class="cells">
      <div class="cell"><div class="val" id="alt">0<span class="unit">ft</span></div><div class="lbl">Výška</div></div>
      <div class="cell"><div class="val" id="ias">0<span class="unit">kt</span></div><div class="lbl">IAS</div></div>
      <div class="cell"><div class="val" id="gs">0<span class="unit">kt</span></div><div class="lbl">GS</div></div>
      <div class="cell"><div class="val" id="vs">0<span class="unit">fpm</span></div><div class="lbl">V/S</div></div>
      <div class="cell"><div class="val" id="hdg">000<span class="unit">°</span></div><div class="lbl">Kurz</div></div>
    </div>
    <div class="phase-cell"><div class="phase" id="phase">Na zemi</div></div>
    <div class="waves">
      <svg width="54" height="30" viewBox="0 0 54 30" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" aria-hidden="true">
        <path d="M3 9c8-7 14 5 24 0s16-7 24-1"/>
        <path d="M3 16c8-7 14 5 24 0s16-7 24-1" opacity=".75"/>
        <path d="M3 23c8-7 14 5 24 0s16-7 24-1" opacity=".5"/>
      </svg>
    </div>
  </div>
</div>

<script>
  const qs = new URLSearchParams(location.search);
  if (qs.get("scale")) document.documentElement.style.setProperty("--scale", qs.get("scale"));
  const styl = qs.get("styl");
  if (["mini", "tmavy", "kokpit"].includes(styl)) document.body.classList.add("styl-" + styl);
  for (const p of (qs.get("pozice") || "").split(",")) if (["vpravo", "nahore"].includes(p)) document.body.classList.add("pos-" + p);
  const barva = (qs.get("barva") || "").replace(/[^0-9a-fA-F]/g, "");
  if (barva.length === 6) {
    const n = parseInt(barva, 16), r = n >> 16, g = (n >> 8) & 255, b = n & 255;
    const mix = (t, k) => "#" + [r, g, b].map(c => Math.round(c + (t - c) * k).toString(16).padStart(2, "0")).join("");
    const st = document.documentElement.style;
    st.setProperty("--green", "#" + barva);
    st.setProperty("--green-deep", mix(0, .32));
    st.setProperty("--accent-light", mix(255, .45));
  }
  const SHOW_MS = (Number(qs.get("cas")) || 20) * 1000;   // jak dlouho je karta přistání vidět (s)

  const $ = id => document.getElementById(id);
  const nf = new Intl.NumberFormat("cs-CZ");
  const unit = u => `<span class="unit">${u}</span>`;
  const segs = $("segs");
  for (let i = 0; i < 10; i++) { const s = document.createElement("div"); s.className = "seg"; segs.appendChild(s); }

  const pageStart = Date.now();
  let shownId = null, hideTimer = null;

  function render(d) {
    $("callsign").textContent = d.callsign || "JAI";
    const bar = $("bar");
    if (!d.connected) {
      bar.classList.add("offline");
      $("aircraft").textContent = d.status || "Čekám na MSFS…";
    } else {
      bar.classList.remove("offline");
      $("aircraft").textContent = d.aircraft || "";
      $("alt").innerHTML = nf.format(d.alt) + unit("ft");
      $("ias").innerHTML = d.ias + unit("kt");
      $("gs").innerHTML = d.gs + unit("kt");
      $("vs").innerHTML = (d.vs > 0 ? "+" : "") + nf.format(d.vs) + unit("fpm");
      $("hdg").innerHTML = String(d.hdg).padStart(3, "0") + unit("°");
      $("phase").textContent = d.phase;
    }
    if (d.landing && d.landing.id !== shownId) {
      shownId = d.landing.id;
      if (d.landing.id > pageStart - 5000) showLanding(d.landing);
    }
  }

  function showLanding(l) {
    $("lScore").innerHTML = Number(l.skore).toLocaleString("cs-CZ", { maximumFractionDigits: 1 }) + "<small>/10</small>";
    $("lVerdict").textContent = l.hodnoceni;
    $("lFpm").innerHTML = nf.format(l.fpm) + unit("fpm");
    $("lG").innerHTML = l.g.toFixed(2).replace(".", ",") + unit("G");
    $("lRwy").textContent = [l.draha, l.odskoky ? `odskoky: ${l.odskoky}` : ""].filter(Boolean).join(" · ");
    const on = Math.round(l.skore);
    [...segs.children].forEach((s, i) => {
      s.classList.toggle("on", i < on);
      s.style.animationDelay = (0.35 + i * 0.07) + "s";
    });
    const card = $("landing");
    card.classList.remove("show");
    void card.offsetWidth;
    card.classList.add("show");
    clearTimeout(hideTimer);
    hideTimer = setTimeout(() => card.classList.remove("show"), SHOW_MS);
  }

  async function tick() {
    try {
      const r = await fetch("/data", { cache: "no-store" });
      render(await r.json());
    } catch (e) {
      render({ connected: false, status: "Tracker neběží – spusť jai_tracker" });
    }
  }
  tick();
  setInterval(tick, 250);
</script>
</body>
</html>
