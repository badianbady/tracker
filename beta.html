  :root {
    --green: #1E9B36; --green-deep: #116B26; --green-soft: #E3F5E7;
    --bg: #F3F6F4; --surface: #FFFFFF; --text: #102217; --muted: #5C6E63;
    --line: #DCE5DF; --other: #66788A; --warn: #C2410C; --danger: #B91C1C;
    --display: "Saira Semi Condensed", "Arial Narrow", Arial, sans-serif;
    --body: "Source Sans 3", "Segoe UI", Arial, sans-serif;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0C1610; --surface: #14211A; --text: #E6F0E9; --muted: #9AB0A2;
      --line: #24372C; --green-soft: #183A22; --other: #8FA1B3;
      color-scheme: dark;
    }
  }
  *, *::before, *::after { box-sizing: inherit; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--text); font: 16px/1.5 var(--body); display: flex; flex-direction: column; }
  a { color: var(--green); }
  h1, h2, h3 { font-family: var(--display); line-height: 1.1; margin: 0; }
  button, input { font: inherit; }
  :focus-visible { outline: 3px solid var(--green); outline-offset: 2px; }

  /* ---------- Halloween (30. 10. – 2. 11., zapíná a vypíná se samo) ---------- */
  html.halloween { --green: #E26A12; --green-deep: #8A3A06; --green-soft: #FCE7D3; }
  @media (prefers-color-scheme: dark) { html.halloween { --green-soft: #3A2210; } }
  html.halloween header { background: linear-gradient(90deg, #24123A 0%, #3B1A52 55%, #5A2A12 100%); }
  html.halloween nav a.active { color: #8A3A06; }
  .bat { position: absolute; top: 6px; width: 36px; height: 18px; pointer-events: none; opacity: .85; animation: batfly 26s linear infinite; z-index: 0; }
  .bat svg { width: 100%; height: 100%; animation: flap .35s ease-in-out infinite alternate; transform-origin: center; }
  .bat.b2 { top: 30px; width: 22px; animation-duration: 34s; animation-delay: -12s; opacity: .7; }
  .bat.b3 { top: 14px; width: 18px; animation-duration: 41s; animation-delay: -25s; opacity: .6; }
  @keyframes batfly { 0% { left: -40px; transform: translateY(0); } 25% { transform: translateY(6px); } 50% { transform: translateY(-4px); } 75% { transform: translateY(5px); } 100% { left: calc(100% + 40px); transform: translateY(0); } }
  @keyframes flap { from { transform: scaleY(1); } to { transform: scaleY(.45); } }
  @media (prefers-reduced-motion: reduce) { .bat, .bat svg { animation: none; } .bat { left: 40%; } .bat.b2 { left: 55%; } .bat.b3 { left: 70%; } }
  header > a, header > nav { position: relative; z-index: 1; }
  .hl-card.boo { background: #2A1838; color: #FDE7D3; } .hl-card.boo .hl-k { color: #F9A15A; } .hl-card.boo .hl-ic { background: #E26A12; }

  /* ---------- přehrání letu a rozbor přiblížení ---------- */
  .replay-bar { position: absolute; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 1000; display: flex; gap: 10px; align-items: center;
    background: var(--card, #fff); color: var(--text, #13241A); border-radius: 14px; padding: 8px 12px; box-shadow: 0 8px 26px rgba(0,0,0,.28); width: min(620px, 92vw); }
  .replay-bar button { border: 0; background: var(--green); color: #fff; width: 36px; height: 36px; border-radius: 50%; font-size: 15px; cursor: pointer; flex: none; }
  .replay-bar #rpClose { background: transparent; color: inherit; font-size: 18px; }
  .replay-bar input[type=range] { flex: 1; min-width: 80px; accent-color: var(--green); }
  .rp-hud { font-variant-numeric: tabular-nums; font-weight: 600; font-size: 14px; white-space: nowrap; }
  .appr-verdict { font-weight: 700; padding: 8px 12px; border-radius: 8px; margin-bottom: 8px; } .appr-verdict span { font-weight: 400; font-size: 13px; }
  .appr-verdict.ok { background: #DCF5E3; color: #0F6A27; } .appr-verdict.bad { background: #FDE2E2; color: #9B1C1C; }
  .appr-chart { width: 100%; height: auto; display: block; color: inherit; }
  .appr-legend { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12px; margin: 4px 0 8px; } .appr-legend i { display: inline-block; width: 14px; height: 3px; vertical-align: middle; margin-right: 4px; }
  .appr-table { font-size: 13px; } .appr-table td, .appr-table th { padding: 4px 6px; } .appr-table .ok { color: #0F6A27; } .appr-table .bad { color: #B91C1C; font-weight: 700; }
  @media (prefers-color-scheme: dark) { .appr-verdict.ok { background: #143A20; color: #8BE3A0; } .appr-verdict.bad { background: #4A1414; color: #FECACA; } .appr-table .ok { color: #8BE3A0; } .appr-table .bad { color: #FCA5A5; } }

  .wx-row { padding: 8px 0; border-bottom: 1px solid rgba(127,127,127,.18); } .wx-row:last-child { border-bottom: 0; }
  .wx-h { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; } .wx-k { display: flex; flex-wrap: wrap; gap: 2px 14px; font-size: 13px; margin-top: 3px; }
  .cat-chip { font-size: 11px; font-weight: 700; padding: 1px 7px; border-radius: 999px; color: #fff; }
  .cat-chip.cat-VFR { background: #16A34A; } .cat-chip.cat-MVFR { background: #2563EB; } .cat-chip.cat-IFR { background: #DC2626; } .cat-chip.cat-LIFR { background: #C026D3; }

  /* ---------- plánované lety a odznaky ---------- */
  .plan-grid { display: grid; gap: 10px 14px; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
  .plan-grid label { display: flex; flex-direction: column; gap: 4px; font-weight: 600; font-size: 14px; }
  .plan-table .day-row td { background: var(--green-soft); color: var(--green-deep); font-weight: 700; font-size: 14px; text-transform: capitalize; }
  .chip-st { display: inline-block; font-size: 12px; font-weight: 700; padding: 2px 9px; border-radius: 999px; background: var(--bg, #EEF2EF); white-space: nowrap; }
  .chip-st.ok { background: #DCF5E3; color: #0F6A27; } .chip-st.wait { background: #FEF3C7; color: #8A5A00; } .chip-st.no { background: #FDE2E2; color: #9B1C1C; }
  @media (prefers-color-scheme: dark) { .chip-st { background: #1C2A22; } .chip-st.ok { background: #143A20; color: #8BE3A0; } .chip-st.wait { background: #3A2A08; color: #FDE68A; } .chip-st.no { background: #4A1414; color: #FECACA; } }
  .pb-row { display: grid; grid-template-columns: 44px 64px 1fr auto; gap: 6px; align-items: center; font-size: 13px; padding: 3px 0; border-bottom: 1px solid rgba(127,127,127,.18); }
  .bdg-grid { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); margin-bottom: 8px; }
  .bdg { border: 1px solid var(--line, #DCE3DE); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 3px; align-items: flex-start; background: var(--card, #fff); opacity: .62; filter: grayscale(.9); }
  .bdg.on { opacity: 1; filter: none; border-color: var(--green); box-shadow: inset 0 0 0 1px var(--green); }
  .bdg .b-ic { font-size: 28px; line-height: 1; } .badge b { font-size: 15px; } .bdg .b-d { font-size: 12px; color: var(--muted, #5C6E63); }
  .bdg .b-ok { font-size: 12px; font-weight: 700; color: var(--green-deep); }
  .bdg .b-p { width: 100%; height: 6px; border-radius: 3px; background: var(--line, #DCE3DE); overflow: hidden; margin-top: 4px; } .bdg .b-p i { display: block; height: 100%; background: var(--green); }

  /* ---------- automatická věž ---------- */
  .tower-bar { position: fixed; top: calc(60px + env(safe-area-inset-top, 0px)); left: 50%; transform: translateX(-50%); z-index: 1200; max-width: min(760px, 94vw);
    padding: 9px 16px; border-radius: 0 0 12px 12px; font-weight: 600; box-shadow: 0 6px 20px rgba(0,0,0,.25); display: flex; gap: 10px; align-items: baseline; }
  .tower-bar > b { white-space: nowrap; }
  .tower-bar.danger { background: #B91C1C; color: #fff; animation: towerPulse 1s ease-in-out infinite alternate; }
  .tower-bar.warn { background: #F59E0B; color: #1F1300; } .tower-bar.info { background: #1E3A5F; color: #fff; }
  @keyframes towerPulse { from { filter: brightness(1); } to { filter: brightness(1.25); } }
  @media (prefers-reduced-motion: reduce) { .tower-bar.danger { animation: none; } }
  .tower-line { padding: 8px 12px; border-radius: 8px; margin-top: 6px; font-weight: 600; }
  .tower-line.danger { background: #FDE2E2; color: #8A1111; } .tower-line.warn { background: #FEF3C7; color: #7A4B00; }
  .tower-line.info { background: #E0ECFA; color: #1E3A5F; } .tower-line.ok { background: var(--green-soft); color: var(--green-deep); }
  @media (prefers-color-scheme: dark) { .tower-line.danger { background: #4A1414; color: #FECACA; } .tower-line.warn { background: #3A2A08; color: #FDE68A; } .tower-line.info { background: #16263A; color: #BFDBFE; } }

  /* ---------- hlavička ---------- */
  header { background: var(--green); color: #fff; display: flex; align-items: center; gap: 18px; padding: 0 18px; height: 60px; flex: none; position: relative; z-index: 1000; }
  .brand { display: flex; align-items: center; gap: 10px; color: #fff; text-decoration: none; font-family: var(--display); font-weight: 800; font-size: 23px; white-space: nowrap; }
  nav { display: flex; gap: 4px; margin-left: auto; overflow-x: auto; }
  nav a { color: #fff; text-decoration: none; font-weight: 600; padding: 7px 12px; border-radius: 8px; white-space: nowrap; display: flex; align-items: center; gap: 8px; }
  nav a:hover { background: rgba(255,255,255,.14); }
  nav a.active { background: #fff; color: var(--green-deep); }
  nav .mini-av { width: 24px; height: 24px; font-size: 12px; }

  main { flex: 1; min-height: 0; position: relative; }
  .view { display: none; height: 100%; overflow-y: auto; }
  .view.on { display: block; }
  .page { max-width: 1060px; margin: 0 auto; padding: 32px 20px 60px; }

  /* ---------- mapa ---------- */
  #view-map { position: relative; overflow: hidden; }
  #map { position: absolute; inset: 0; background: var(--bg); }
  .air-panel { position: absolute; top: 16px; left: 16px; bottom: 16px; width: 300px; z-index: 500;
               background: var(--surface); border-radius: 14px; box-shadow: 0 6px 24px rgba(0,30,10,.18);
               display: flex; flex-direction: column; overflow: hidden; }
  .air-head { padding: 16px 18px 12px; border-bottom: 1px solid var(--line); }
  .air-head h2 { font-size: 22px; }
  .legend { display: flex; gap: 14px; font-size: 14px; color: var(--muted); margin-top: 6px; }
  .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 5px; }
  .air-list { overflow-y: auto; flex: 1; }
  .air-item { display: block; width: 100%; text-align: left; border: 0; background: none; color: inherit; cursor: pointer;
              padding: 12px 18px; border-bottom: 1px solid var(--line); border-left: 4px solid var(--other); }
  .air-item.jai { border-left-color: var(--green); }
  .air-item:hover { background: var(--green-soft); }
  .air-cs { font-family: var(--display); font-weight: 700; font-size: 19px; }
  .air-sub { font-size: 14px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .air-nums { font-size: 14px; margin-top: 2px; font-variant-numeric: tabular-nums; }
  .empty { padding: 22px 18px; color: var(--muted); }
  .plane-ic { background: none; border: 0; }

function windText(s) {

    .replace(/dohlednost/g, "visibility").replace(/bez významné oblačnosti/g, "no significant cloud").replace(/polojasno/g, "scattered").replace(/skoro jasno/g, "few")
    .replace(/oblačno/g, "broken").replace(/zataženo/g, "overcast").replace(/slabý /g, "light ").replace(/silný /g, "heavy ").replace(/déšť/g, "rain").replace(/mrholení/g, "drizzle")
    .replace(/sníh/g, "snow").replace(/bouřka/g, "thunderstorm").replace(/přeháňky/g, "showers").replace(/mlha/g, "fog").replace(/kouřmo/g, "mist").replace(/zákal/g, "haze");
}
function tr(text) {
  if (LANG !== "en" || !text) return text;
  const lead = text.match(/^\s*/)[0], trail = text.match(/\s*$/)[0], core = text.trim();
  if (!core) return text;
  if (Object.prototype.hasOwnProperty.call(EN, core)) return lead + EN[core] + trail;
  for (const [re, rep] of EN_PAT) { if (!re.test(core)) continue; const out = core.replace(re, rep); if (out !== core) return lead + out + trail; }
  // ikonka nebo znak na začátku / konci („✉ Napsat“, „· let“, „Kapitán:“): přeložit text uvnitř
  const sym = core.match(/^([^\p{L}\p{N}„“"(]+)?(.*?)([^\p{L}\p{N}…)“”"%]+)?$/u);
  if (sym && (sym[1] || sym[3]) && sym[2]) { const inner = tr(sym[2]); if (inner !== sym[2]) return lead + (sym[1] || "") + inner + (sym[3] || "") + trail; }
  // složený text „A · B · C“: přeložit každou část zvlášť
  if (core.includes(" · ")) { const parts = core.split(" · "), outp = parts.map(x => tr(x)); if (outp.some((x, i) => x !== parts[i])) return lead + outp.join(" · ") + trail; }
  return text;
}
const I18N_SKIP = "script,style,textarea,code,pre,.ugc,.ev-text,.wx-raw,.bubble,[data-noi18n]";
function translateTree(root) {
  if (LANG !== "en" || !root) return;
  if (root.nodeType === 3) { const p = root.parentElement; if (p && !p.closest(I18N_SKIP)) { const v = tr(root.nodeValue); if (v !== root.nodeValue) root.nodeValue = v; } return; }
  if (root.nodeType !== 1 || root.closest?.(I18N_SKIP)) return;
  const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  let n; const todo = [];
  while ((n = w.nextNode())) { if (!n.parentElement?.closest(I18N_SKIP)) todo.push(n); }
  todo.forEach(t => { const v = tr(t.nodeValue); if (v !== t.nodeValue) t.nodeValue = v; });
  const els = [root, ...root.querySelectorAll("[placeholder],[title],[aria-label],[alt]")];
  els.forEach(el => ["placeholder", "title", "aria-label", "alt"].forEach(a => { const v = el.getAttribute?.(a); if (v) { const k = EN["@" + v] ? "@" + v : null; const t2 = k ? EN[k] : tr(v); if (t2 !== v) el.setAttribute(a, t2); } }));
}

let appStale = false, appFails = 0;
async function pollApp() {
  let st = null;
  try { st = await appApi.get_state(); } catch { st = null; }
  if (st && st.version) { appState = st; appFails = 0; appStale = false; renderTowerBar(st.tower); }
  else {
    // Zastaralá aplikace odpovídá vždy hláškou „Nepovolená stránka“. Když aplikace jen chvíli neodpovídá
    // (vytížený počítač, simulátor), nic se nehlásí – zůstanou poslední známé údaje.
    const refused = st && st.ok === false && /Nepovolen/.test(st.msg || "");
    if (!refused) { appFails = 0; return; }
    appFails++;
    if (appFails < 3) return;
    appState = st;
    appStale = true;
  }
  if (appStale) {
    const pill = $("appPill");
    pill.classList.remove("ok"); pill.classList.add("upd");
    $("appPillText").textContent = "Aktualizuj aplikaci";
    if ($("view-tracker").classList.contains("on") && !$("staleCard")) renderTracker(true);
    return;
  }
  const s = appState, pill = $("appPill");
  pill.classList.toggle("ok", !!s.connected);
  pill.classList.toggle("upd", !!s.update);
  $("appPillText").textContent = s.update ? `Nová verze ${s.update.version}` : s.connected ? `MSFS · ${s.phase}` : "Čekám na MSFS";
  if ($("view-tracker").classList.contains("on")) renderTracker(false);
}

const views = ["map", "zebricek", "piloti", "pilot", "ucet", "tracker", "novinky", "sprava", "noveheslo", "pratele", "chat", "soukromi", "pravidla", "fotky", "rozpis", "briefing", "obchod", "rotace", "plany"];
async function router() {
  const parts = location.hash.replace(/^#\/?/, "").split("/");
  const r = parts[0] || "map";
  const view = r === "let" || r === "linka" ? "map" : r === "nove-heslo" ? "noveheslo" : views.includes(r) ? r : "map";
  views.forEach(v => $("view-" + v).classList.toggle("on", v === view));
  document.querySelectorAll("nav a").forEach(a => a.classList.toggle("active", a.dataset.r === (view === "pilot" ? "piloti" : view === "chat" ? "pratele" : view === "briefing" ? "rozpis" : view)));
  if (notConfigured) { showNotConfigured(view); return; }
  if (view === "map") {
    initMap(); setTimeout(() => map.invalidateSize(), 50);
    if (r === "let") openFocus(parts); else if (r === "linka") openRoute(decodeURIComponent(parts[1] || "")); else if (focus) closeFocus();
  }
  if (view === "zebricek") renderLeaderboard();
  if (view === "piloti") renderPilots();
  if (view === "pilot") renderPilot(decodeURIComponent(parts[1] || ""));
  if (view === "ucet") renderAccount();
  if (view === "tracker") renderTracker(true);
  if (view === "novinky") renderNews(parts[1]);
  clearInterval(chatTimer);
  if (view === "pratele") renderFriends();
  if (view === "chat") renderChat(decodeURIComponent(parts[1] || ""));
  if (view === "sprava") renderAdmin();
  if (view === "noveheslo") renderNewPassword();
  if (view === "soukromi") renderPrivacy();
  if (view === "pravidla") renderRules();
  if (view === "fotky") renderGallery();
  if (view === "rozpis") renderRoster(parts[1]);
  if (view === "briefing") renderBriefing(+parts[1], +(parts[2] || 0));
  if (view === "obchod") renderShop();
  if (view === "rotace") renderTrip(+parts[1]);
  if (view === "plany") renderPlans();
}
window.addEventListener("hashchange", router);

function showNotConfigured(view) {
  const box = `<div class="page"><div class="card"><h2>Web ještě není propojený se Supabase</h2>
    <p>Otevři soubor <b>config.js</b> a vyplň SUPABASE_URL a SUPABASE_KEY.</p></div></div>`;

  else $(view).innerHTML = box;
}

let jaiRoutes = [], jaiFleet = [], routesByAp = new Map();
async function loadRoutes() {
  if (!sb) return;
  const [r, f] = await Promise.all([
    sb.from("jai_routes").select("*").order("flight_number").limit(5000),
    sb.from("jai_fleet").select("*").limit(5000),
  ]);
  if (r.error) return;
  jaiRoutes = r.data || []; jaiFleet = f.data || [];
  routesByAp = new Map();
  for (const rt of jaiRoutes) for (const code of [rt.dep, rt.arr]) {
    if (!routesByAp.has(code)) routesByAp.set(code, []);
    routesByAp.get(code).push(rt);
  }
}

const ALT_STOPS = [[0, [249, 115, 22]], [4000, [234, 179, 8]], [10000, [34, 197, 94]], [20000, [6, 182, 212]], [30000, [59, 130, 246]], [40000, [168, 85, 247]]];
function altColor(alt) {
  alt = Math.max(0, alt || 0);
  for (let i = 1; i < ALT_STOPS.length; i++) {
    const [a1, c1] = ALT_STOPS[i - 1], [a2, c2] = ALT_STOPS[i];
    if (alt <= a2) { const t = (alt - a1) / (a2 - a1); return `rgb(${c1.map((v, k) => Math.round(v + (c2[k] - v) * t)).join(",")})`; }
  }
  return "rgb(168,85,247)";
}

function drawAirports() {
  if (!map || !airportLayer || !map.hasLayer(airportLayer)) return;
  airportLayer.clearLayers();
  const z = map.getZoom(), b = map.getBounds().pad(0.1);
  const minSize = z >= 7 ? 2 : z >= 4 ? 3 : 9;
  let n = 0;
  for (const [icao, name, lat, lon, size, city] of airports) {
    const jai = routesByAp.has(icao);
    if ((size < minSize && !(jai && z >= 3)) || !b.contains([lat, lon])) continue;
    if (++n > 900) break;
    const big = size === 3;
    const c = L.circleMarker([lat, lon], {
      renderer: apRenderer, radius: jai ? 6.5 : big ? 6 : 4.5, weight: jai ? 3 : 2.5,
      color: jai ? "#fff" : big ? "#116B26" : "#5C6E63", fillColor: jai ? "#1E9B36" : "#fff", fillOpacity: 1
    }).addTo(airportLayer);
    const m = metarCache.get(icao);
    c.bindPopup(() => {
      const here = liveRows.filter(r => r.lat != null && Math.abs(r.lat - lat) < 0.06 && Math.abs(r.lon - lon) < 0.09);
      return `<div class="pop-cs">${esc(icao)}</div><div><b>${esc(name)}</b></div>${city ? `<div class="muted">${esc(city)}</div>` : ""}
        ${here.length ? `<div style="margin-top:6px">Na letišti: ${here.map(r => esc(r.callsign || r.profiles?.username)).join(", ")}</div>` : ""}
        ${jai ? routesPopupHtml(icao) : ""}
        ${plannedBoardHtml(icao)}
        ${metarCache.get(icao) ? metarHtml(metarCache.get(icao))
          : metarMissing.has(icao) ? '<div class="muted" style="margin-top:6px">Letiště nemá meteostanici, METAR tu není.</div>'
          : '<div class="muted" style="margin-top:6px">Načítám počasí…</div>'}`;
    }, { maxWidth: 340 });
    c.on("popupopen", () => ensureMetar(icao, c));
    const showWx = settings.weather && m;
    const detail = settings.apStyle === "podrobny";
    const label = `${showWx && m.fltCat ? `<i class="cat cat-${esc(m.fltCat)}"></i>` : ""}${esc(icao)}${showWx && detail && m.temp != null ? `<span class="wx">${Math.round(m.temp)}° ${wxIcon(m)}</span>` : ""}`;
    if (showWx && m.fltCat && settings.apStyle === "body") c.setStyle({ color: { VFR: "#16A34A", MVFR: "#2563EB", IFR: "#DC2626", LIFR: "#C026D3" }[m.fltCat] || c.options.color });
    if (settings.apStyle !== "body" && (z >= 8 || (big && z >= 6) || (jai && z >= 5))) c.bindTooltip(label, { permanent: true, direction: "right", offset: [6, 0], className: "ap-label" });

}

/* ---------- radar srážek (RainViewer) ---------- */
let radarLayer = null, radarTimer = null;
async function updateRadar() {
  if (!map) return;
  if (radarLayer) { map.removeLayer(radarLayer); radarLayer = null; }
  clearInterval(radarTimer);
  if (!settings.radar) return;
  try {
    const r = await fetch("https://api.rainviewer.com/public/weather-maps.json");
    const d = await r.json();
    const frame = (d.radar?.past || []).slice(-1)[0];
    if (!frame) return;
    radarLayer = L.tileLayer(`${d.host}${frame.path}/256/{z}/{x}/{y}/2/1_1.png`, {
      opacity: 0.6, maxNativeZoom: 7, maxZoom: 19, zIndex: 350,
      attribution: 'Radar &copy; <a href="https://www.rainviewer.com" target="_blank" rel="noopener">RainViewer</a>'
    }).addTo(map);
  } catch { /* radar je jen doplněk */ }
  radarTimer = setInterval(updateRadar, 10 * 60 * 1000);
}

/* ---------- body trasy ---------- */
function drawWaypoints(group, fixes) {
  group.clearLayers();
  if (!settings.waypoints) return;
  for (const f of fixes) {
    if (!f[2]) continue;
    L.circleMarker([f[0], f[1]], { radius: 3.5, weight: 1.5, color: "#64748B", fillColor: "#fff", fillOpacity: 1, renderer: apRenderer })
      .bindTooltip(esc(f[2]), { permanent: true, direction: "right", offset: [5, 0], className: "wp-label" }).addTo(group);
  }
}

/* ---------- počasí (METAR) ---------- */
const metarMissing = new Set(), metarLoading = new Set();
async function ensureMetar(icao, layer) {
  if (metarCache.has(icao) || metarMissing.has(icao) || metarLoading.has(icao) || !/^[A-Z0-9]{4}$/.test(icao)) {
    if (!/^[A-Z0-9]{4}$/.test(icao) && !metarCache.has(icao)) { metarMissing.add(icao); layer.getPopup()?.update(); }
    return;
  }
  metarLoading.add(icao);
  try {
    const r = await fetch(`${CFG.SUPABASE_URL}/functions/v1/metar?ids=${icao}`, { headers: { apikey: CFG.SUPABASE_KEY } });
    const list = r.ok ? await r.json() : [];
    const m = (list || []).find(x => x.icaoId === icao);
    if (m) metarCache.set(icao, m); else metarMissing.add(icao);
  } catch { metarMissing.add(icao); }
  metarLoading.delete(icao);
  layer.getPopup()?.update();
}
function scheduleMetar() {
  clearTimeout(metarTimer);
  metarTimer = setTimeout(loadMetar, 600);
}
async function loadMetar() {
  if (!map || map.getZoom() < 6 || !map.hasLayer(airportLayer)) return;
  const b = map.getBounds();
  const f = (v, up) => (up ? Math.ceil(v * 2) : Math.floor(v * 2)) / 2;
  const bbox = [f(Math.max(-90, b.getSouth()), 0), f(Math.max(-180, b.getWest()), 0), f(Math.min(90, b.getNorth()), 1), f(Math.min(180, b.getEast()), 1)].join(",");
  try {
    const r = await fetch(`${CFG.SUPABASE_URL}/functions/v1/metar?bbox=${bbox}`, { headers: { apikey: CFG.SUPABASE_KEY } });
    if (!r.ok) return;
    const list = await r.json();
    for (const m of list || []) if (m.icaoId) metarCache.set(m.icaoId, m);
    drawAirports();
  } catch { /* počasí je jen doplněk */ }
}

function gcPoints(a, b, n = 48) {
  const r = x => x * Math.PI / 180, d = x => x * 180 / Math.PI;
  const [la1, lo1, la2, lo2] = [r(a[0]), r(a[1]), r(b[0]), r(b[1])];
  const w = 2 * Math.asin(Math.sqrt(Math.sin((la2 - la1) / 2) ** 2 + Math.cos(la1) * Math.cos(la2) * Math.sin((lo2 - lo1) / 2) ** 2));
  if (!w) return [a, b];
  const out = [];
  for (let i = 0; i <= n; i++) {
    const f = i / n, A = Math.sin((1 - f) * w) / Math.sin(w), B = Math.sin(f * w) / Math.sin(w);
    const x = A * Math.cos(la1) * Math.cos(lo1) + B * Math.cos(la2) * Math.cos(lo2);
    const y = A * Math.cos(la1) * Math.sin(lo1) + B * Math.cos(la2) * Math.sin(lo2);
    const z = A * Math.sin(la1) + B * Math.sin(la2);
    out.push([d(Math.atan2(z, Math.hypot(x, y))), d(Math.atan2(y, x))]);
  }
  return out;
}

const apByCode = code => airports.find(a => a[0] === code);
const hm = d => d ? new Date(d).toLocaleTimeString(LOCALE, { hour: "2-digit", minute: "2-digit" }) : "–";
function delayHtml(sched, actual) {
  if (!sched || !actual) return "";
  const m = Math.round((new Date(actual) - new Date(sched)) / 60000);
  if (Math.abs(m) <= 3) return '<span class="dly ok">včas</span>';
  if (m < 0) return `<span class="dly ok">${-m} min dříve</span>`;
  return `<span class="dly ${m > 15 ? "bad" : "warn"}">+${m} min</span>`;
}
const pilotPhotoCache = new Map();
const regKey = r => String(r || "").toUpperCase().replace(/[^A-Z0-9]/g, "");
async function pilotPhoto(userId, keys) {
  if (!userId || !sb) return null;
  if (!pilotPhotoCache.has(userId)) {
    pilotPhotoCache.set(userId, sb.from("pilot_aircraft_photos").select("registration, url").eq("user_id", userId)
      .then(({ data }) => new Map((data || []).map(p => [regKey(p.registration), p.url]))).catch(() => new Map()));
  }
  const m = await pilotPhotoCache.get(userId);
  for (const k of keys) if (k && m.get(regKey(k))) return m.get(regKey(k));
  return null;
}
let ownPhotos = new Map();
async function loadOwnPhotos() {
  if (!sb) return;
  const { data } = await sb.from("aircraft_photos").select("registration, url");
  ownPhotos = new Map((data || []).map(p => [p.registration.toUpperCase().replace(/-/g, ""), p.url]));
}
const ownPhotosReady = new Promise(res => setTimeout(() => loadOwnPhotos().then(res, res), 0));
async function getPhoto(reg) {
  if (!reg) return null;
  const key = reg.toUpperCase();
  await ownPhotosReady;
  const own = ownPhotos.get(key.replace(/-/g, ""));
  if (own) return { src: own, link: "https://crew.jachymair.com", photographer: "Jáchym Air" };
  if (!photoCache.has(key)) {
    const direct = async () => {        // záloha: zeptat se Planespotters přímo z prohlížeče
      for (const v of key.includes("-") ? [key] : [key, key.slice(0, 2) + "-" + key.slice(2), key.slice(0, 1) + "-" + key.slice(1)]) {
        try {
          const r = await fetch(`https://api.planespotters.net/pub/photos/reg/${encodeURIComponent(v)}`);
          const p = r.ok ? (await r.json())?.photos?.[0] : null;
          if (p) return { src: p.thumbnail_large?.src || p.thumbnail?.src, link: p.link, photographer: p.photographer };
        } catch { /* bez CORS nebo offline */ }
      }
      return null;
    };
    photoCache.set(key, fetch(`${CFG.SUPABASE_URL}/functions/v1/metar?reg=${encodeURIComponent(key)}`, { headers: { apikey: CFG.SUPABASE_KEY } })
      .then(r => r.ok ? r.json() : null).then(d => d?.photo || direct()).catch(direct));
  }
  return photoCache.get(key);
}
function photoPlaceholder(ac) {
  return `<div style="text-align:center"><svg width="64" height="64" viewBox="0 0 24 24" fill="currentColor" opacity=".35"><path d="${PLANE}"/></svg>
    <div style="font-size:13px">${esc(ac || "Fotka letadla není k dispozici")}</div></div>`;
}
function loadPhotoInto(reg, ac, userId) {
  const box = $("fpPhoto"); if (!box) return;
  box.dataset.reg = reg || "";
  const typeKey = String(ac || "").toUpperCase().match(/^[A-Z0-9]{2,4}$/)?.[0];
  pilotPhoto(userId, [reg, typeKey]).then(u => u ? { src: u, link: u, photographer: "vlastní fotka pilota" } : getPhoto(reg)).then(async p => {
    if (!p?.src && typeKey) { await ownPhotosReady; const u = ownPhotos.get(typeKey); if (u) p = { src: u, link: "https://crew.jachymair.com", photographer: "Jáchym Air · ilustrační foto typu" }; }
    const b = $("fpPhoto"); if (!b || b.dataset.reg !== (reg || "")) return;
    b.innerHTML = p?.src ? `<img src="${esc(p.src)}" alt="Fotka letadla ${esc(reg)}">
      <a class="credit" href="${esc(p.link || "https://www.planespotters.net")}" target="_blank" rel="noopener">Foto © ${esc(p.photographer || "Planespotters.net")}</a>` : photoPlaceholder(ac);
  });
}

async function openFocus(parts) {
  if (!map) return;
  $("view-map").querySelector(".air-panel").classList.add("detail");
  if (parts[1] === "live") {
    focus = { type: "live", id: parts[2], centered: false };

  if (!f) { $("flightPanel").innerHTML = `<div class="fp-top"><button class="fp-back" id="fpBack">← Zpět</button></div><div class="empty">${fErr ? "Let se nepodařilo načíst: " + esc(fErr.message) : "Let nenalezen. Možná byl smazán."}</div>`; $("fpBack").onclick = closeFocus; return; }
  focus = { type: "flight", id, data: f };
  renderLive();
  redrawFocus(true);
  renderFlightPanel();
}
function redrawFocus(fit) {
  if (!focusLayer || focus?.type !== "flight") return;
  const f = focus.data;
  focusLayer.clearLayers();
  const fixes = Array.isArray(f.plan_fixes) ? f.plan_fixes : [];
  if (fixes.length > 1) {
    L.polyline(fixes.map(x => [x[0], x[1]]), { color: "#66788A", weight: Math.max(2, settings.trail * 0.45), opacity: .7, dashArray: "6 7", interactive: false }).addTo(focusLayer);
    drawWaypoints(L.layerGroup().addTo(focusLayer), fixes);
  }
  const pts = Array.isArray(f.path) ? f.path : [];
  if (pts.length > 1) drawAltTrail(L.layerGroup().addTo(focusLayer), pts, settings.trail + 1, trailRenderer);
  if (f.td_lat != null) L.marker([f.td_lat, f.td_lon], { icon: tdIcon(f.score, true, f.fpm), zIndexOffset: 2000 }).bindPopup(landingCardHtml(f), { maxWidth: 360 }).addTo(focusLayer);
  if (pts.length) L.circleMarker([pts[0][0], pts[0][1]], { radius: 6, color: "#116B26", fillColor: "#fff", fillOpacity: 1, weight: 3 }).bindTooltip("Vzlet " + (f.dep_icao || "")).addTo(focusLayer);
  if (fit) {
    const all = pts.map(p => [p[0], p[1]]).concat(fixes.map(x => [x[0], x[1]]));
    if (all.length > 1) map.fitBounds(L.latLngBounds(all).pad(0.15), { paddingTopLeft: [380, 0] });
    else if (f.td_lat != null) map.setView([f.td_lat, f.td_lon], 13);
  }
}
function closeFocus() {
  stopReplay();
  focus = null;
  if (focusLayer) focusLayer.clearLayers();
  $("view-map").querySelector(".air-panel").classList.remove("detail");

}

    <div class="fp-route">

      <div class="r"><div class="ap">${esc(d.arr || "????")}</div><div class="apn">${esc(arrAp?.[1] || "")}</div>

    o.type = "square"; o.frequency.value = 880; g.gain.value = .06; o.connect(g); g.connect(ctx.destination); o.start();
    setTimeout(() => { o.frequency.value = 660; }, 180); setTimeout(() => { o.stop(); ctx.close(); }, 420); } catch { }
}
// hlas věže: anglická frazeologie přes hlasy Windows (Web Speech API)
const towerSpoken = new Map();

    || vs.find(v => /hazel|george|susan|libby|ryan|sonia/i.test(v.name)) || vs.find(v => /en-GB/i.test(v.lang)) || vs[0] || null;
}
// srozumitelnost: výslovnost, pauzy mezi částmi hlášky jako u skutečné věže
function towerPhrase(text) {

    .replace(/, (wind|runway|hold|go around|continue|stop|vacate|caution|number|cleared|traffic|I say again|expect)/gi, ". $1")

let plannedCache = { list: [], flights: [], live: [], t: 0 };
async function loadPlanned(force) {
  if (!force && Date.now() - plannedCache.t < 120000) return plannedCache;
  const from = new Date(Date.now() - 12 * 3600e3).toISOString(), to = new Date(Date.now() + 31 * 864e5).toISOString();
  const { data: list, error } = await sb.from("planned_flights").select("*, profiles(username)").gte("sta", from).lte("std", to).order("std").limit(500);
  if (error) { plannedCache = { list: [], flights: [], live: [], t: Date.now(), error: error.message }; return plannedCache; }
  const ids = [...new Set((list || []).map(p => p.user_id))];
  let flights = [], live = [];
  if (ids.length) {
    const [f, l] = await Promise.all([
      sb.from("flights").select("user_id, dep_icao, arr_icao, takeoff_at, landed_at").in("user_id", ids).gte("landed_at", from),
      sb.from("live").select("user_id, dep_icao, takeoff_at, phase, updated_at, plan_arr:plan->>arr").in("user_id", ids).gte("updated_at", new Date(Date.now() - 180000).toISOString())]);
    flights = f.data || []; live = l.data || [];
  }
  plannedCache = { list: list || [], flights, live, t: Date.now() };
  return plannedCache;
}
// stav letu jako na Flightradaru: plánováno / brzy odlet / zpožděno / ve vzduchu / přistál / zrušeno
function planStatus(p, c = plannedCache) {
  const std = new Date(p.std).getTime(), sta = new Date(p.sta).getTime(), now = Date.now();
  if (p.cancelled) return { key: "cancel", txt: "Zrušeno", cls: "no" };
  const f = c.flights.find(x => x.user_id === p.user_id && x.arr_icao === p.arr && (!x.dep_icao || x.dep_icao === p.dep)
    && new Date(x.landed_at).getTime() >= std - 3 * 3600e3 && new Date(x.landed_at).getTime() <= sta + 8 * 3600e3);
  if (f) { const late = Math.round((new Date(f.landed_at).getTime() - sta) / 60000); return { key: "landed", txt: `Přistál ${hm(f.landed_at)}`, cls: late > 15 ? "wait" : "ok", atd: f.takeoff_at, ata: f.landed_at, late }; }
  const l = c.live.find(x => x.user_id === p.user_id && (x.dep_icao === p.dep || x.plan_arr === p.arr) && now >= std - 3 * 3600e3);
  if (l) {
    if (l.takeoff_at) { const eta = new Date(new Date(l.takeoff_at).getTime() + (sta - std)); return { key: "air", txt: `Ve vzduchu · přílet ${hm(eta)}`, cls: "ok", atd: l.takeoff_at, eta }; }
    return { key: "board", txt: "Připravuje se k odletu", cls: "wait" };
  }
  if (now > sta + 2 * 3600e3) return { key: "none", txt: "Neuskutečněno", cls: "" };
  if (now > std + 15 * 60000) return { key: "delayed", txt: `Zpožděno · odhad ${hm(now + 10 * 60000)}`, cls: "no" };
  if (now > std - 30 * 60000) return { key: "soon", txt: "Brzy odlet", cls: "wait" };
  return { key: "sched", txt: "Plánováno", cls: "" };
}

function badgeStats(fl) {
  const ok = fl.filter(f => !f.incomplete);
  const pragueHour = d => +new Intl.DateTimeFormat("en-GB", { timeZone: "Europe/Prague", hour: "2-digit", hour12: false }).format(new Date(d));
  const days = [...new Set(ok.map(f => pragueDay(new Date(f.landed_at))))].sort();
  let streak = 0, run = 0, prev = null;
  for (const d of days) { const t = new Date(d + "T12:00:00Z").getTime(); run = prev && t - prev === 864e5 ? run + 1 : 1; streak = Math.max(streak, run); prev = t; }
  const aps = new Set(ok.flatMap(f => [f.dep_icao, f.arr_icao]).filter(Boolean));
  return { flights: ok.length, hours: ok.reduce((a, f) => a + (f.duration_min || 0), 0) / 60, butter: ok.filter(f => f.score >= 9.5).length,
    night: ok.filter(f => { const h = pragueHour(f.landed_at); return h >= 0 && h < 5; }).length, airports: aps.size,
    hubs: MINIHUBS.filter(h => ok.some(f => f.arr_icao === h)).length, rotation: ok.filter(f => f.rotation_id).length,
    punctual: ok.filter(f => f.rotation_id && f.delay_min != null && f.delay_min >= -10 && f.delay_min <= 30).length,
    long: ok.filter(f => (f.duration_min || 0) >= 300).length, streak, hard: ok.filter(f => f.fpm != null && f.fpm <= -900).length };
}

/* ---------- přehrání letu ---------- */
let replay = null;
function stopReplay() {
  if (!replay) return;
  cancelAnimationFrame(replay.raf);
  replay.layer?.remove(); replay.bar?.remove();
  replay = null;
}
function startReplay(f) {
  stopReplay();
  const pts = (Array.isArray(f.path) ? f.path : []).filter(p => p && p[0] && p[1]);
  if (pts.length < 3) return;
  // čas bodu: nové lety mají sekundy od začátku, u starších se dopočítá podle vzdálenosti
  const timed = pts.filter(p => p.length >= 4).length > pts.length * .8;
  let times;
  if (timed) { times = pts.map((p, i) => p[3] ?? 0); for (let i = 1; i < times.length; i++) if (times[i] < times[i - 1]) times[i] = times[i - 1]; }
  else {
    const d = [0]; for (let i = 1; i < pts.length; i++) d.push(d[i - 1] + map.distance([pts[i - 1][0], pts[i - 1][1]], [pts[i][0], pts[i][1]]));
    const total = (f.duration_min || d[d.length - 1] / 1852 / 380 * 60) * 60; times = d.map(x => x / (d[d.length - 1] || 1) * total);
  }
  const T = times[times.length - 1] || 1;
  const layer = L.layerGroup().addTo(map);
  const done = L.polyline([], { color: "#F59E0B", weight: settings.trail + 2, opacity: .95, interactive: false }).addTo(layer);
  const icon = deg => L.divIcon({ className: "", iconSize: [34, 34], iconAnchor: [17, 17], html: `<div style="transform:rotate(${deg}deg);width:34px;height:34px">${planeIcon(0, f.va === "JAI", true).options.html}</div>` });
  const mk = L.marker([pts[0][0], pts[0][1]], { icon: icon(0), zIndexOffset: 3000, interactive: false }).addTo(layer);
  const bar = document.createElement("div"); bar.className = "replay-bar";
  bar.innerHTML = `<button id="rpPlay" aria-label="Přehrát">⏸</button><input type="range" id="rpPos" min="0" max="1000" value="0" aria-label="Pozice">
    <select id="rpSpeed" aria-label="Rychlost">${[10, 30, 60, 120, 300].map(x => `<option value="${x}" ${x === 60 ? "selected" : ""}>${x}×</option>`).join("")}</select>
    <span id="rpHud" class="rp-hud"></span><button id="rpClose" aria-label="Zavřít">✕</button>`;
  $("view-map").appendChild(bar);
  replay = { raf: 0, layer, bar, t: 0, playing: true, last: performance.now() };
  const hdgBetween = (a, b) => { const y = Math.sin((b[1] - a[1]) * Math.PI / 180) * Math.cos(b[0] * Math.PI / 180), x = Math.cos(a[0] * Math.PI / 180) * Math.sin(b[0] * Math.PI / 180) - Math.sin(a[0] * Math.PI / 180) * Math.cos(b[0] * Math.PI / 180) * Math.cos((b[1] - a[1]) * Math.PI / 180); return (Math.atan2(y, x) * 180 / Math.PI + 360) % 360; };
  let lastHdg = 0, idx = 0;
  const draw = () => {
    while (idx < times.length - 2 && times[idx + 1] < replay.t) idx++;
    while (idx > 0 && times[idx] > replay.t) idx--;
    const a = pts[idx], b = pts[Math.min(idx + 1, pts.length - 1)], span = (times[idx + 1] - times[idx]) || 1;
    const k = Math.max(0, Math.min(1, (replay.t - times[idx]) / span));
    const lat = a[0] + (b[0] - a[0]) * k, lon = a[1] + (b[1] - a[1]) * k, alt = Math.round((a[2] || 0) + ((b[2] || 0) - (a[2] || 0)) * k);
    if (map.distance([a[0], a[1]], [b[0], b[1]]) > 30) lastHdg = hdgBetween(a, b);
    mk.setLatLng([lat, lon]); mk.setIcon(icon(lastHdg));
    done.setLatLngs(pts.slice(0, idx + 1).map(p => [p[0], p[1]]).concat([[lat, lon]]));
    const gs = timed && a[4] != null ? Math.round((a[4] || 0) + ((b[4] ?? a[4]) - (a[4] || 0)) * k) : null;
    const tt = Math.round(replay.t), hh = Math.floor(tt / 3600), mm = Math.floor(tt % 3600 / 60), ss = tt % 60;
    $("rpHud").textContent = `${hh}:${String(mm).padStart(2, "0")}:${String(ss).padStart(2, "0")} · ${alt > 0 ? nf.format(alt) + " ft" : tr("Na zemi")}${gs != null ? ` · ${gs} kt` : ""}`;
    $("rpPos").value = Math.round(replay.t / T * 1000);
    if (replay.follow !== false && !map.getBounds().pad(-0.2).contains([lat, lon])) map.panTo([lat, lon], { animate: false });
  };
  const loop = now => {
    if (!replay) return;
    const dt = (now - replay.last) / 1000; replay.last = now;
    if (replay.playing) { replay.t = Math.min(T, replay.t + dt * Number($("rpSpeed").value)); if (replay.t >= T) { replay.playing = false; $("rpPlay").textContent = "▶"; } }
    draw(); replay.raf = requestAnimationFrame(loop);
  };
  $("rpPlay").onclick = () => { if (replay.t >= T) replay.t = 0; replay.playing = !replay.playing; $("rpPlay").textContent = replay.playing ? "⏸" : "▶"; };
  $("rpPos").oninput = e => { replay.t = Number(e.target.value) / 1000 * T; idx = 0; draw(); };
  $("rpClose").onclick = stopReplay;
  map.on("dragstart", () => { if (replay) replay.follow = false; });
  map.setView([pts[0][0], pts[0][1]], Math.max(map.getZoom(), 9));
  replay.raf = requestAnimationFrame(loop);
}

const photoListCache = new Map();
async function renderFlightPhotos(el, f, live = false) {

    const { data } = live ? await q.eq("user_id", f.user_id).is("flight_id", null) : await q.eq("flight_id", f.id);

    + (own && list.length < 12 ? `<label class="link-btn" style="cursor:pointer;display:inline-block;margin-top:8px">📷 Přidat fotky<input type="file" id="fpAdd" accept="image/png,image/jpeg,image/webp" multiple style="display:none"></label>` : "");
  el.querySelectorAll("[data-lb]").forEach(a => a.onclick = e => { if (e.target.closest("[data-delfp]")) return; e.preventDefault(); lightbox(a.dataset.lb, +a.dataset.pid); });
  el.querySelectorAll("[data-delfp]").forEach(b => b.onclick = async e => {
    e.preventDefault(); e.stopPropagation();
    if (!confirm("Smazat fotku?")) return;
    await sb.from("flight_photos").delete().eq("id", +b.dataset.delfp); photoListCache.delete(key); renderFlightPhotos(el, f, live);

    }
    photoListCache.delete(key); renderFlightPhotos(el, f, live);
  };
}

/* ---------- novinky, let týdne, YouTube ---------- */
let eventsCache = null, eventsAt = 0, weekLayer = null;
async function loadEvents(force) {
  if (!force && eventsCache && Date.now() - eventsAt < 60000) return eventsCache;
  const { data, error } = await sb.from("events").select("*").order("starts_at", { ascending: false, nullsFirst: false }).limit(200);
  if (error) return eventsCache || [];
  eventsCache = data || []; eventsAt = Date.now();
  return eventsCache;
}
const KIND_TXT = { let_tydne: "Let týdne", youtube: "YouTube event", novinka: "Novinka" };
const isNow = e => (!e.starts_at || new Date(e.starts_at) <= new Date()) && (!e.ends_at || new Date(e.ends_at) >= new Date());
const ytEnd = e => e.ends_at ? new Date(e.ends_at) : new Date(new Date(e.starts_at || 0).getTime() + 3 * 3600e3);
function currentWeekFlight(list) {
  return list.filter(e => e.kind === "let_tydne" && isNow(e)).sort((a, b) => (b.pinned - a.pinned) || (new Date(b.starts_at) - new Date(a.starts_at)))[0] || null;
}
function nextYoutube(list) {
  return list.filter(e => e.kind === "youtube" && e.starts_at && ytEnd(e) >= new Date()).sort((a, b) => new Date(a.starts_at) - new Date(b.starts_at))[0] || null;
}
function relTime(d) {
  const ms = new Date(d) - Date.now(), past = ms < 0, m = Math.round(Math.abs(ms) / 60000);
  let t;
  if (m < 60) t = `${m} min`;
  else if (m < 48 * 60) { const h = Math.floor(m / 60); t = `${h} h${m % 60 && h < 10 ? ` ${m % 60} min` : ""}`; }
  else { const dd = Math.round(m / 1440); t = LANG === "en" ? `${dd} days` : `${dd} ${dd < 5 ? "dny" : "dní"}`; }
  if (LANG === "en") return past ? `${t} ago` : `in ${t}`;
  return past ? `před ${t}` : `za ${t}`;
}
const fmtDT = d => d ? new Date(d).toLocaleString(LOCALE, { weekday: "short", day: "numeric", month: "numeric", hour: "2-digit", minute: "2-digit" }) : "";
function ytId(url) {
  const m = String(url || "").match(/(?:youtu\.be\/|v=|\/live\/|\/embed\/|\/shorts\/)([A-Za-z0-9_-]{11})/);
  return m ? m[1] : null;
}
function richText(t) {
  return esc(t || "").replace(/(https:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>').replace(/\n/g, "<br>");
}
function ytLive(e) { return e.starts_at && new Date(e.starts_at) <= new Date() && ytEnd(e) >= new Date(); }

async function renderHighlights() {
  if (!sb) return;
  const list = await loadEvents();
  const w = currentWeekFlight(list), y = nextYoutube(list);
  $("highlights").innerHTML = (HALLOWEEN ? `<div class="hl-card boo" style="padding:8px 12px"><span class="hl-ic" style="width:30px;height:30px;font-size:16px">🎃</span><b style="font-size:15px">Šťastný Halloween, piloti! 🦇</b></div>` : "") + (w ? `<a class="hl-card" href="#/novinky/${w.id}"><span class="hl-ic">★</span><div><div class="hl-k">Let týdne · končí ${relTime(w.ends_at || Date.now())}</div>
      <div class="hl-t">${w.dep && w.arr ? `${esc(w.dep)} → ${esc(w.arr)}` : esc(w.title)}</div><div class="hl-s">${esc(w.aircraft || w.title)}</div></div></a>` : "")
    + (y ? `<a class="hl-card yt" href="#/novinky/${y.id}"><span class="hl-ic">▶</span><div><div class="hl-k">${ytLive(y) ? "Živě teď na YouTube" : "YouTube " + relTime(y.starts_at)}</div>
      <div class="hl-t">${esc(y.title)}</div><div class="hl-s">${fmtDT(y.starts_at)}</div></div></a>` : "");
  drawWeekRoute(w);

function drawWeekRoute(w) {
  if (!map) return;
  if (!weekLayer) weekLayer = L.layerGroup().addTo(map);
  weekLayer.clearLayers();
  const a = w && apByCode(w.dep), b = w && apByCode(w.arr);

  for (const ap of [a, b]) L.circleMarker([ap[2], ap[3]], { radius: 7, color: "#F59E0B", weight: 3, fillColor: "#fff", fillOpacity: 1 })
    .bindTooltip(`★ Let týdne · ${esc(ap[0])}`, { direction: "top" }).on("click", () => { location.hash = "#/novinky/" + w.id; }).addTo(weekLayer);
}

async function weekLeaderboard(e) {
  let q = sb.from("flights").select("id, user_id, callsign, aircraft, ac_icao, fpm, g, score, landed_at, duration_min, profiles!flights_user_id_fkey(username, avatar_url)")
    .eq("dep_icao", e.dep).eq("arr_icao", e.arr).not("score", "is", null).order("score", { ascending: false }).limit(300);
  if (e.starts_at) q = q.gte("landed_at", e.starts_at);
  if (e.ends_at) q = q.lte("landed_at", e.ends_at);
  const { data } = await q;
  const want = (e.aircraft || "").toUpperCase().trim();
  const best = new Map();
  for (const f of data || []) {
    if (want && !((f.ac_icao || "").toUpperCase() === want || (f.aircraft || "").toUpperCase().includes(want))) continue;
    if (!best.has(f.user_id)) best.set(f.user_id, f);
  }
  return [...best.values()];
}

async function renderNews(idParam) {
  const el = $("novinky");
  el.innerHTML = '<p class="muted">Načítám…</p>';
  const [list] = await Promise.all([loadEvents(true), airportsReady]);
  const sel = idParam ? list.find(e => String(e.id) === idParam) : null;
  const w = sel?.kind === "let_tydne" ? sel : (!sel ? currentWeekFlight(list) : null);
  let html = `<h1 class="page-title">Novinky</h1><p class="lead">Let týdne, YouTube eventy a novinky z Jáchym Air.</p>`;
  if (w) html += await weekBlock(w);
  if (sel && sel.kind !== "let_tydne") html += `<div style="margin-bottom:24px">${eventCard(sel, true)}</div>`;
  const others = list.filter(e => e !== w && e !== sel);

function shrinkImage(file, maxW) {
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => { const k = Math.min(1, maxW / img.width), c = document.createElement("canvas");
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      c.toBlob(b => b ? res(b) : rej(new Error("obrázek nejde zpracovat")), "image/jpeg", 0.85); };
    img.onerror = () => rej(new Error("tohle není obrázek")); img.src = url;
  });
}

    .formatToParts(date).map(x => [x.type, x.value]));
  return (Date.UTC(+p.year, +p.month - 1, +p.day, +p.hour, +p.minute) - date.getTime()) / 60000;
}
function pragueToUtc(day, minutes) {

  let t = base;
  for (let i = 0; i < 2; i++) t = base - tzOffsetMin(new Date(t)) * 60000;
  return new Date(t);
}

const hmPrague = d => new Date(d).toLocaleTimeString(LOCALE, { timeZone: "Europe/Prague", hour: "2-digit", minute: "2-digit" });

function parseHM(str) { const m = String(str || "").match(/(\d{1,2})\s*[:.h]?\s*(\d{2})/); if (!m) return null; const h = +m[1], mi = +m[2]; return h < 24 && mi < 60 ? h * 60 + mi : null; }

function rotCard(r) {

      ${fd?.training_only ? '<span class="va-chip">výcvik palubní posádky</span>' : ""}${r.reg && oosAt(r.reg, r.std) ? '<span class="va-chip" style="background:#FEE2E2;color:#991B1B">letadlo v údržbě</span>' : ""}${(fleetStatus?.df.get(r.reg) || []).length ? `<span class="va-chip">${fleetStatus.df.get(r.reg).length}× MEL</span>` : ""}${legs[0]?.ferry_from ? `<span class="va-chip">letadlo přistaveno z ${esc(legs[0].ferry_from)}</span>` : ""}<span>${legs.length} ${legs.length === 1 ? "let" : legs.length < 5 ? "lety" : "letů"}</span>
      ${(() => { const nd = new Set(legs.map(l => pragueDay(new Date(l.std)))).size; const stops = legs.filter(l => l.night_before).map(l => l.night_before);
        return nd > 1 ? `<span class="va-chip">${nd} ${nd < 5 ? "dny" : "dní"}${stops.length ? " · přespání v " + stops.map(esc).join(", ") : ""}</span>` : `<span>${fmtDur(block)} h</span>`; })()}</div>
      <div class="rot-legs">${legs.map((l, li) => `<div class="rot-leg"><b>${rotFlown.get(r.id)?.has(li) ? `<span title="Odletěno, ${rotFlown.get(r.id).get(li)} bodů">✅</span> ` : ""}<a href="#/linka/${encodeURIComponent(l.route_id)}">${esc(l.flight_no)}</a></b>
        <span>${pragueDay(new Date(l.std)) !== r.service_day ? `<span class="muted" style="font-size:13px">${dayLabel(pragueDay(new Date(l.std)))} </span>` : ""}${esc(l.dep)} <b>${hmPrague(l.std)}</b> → ${esc(l.arr)} <b>${hmPrague(l.sta)}</b>${l.load_factor != null ? ` <span class="muted" style="font-size:13px">· obs. ~${Math.round(l.load_factor)} %</span>` : ""}</span></div>`).join("")}</div></div>
    <div class="rot-side"><a class="btn ghost" href="#/briefing/${r.id}" style="padding:7px 14px">Briefing</a>${r.status === "open" ? (me ? `<button class="btn" data-take="${r.id}">Vzít rotaci</button>` : "")

      : `<span class="muted" style="font-size:13px">Letí ${esc(r.profiles?.username || "někdo")}</span>`}</div></div>`;
}

function bindRotButtons(root) {

  });
}

let fleetStatus = null;
async function loadFleetStatus() {
  const [{ data: st }, { data: df }] = await Promise.all([
    sb.from("aircraft_status").select("*"),
    sb.from("aircraft_defects").select("*").is("cleared_at", null).gt("due_at", new Date().toISOString()).order("opened_at"),
  ]);
  fleetStatus = { st: new Map((st || []).map(x => [x.registration, x])), df: new Map() };
  (df || []).forEach(d => { if (!fleetStatus.df.has(d.registration)) fleetStatus.df.set(d.registration, []); fleetStatus.df.get(d.registration).push(d); });
  return fleetStatus;
}
const CHECK_HOURS = 80;
const MEL_TXT = { A: "kat. A", B: "kat. B", C: "kat. C", D: "kat. D" };
function oosAt(reg, atIso) { const st = fleetStatus?.st.get(reg); return st?.oos_until && new Date(st.oos_until) > new Date(atIso) ? st : null; }
function statusHtml(reg, compact) {
  const st = fleetStatus?.st.get(reg), df = fleetStatus?.df.get(reg) || [];
  if (!st) return compact ? "" : '<p class="muted" style="font-size:13px">Stav letadla zatím není znám.</p>';
  const cond = Math.round(100 - (st.wear || 0)), left = Math.max(0, Math.round(CHECK_HOURS - (st.hours_since_check || 0)));
  const oos = st.oos_until && new Date(st.oos_until) > new Date();
  const bar = `<div style="height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin:4px 0 6px"><div style="height:100%;width:${cond}%;background:${cond > 70 ? "var(--green)" : cond > 40 ? "#EAB308" : "#DC2626"}"></div></div>`;
  return `${oos ? `<div class="msg err" style="margin:0 0 8px">Mimo provoz do ${new Date(st.oos_until).toLocaleString(LOCALE, { timeZone: "Europe/Prague", weekday: "short", hour: "2-digit", minute: "2-digit" })}: ${esc(st.oos_reason || "údržba")}</div>` : ""}
    <div style="font-size:14px">Technický stav <b>${cond} %</b> · do A-check <b>${left} h</b></div>${bar}
    ${df.length ? `<div style="font-size:14px"><b>Odložené závady:</b><ul style="margin:4px 0 0;padding-left:18px">${df.map(d => `<li><b>${esc(d.title)}</b> <span class="muted" style="font-size:12px">(${MEL_TXT[d.category] || ""}, do ${new Date(d.due_at).toLocaleDateString(LOCALE)})</span>${!compact && d.effect ? `<br><span class="muted" style="font-size:13px">${esc(d.effect)}</span>` : ""}</li>`).join("")}</ul></div>`
      : '<div class="muted" style="font-size:13px">Bez odložených závad.</div>'}`;
}

function crewPerson(rnd, base, gender) {
  const mix = CREW_MIX[base] || CREW_MIX.DAAG, total = Object.values(mix).reduce((a, b) => a + b, 0);
  let x = rnd() * total, nat = "rare";
  for (const [k, w] of Object.entries(mix)) { if ((x -= w) < 0) { nat = k; break; } }
  const N = NAMES[nat], g = gender || (rnd() < 0.5 ? "m" : "f");
  const first = N[g][Math.floor(rnd() * N[g].length)], sur = N.s[Math.floor(rnd() * N.s.length)];
  return { name: `${first} ${Array.isArray(sur) ? sur[g === "f" ? 1 : 0] : sur}`, nat, g };
}

const CAREER_RANKS = [
  { code: "FO", name: "First Officer", h: 0, p: 0, base: 3200, rate: 45 },
  { code: "SFO", name: "Senior First Officer", h: 25, p: 1500, base: 4200, rate: 50 },
  { code: "CPT", name: "Kapitán", h: 75, p: 5000, land: 6.5, base: 6800, rate: 60 },
  { code: "SCPT", name: "Senior kapitán", h: 200, p: 15000, land: 7, base: 8200, rate: 65 },
  { code: "TRI", name: "Training kapitán", h: 400, p: 30000, land: 7, punct: 80, base: 9600, rate: 70 },
];
const isCaptain = r => ["CPT", "SCPT", "TRI"].includes(r.code);
function rankFor(c) {
  let cur = CAREER_RANKS[0];
  for (const r of CAREER_RANKS) if (c.hours >= r.h && c.points >= r.p && (!r.land || (c.avgLanding ?? 0) >= r.land) && (!r.punct || (c.punct ?? 0) >= r.punct)) cur = r;
  const next = CAREER_RANKS[CAREER_RANKS.indexOf(cur) + 1] || null;
  return { cur, next };
}
async function careerOf(userId) {
  const since = new Date(Date.now() - 30 * 864e5).toISOString();
  const [{ data: st }, { data: c }, { data: fl }, { data: raises }] = await Promise.all([
    sb.from("pilot_stats").select("*").eq("id", userId).maybeSingle(),
    sb.from("pilot_career").select("*").eq("user_id", userId).maybeSingle(),
    sb.from("flights").select("duration_min").eq("user_id", userId).gte("landed_at", since),
    sb.from("salary_raises").select("*").eq("user_id", userId).order("created_at", { ascending: false }),
  ]);
  const data = { hours: (st?.minutes || 0) / 60, points: c?.points || 0, points30: c?.points_30d || 0, avgLanding: st?.avg_score,
    punct: c?.rotation_legs ? Math.round(c.on_time_legs / c.rotation_legs * 100) : null, sat: c?.avg_pax_sat, rotations: c?.rotations_done || 0,
    hours30: (fl || []).reduce((a, f) => a + (f.duration_min || 0), 0) / 60, raises: raises || [] };
  data.rank = rankFor(data);
  const raisePct = data.raises.reduce((a, r) => a + Number(r.pct || 0), 0);
  const r = data.rank.cur;
  data.salary = { base: Math.round(r.base * (1 + raisePct / 100)), flying: Math.round(data.hours30 * r.rate), bonus: Math.round(data.points30 * 0.5), raisePct };
  data.salary.total = data.salary.base + data.salary.flying + data.salary.bonus;
  return data;
}
const eur = n => nf.format(n) + " €";
function careerCardHtml(c, own) {
  const { cur, next } = c.rank;
  const prog = next ? Math.min(100, Math.round(Math.min(c.hours / Math.max(1, next.h), c.points / Math.max(1, next.p)) * 100)) : 100;
  const need = next ? [c.hours < next.h ? `${Math.ceil(next.h - c.hours)} h letu` : null, c.points < next.p ? `${nf.format(next.p - c.points)} bodů` : null,

  const last = c.raises[0];

  return `<div class="card"><h2 class="section-title">Moje kariéra</h2>

      <dt>Základní plat</dt><dd>${eur(c.salary.base)}${c.salary.raisePct ? ` <span class="muted">(+${fmt1(c.salary.raisePct)} %)</span>` : ""}</dd>

      <dt><b>Celkem</b></dt><dd><b>${eur(c.salary.total)}</b></dd></dl>
      <p class="muted" style="font-size:12px;margin:6px 0 10px">Plat je jen pro zábavu, skutečné peníze to nejsou 😄</p>
      ${last ? `<div class="msg ${Number(last.pct) > 0 ? "ok" : "err"}" style="margin:0 0 10px"><b>Personální oddělení, ${new Date(last.created_at).toLocaleDateString(LOCALE)}:</b> ${esc(last.message || "")}</div>` : ""}
      <button class="btn ghost" id="raiseBtn" ${canAsk ? "" : "disabled"}>${canAsk ? "Požádat o zvýšení platu" : `Další žádost od ${new Date(new Date(last.created_at).getTime() + 30 * 864e5).toLocaleDateString(LOCALE)}`}</button>` : ""}</div>`;
}

let fleetCache = null;

const TYPE_ALIASES = {
  A319: ["A319"], A320: ["A320", "A20N", "A320NEO"], A321: ["A321", "A21N", "A321NEO"],
  A359: ["A359", "A350", "A350900"], A35K: ["A35K", "A3501000"], A332: ["A332", "A330200"], A333: ["A333", "A330300"],
  B738: ["B738", "B737800", "7378", "737800"], B38M: ["B38M", "B737MAX8", "737MAX8", "MAX8", "7M8", "B7378MAX"],
  B739: ["B739", "B737900"], B39M: ["B39M", "B737MAX9", "MAX9"], B789: ["B789", "B787900", "7879"], B788: ["B788", "B787800"],

    return al.some(x => a === x || (a.length >= 4 && (a.includes(x) || x.includes(a))) || b.includes(x)); });
}

async function exportForManagement() {
  await Promise.all([routesReady, airportsReady, basesReady]);
  const fleet = await loadFleetDetails();
  const icaos = new Set([...jaiRoutes.flatMap(r => [r.dep, r.arr]), ...basesList.map(b => b.icao)]);
  const aps = {};
  for (const i of icaos) { const a = apByCode(i); if (a) aps[i] = [a[2], a[3], a[1]]; }
  const data = { exported: new Date().toISOString(), routes: jaiRoutes.map(r => ({ id: r.id, flight_no: fltNo(r), dep: r.dep, arr: r.arr, dpt_time: r.dpt_time, arr_time: r.arr_time,
    flight_time_min: r.flight_time_min, load_factor: r.load_factor, days: r.days, subfleets: r.subfleets })), fleet, bases: basesList.map(b => b.icao), airports: aps,
    // všechna velká a střední letiště v Evropě, Africe a na Blízkém východě (pro návrhy minihubů a nových linek)
    allAirports: airports.filter(a => /^[ELDGHO][A-Z]{3}$/.test(a[0])).map(a => [a[0], Math.round(a[2] * 1000) / 1000, Math.round(a[3] * 1000) / 1000, String(a[1]).slice(0, 40), a[4]]) };
  const blob = new Blob([JSON.stringify(data)], { type: "application/json" });
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "jai-management-export.json"; document.body.appendChild(a); a.click(); a.remove();
}

        <div class="field"><label for="pVa">Moje virtuálka</label><select id="pVa"><option value="">Žádná</option>${vaList.filter(v => v.code !== "JAI").map(v => `<option value="${esc(v.code)}" ${p.va_default === v.code ? "selected" : ""}>${esc(v.name)}</option>`).join("")}</select>
          <small>Zobrazí se u tvých letů. Jáchym Air se zapíná sám u rezervovaných linek.</small></div>
        <div class="field"><label for="pSb">Uživatelské jméno v SimBriefu (nepovinné)</label><input id="pSb" value="${esc(p.simbrief_user || "")}" maxlength="40" placeholder="např. jachym12"><small>Aplikace podle něj načte tvůj letový plán.</small></div>
        <button class="btn">Uložit profil</button>
        <a class="btn ghost" href="#/pilot/${encodeURIComponent(p.username || "")}" style="margin-left:8px">Zobrazit profil</a>
      </form>
      <div class="card">
        <h2 class="section-title">Aplikace pro Windows</h2>
        ${appApi ? '<p><b>Právě ji používáš ✔</b> Stav trackeru najdeš v záložce <a href="#/tracker">Tracker</a>.</p>' : ""}
        <p>Aplikace běží na tvém PC vedle MSFS, posílá tvoji polohu na mapu a po přistání uloží let. Aktualizuje se sama.</p>
        <p><a class="btn" href="${esc(trackerDownloadUrl())}">Stáhnout aplikaci</a></p>
        <p class="muted">Spusť <b>JachymAirTracker.exe</b> a přihlas se stejným e-mailem a heslem jako tady. Když Windows ukáže modré okno „Systém Windows ochránil váš počítač“, klikni na <b>Další informace</b> a pak <b>Přesto spustit</b>.</p>
        <button class="btn ghost" id="logout">Odhlásit se</button>
      </div>
      <div class="card" id="crewCard"><h2 class="section-title">Crew center Jáchym Air</h2><p class="muted">Načítám…</p></div>
      <div class="card"><h2 class="section-title">Moje data</h2>
        <p class="muted" style="margin-top:0">Stáhni si kopii všeho, co o tobě JAI Tracker ukládá: profil, lety, přátele, zprávy a reakce (soubor JSON).</p>
        <button class="btn ghost" id="exportBtn">Stáhnout moje data</button>
        <p style="margin:14px 0 0;font-size:14px"><a href="#/soukromi">Ochrana osobních údajů</a> · <a href="#/pravidla">Pravidla komunity</a></p></div>
      <div class="card" id="delCard"><h2 class="section-title">Smazání účtu</h2>
        <p class="muted" style="margin-top:0">Smaže se tvůj účet, profil, všechny lety, přátelé, zprávy a reakce. Nejde to vrátit.</p>
        <div class="field"><label for="delConfirm">Pro potvrzení napiš své uživatelské jméno</label><input id="delConfirm" autocomplete="off"></div>
        <button class="btn" id="delBtn" style="background:var(--danger)">Smazat účet natrvalo</button></div>
      <form class="card" id="pwForm"><h2 class="section-title">Změna hesla</h2>
        <div class="field"><label for="pwNew">Nové heslo</label><input id="pwNew" type="password" minlength="8" required autocomplete="new-password"><small>Aspoň 8 znaků</small></div>
        <button class="btn">Změnit heslo</button></form>
    </div>`;
  renderCrewCard();
  $("exportBtn").onclick = async e => {
    e.target.disabled = true; e.target.textContent = "Připravuji…";
    const uid = me.user.id;
    const q = (t, sel, f) => f(sb.from(t).select(sel)).then(r => r.data || []);
    const [profile, flights, friendships, messages, reactions, photos] = await Promise.all([
      q("profiles", "*", x => x.eq("id", uid)), q("flights", "*", x => x.eq("user_id", uid).order("landed_at")),
      q("friendships", "*", x => x), q("messages", "*", x => x.order("created_at")),
      q("flight_reactions", "*", x => x.eq("user_id", uid)), q("pilot_aircraft_photos", "*", x => x.eq("user_id", uid)),
    ]);
    const data = { exportovano: new Date().toISOString(), email: me.user.email, profil: profile[0] || null, lety: flights, pratelstvi: friendships, zpravy: messages, reakce: reactions, fotky_letadel: photos };
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = `jai-tracker-data-${me.profile?.username || "pilot"}.json`;
    document.body.appendChild(a); a.click(); a.remove();
    e.target.disabled = false; e.target.textContent = "Stáhnout moje data";
  };
  $("delBtn").onclick = async () => {
    if ($("delConfirm").value.trim() !== (me.profile?.username || "")) { renderAccount({ ok: false, text: "Pro smazání napiš přesně své uživatelské jméno." }); return; }
    if (!confirm("Opravdu smazat účet a všechna data? Tohle nejde vrátit.")) return;
    $("delBtn").disabled = true; $("delBtn").textContent = "Mažu…";
    const { data, error } = await sb.functions.invoke("delete-account", { body: {} });
    if (!data?.ok) { let msg = data?.msg; if (error && !msg) { try { msg = (await error.context.json()).msg; } catch { msg = error.message; } }
      renderAccount({ ok: false, text: "Účet se nepodařilo smazat: " + (msg || "neznámá chyba") }); return; }
    if (appApi) appApi.logout();
    await sb.auth.signOut(); me = null; updateNav(); updateBadges();
    renderAccount({ ok: true, text: "Účet byl smazán. Díky, že jsi s námi létal." });
  };
  $("pwForm").onsubmit = async e => {
    e.preventDefault();
    const { error } = await sb.auth.updateUser({ password: $("pwNew").value });
    renderAccount(error ? { ok: false, text: error.message } : { ok: true, text: "Heslo změněno." });
  };
  $("logout").onclick = async () => { await sb.auth.signOut(); me = null; updateNav(); renderAccount(); };
  $("profileForm").onsubmit = onProfileSubmit;
}

async function renderCrewCard(msg) {
  const box = $("crewCard"); if (!box || !me) return;
  const { data: row } = await sb.from("jai_members").select("pilot_ident, pilot_name").eq("user_id", me.user.id).maybeSingle();
  const m = msg ? `<div class="msg ${msg.ok ? "ok" : "err"}">${esc(msg.text)}</div>` : "";
  if (row) {
    box.innerHTML = `<h2 class="section-title">Crew center Jáchym Air</h2>${m}
      <p><span class="badge">Pilot Jáchym Air</span> ${row.pilot_ident ? `<b>${esc(row.pilot_ident)}</b>` : ""} ${row.pilot_name ? esc(row.pilot_name) : ""}</p>
      <p class="muted">Tvoje letadlo svítí na mapě zeleně. ${appApi ? "Odesílání letů do crew centra nastavíš v záložce Tracker." : "Aby se lety samy odesílaly i do crew centra, vlož klíč také do aplikace (záložka Tracker)."}</p>`;
    return;
  }
  box.innerHTML = `<h2 class="section-title">Crew center Jáchym Air</h2>${m}
    <p>Jsi pilot Jáchym Air? Propoj účet s <a href="https://crew.jachymair.com" target="_blank" rel="noopener">crew centrem</a> a na mapě budeš svítit zeleně.</p>
    <form id="crewForm"><div class="field"><label for="crewKey">API klíč z crew centra</label><input id="crewKey" type="password" required autocomplete="off">
    <small>Najdeš ho v crew centru ve svém profilu. Klíč slouží jen k jednorázovému ověření a nikde se neukládá.</small></div>
    <button class="btn">Propojit</button></form>`;
  $("crewForm").onsubmit = async e => {
    e.preventDefault();
    const btn = e.target.querySelector("button"); btn.disabled = true; btn.textContent = "Ověřuji…";
    const { data, error } = await sb.functions.invoke("jai-link", { body: { api_key: $("crewKey").value.trim() } });
    let text = data?.msg;
    if (error && !text) { try { text = (await error.context.json()).msg; } catch { text = error.message; } }
    if (data?.ok) { await loadJai(); updateNav(); renderCrewCard({ ok: true, text: `Propojeno! Vítej mezi piloty Jáchym Air${data.ident ? ", " + data.ident : ""}.` }); }
    else renderCrewCard({ ok: false, text: text || "Propojení se nepovedlo." });
  };
}

async function onAuthSubmit(e) {
  e.preventDefault();
  const btn = e.target.querySelector("button"); btn.disabled = true;
  const email = $("fEmail").value.trim(), password = $("fPass").value;
  try {
    if (authMode === "login") {
      const { error } = await sb.auth.signInWithPassword({ email, password });
      if (error) throw new Error(error.message.includes("Invalid") ? "Špatný e-mail nebo heslo." : error.message);
      if (appApi && !appState?.online) appApi.login(email, password);
      await loadMe(); location.hash = "#/ucet"; renderAccount({ ok: true, text: "Jsi přihlášen. Vítej zpět!" });
    } else {
      const username = $("fUser").value.trim();
      const { data: taken } = await sb.from("profiles").select("id").ilike("username", username.replace(/[_%\\]/g, m => "\\" + m)).limit(1);
      if (taken?.length) throw new Error("Toto uživatelské jméno už někdo má.");
      const { data, error } = await sb.auth.signUp({ email, password, options: { data: { username }, emailRedirectTo: BASE_URL } });
      if (error) throw new Error(error.message);
      if (!data.session) { authMode = "login"; renderAccount({ ok: true, text: "Účet vytvořen. Potvrď ho odkazem v e-mailu a pak se přihlas." }); return; }
      if (appApi) appApi.login(email, password);
      await loadMe(); renderAccount({ ok: true, text: "Účet vytvořen. Vítej na palubě!" });
    }
  } catch (err) { renderAccount({ ok: false, text: err.message }); }
}

async function onProfileSubmit(e) {
  e.preventDefault();
  const btn = e.target.querySelector("button"); btn.disabled = true;
  try {
    const stream = $("pStream").value.trim();
    if (stream && !/^https:\/\/(www\.|m\.)?(twitch\.tv|youtube\.com|youtu\.be|kick\.com)\//.test(stream)) throw new Error("Odkaz na stream musí vést na Twitch, YouTube nebo Kick (začínat https://).");
    const sbUser = $("pSb").value.trim();
    if (sbUser && !/^[A-Za-z0-9_.@-]{1,40}$/.test(sbUser)) throw new Error("Jméno ze SimBriefu obsahuje nepovolené znaky.");
    const upd = { username: $("pUser").value.trim(), stream_url: stream || null, simbrief_user: sbUser || null, va_default: $("pVa").value || null };
    const file = $("fAv").files[0];
    if (file) {
      if (file.size > 2 * 1024 * 1024) throw new Error("Obrázek je větší než 2 MB.");
      const ext = (file.name.split(".").pop() || "png").toLowerCase();
      const path = `${me.user.id}/avatar-${Date.now()}.${ext}`;
      const { error: upErr } = await sb.storage.from("avatars").upload(path, file, { upsert: false, contentType: file.type });
      if (upErr) throw new Error(upErr.message);
      upd.avatar_url = sb.storage.from("avatars").getPublicUrl(path).data.publicUrl;
    }
    const { error } = await sb.from("profiles").update(upd).eq("id", me.user.id);
    if (error) throw new Error(error.code === "23505" ? "Toto uživatelské jméno už někdo má." : error.message);
    await loadMe(); renderAccount({ ok: true, text: "Profil uložen." });
  } catch (err) { renderAccount({ ok: false, text: err.message }); }
}

/* ---------- start ---------- */
(async () => {
  if (!sb) { router(); return; }
  const slow = setTimeout(router, 2500);   // když web odpovídá pomalu, ukaž stránku i tak
  try { await Promise.all([loadJai(), loadMe()]); } catch (e) { console.error(e); }
  clearTimeout(slow);
  sb.auth.onAuthStateChange(ev => { setTimeout(loadMe, 0); if (ev === "PASSWORD_RECOVERY") location.hash = "#/nove-heslo"; });
  const social = () => { loadFriends(); updateBadges(); heartbeat(); };
  setTimeout(social, 500); setInterval(updateBadges, 30000); setInterval(heartbeat, 120000);
  setInterval(loadJai, 300000);
  if (AUTH_TYPE === "recovery") { location.hash = "#/nove-heslo"; return; }
  if (AUTH_TYPE === "signup" || AUTH_TYPE === "email_change") { location.hash = "#/ucet"; setTimeout(() => renderAccount({ ok: true, text: "E-mail potvrzen. Vítej na palubě!" }), 50); return; }
  if (AUTH_ERROR) { location.hash = "#/ucet"; setTimeout(() => renderAccount({ ok: false, text: "Odkaz z e-mailu nefunguje: " + AUTH_ERROR }), 50); return; }
  router();
})();
</script>
</body>
</html>
